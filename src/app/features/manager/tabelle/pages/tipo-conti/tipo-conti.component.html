<div class="page-shell">

  <app-sempione-page-header title="Tipo Conto"></app-sempione-page-header>

  <app-sempione-card>

    <app-sempione-card-header title="Tipi Conto (ST_ACCOUNTTYPE)">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
      </svg>
    </app-sempione-card-header>

    <div [formGroup]="filterForm">
      <app-sempione-toolbar>

        <div class="toolbar-field toolbar-field--sm">
          <dx-text-box
            formControlName="id"
            placeholder="Codice..."
            [showClearButton]="true"
            valueChangeEvent="input">
          </dx-text-box>
        </div>

        <div class="toolbar-field toolbar-field--lg">
          <dx-text-box
            formControlName="des"
            placeholder="Cerca per descrizione..."
            [showClearButton]="true"
            valueChangeEvent="input">
          </dx-text-box>
        </div>

        <div toolbar-actions>
          <app-sempione-button
            icon="search"
            hint="Cerca"
            variant="secondary"
            [disabled]="isLoading()"
            (clicked)="search()">
          </app-sempione-button>
          <app-sempione-button
            icon="revert"
            hint="Reset filtri"
            variant="secondary"
            (clicked)="resetFilters()">
          </app-sempione-button>
          <app-sempione-button
            icon="checklist"
            hint="Mostra tutti"
            variant="secondary"
            [disabled]="isLoading()"
            (clicked)="showAll()">
          </app-sempione-button>
          <span class="toolbar-sep" toolbar-actions></span>
          <app-sempione-button
            text="Nuovo"
            icon="add"
            variant="primary"
            [shadow]="true"
            (clicked)="openAddPopup()">
          </app-sempione-button>
        </div>

      </app-sempione-toolbar>
    </div>

    <app-sempione-data-grid
      [dataSource]="items()"
      [columns]="gridColumns"
      keyExpr="id"
      [isLoading]="isLoading()"
      [error]="error()"
      [showEditAction]="true"
      noDataText="Nessun risultato trovato."
      (rowEdit)="openEditPopup($event)">
    </app-sempione-data-grid>

  </app-sempione-card>

</div>

<!-- ── Popup Aggiungi / Modifica ── -->
<app-sempione-popup
  [(visible)]="isFormPopupVisible"
  [title]="isEditMode() ? 'Modifica Tipo Conto — ' + selectedId() : 'Nuovo Tipo Conto'"
  [maxWidth]="480"
  (hidden)="closeFormPopup()">

  <div [formGroup]="editForm" class="popup-layout">

    <app-sempione-popup-card title="Dati tipo conto">
      <div class="popup-fields-grid popup-fields-grid--1col">

        <app-sempione-field-group label="ID" [required]="true" [locked]="isEditMode()">
          <dx-text-box
            formControlName="id"
            [readOnly]="isEditMode()"
            [maxLength]="10"
            [showClearButton]="!isEditMode()"
            placeholder="Max 10 caratteri...">
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Descrizione" [required]="true">
          <dx-text-box
            formControlName="des"
            [maxLength]="50"
            [showClearButton]="true"
            placeholder="Descrizione...">
          </dx-text-box>
        </app-sempione-field-group>

      </div>
      <app-sempione-alert [message]="saveError()"></app-sempione-alert>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      [saveText]="isEditMode() ? 'Salva Modifiche' : 'Crea Tipo Conto'"
      [isSaving]="isSaving()"
      (save)="save()"
      (cancel)="closeFormPopup()">
    </app-sempione-popup-action-bar>

  </div>

</app-sempione-popup>
