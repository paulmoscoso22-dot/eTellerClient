<div class="page-shell">

  <!-- ── Main Card ── -->
  <section class="card-section">

    <div class="sempione-card-header">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
      </svg>
      <h2 class="card-title">Tipi Conto (ST_ACCOUNTTYPE)</h2>
    </div>
    <div class="gold-divider"></div>

    <!-- ── Filtri ── -->
    <div class="card-toolbar" [formGroup]="filterForm">
      <div class="toolbar-row">

        <span class="filter-label">ID:</span>
        <dx-text-box
          formControlName="id"
          [showClearButton]="true"
          placeholder="Codice..."
          class="filter-control filter-control--sm">
        </dx-text-box>

        <span class="filter-label">Descrizione:</span>
        <dx-text-box
          formControlName="des"
          [showClearButton]="true"
          placeholder="Descrizione..."
          class="filter-control filter-control--lg">
        </dx-text-box>

        <div class="toolbar-row-spacer"></div>

        <div class="toolbar-actions">
          <dx-button
            class="btn-reset"
            text="Reset"
            stylingMode="outlined"
            icon="revert"
            (onClick)="resetFilters()">
          </dx-button>
          <dx-button
            class="btn-showall"
            text="Mostra tutti"
            stylingMode="outlined"
            icon="checklist"
            [disabled]="isLoading()"
            (onClick)="showAll()">
          </dx-button>
          <dx-button
            class="btn-cerca"
            text="Cerca"
            type="default"
            stylingMode="contained"
            icon="search"
            [disabled]="isLoading()"
            (onClick)="search()">
          </dx-button>
          <dx-button
            class="btn-add"
            text="Aggiungi"
            stylingMode="outlined"
            icon="add"
            (onClick)="openAddPopup()">
          </dx-button>
        </div>

      </div>
    </div>

    <!-- ── Griglia ── -->
    <div class="card-body card-body--grid">

      @if (error()) {
        <div class="grid-message grid-message--error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          {{ error() }}
        </div>
      }

      @if (isLoading()) {
        <div class="grid-message grid-message--loading">
          <svg class="spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
          </svg>
          Caricamento in corso...
        </div>
      }

      @if (!isLoading() && !error()) {
        <dx-data-grid
          [dataSource]="items()"
          [showBorders]="false"
          [columnAutoWidth]="true"
          [rowAlternationEnabled]="true"
          [hoverStateEnabled]="true"
          [height]="'100%'"
          keyExpr="id"
          noDataText="Nessun elemento trovato. Inserire i criteri di ricerca e premere Cerca.">

          <dxo-selection mode="single"></dxo-selection>
          <dxo-paging [pageSize]="30"></dxo-paging>
          <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[20, 30, 50, 100]" [showInfo]="true"></dxo-pager>

          <dxi-column dataField="id"  caption="ID"          alignment="left" [width]="140"></dxi-column>
          <dxi-column dataField="des" caption="Descrizione" alignment="left"></dxi-column>

          <dxi-column
            caption="Azioni"
            [width]="70"
            [allowSorting]="false"
            [allowFiltering]="false"
            alignment="center"
            cellTemplate="actionsTemplate">
          </dxi-column>

          <div *dxTemplate="let cell of 'actionsTemplate'" class="actions-cell">
            <button class="action-btn action-btn--edit" title="Modifica" (click)="openEditPopup(cell.data)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
          </div>

          <dxo-load-panel [enabled]="false"></dxo-load-panel>

        </dx-data-grid>
      }

    </div>

  </section>

</div>

<!-- ══ Popup Aggiungi / Modifica ══ -->
<dx-popup
  [(visible)]="isFormPopupVisible"
  [showTitle]="true"
  [title]="isEditMode() ? ('Modifica — ' + selectedId()) : 'Nuovo tipo conto'"
  [dragEnabled]="true"
  [hideOnOutsideClick]="false"
  [showCloseButton]="true"
  [width]="480"
  [height]="'auto'"
  [maxHeight]="'92vh'"
  (onHidden)="closeFormPopup()">

  <div *dxTemplate="let data of 'content'">
    <div class="popup-layout" [formGroup]="editForm">

      <section class="popup-card">
        <h3 class="popup-card-title">Dati tipo conto</h3>
        <div class="popup-fields-grid">

          <div class="popup-field-group">
            <label class="popup-field-label">ID <span class="req">*</span></label>
            <dx-text-box
              formControlName="id"
              [readOnly]="isEditMode()"
              [maxLength]="10"
              [showClearButton]="!isEditMode()"
              placeholder="Max 10 caratteri...">
            </dx-text-box>
          </div>

          <div class="popup-field-group">
            <label class="popup-field-label">Descrizione <span class="req">*</span></label>
            <dx-text-box
              formControlName="des"
              [maxLength]="50"
              [showClearButton]="true"
              placeholder="Descrizione...">
            </dx-text-box>
          </div>

        </div>

        @if (saveError()) {
          <div class="save-error-message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            {{ saveError() }}
          </div>
        }
      </section>

      <!-- ── Action bar ── -->
      <div class="popup-action-bar">
        <div class="popup-actions-secondary"></div>
        <div class="popup-actions-primary">
          <dx-button
            class="btn-action-close"
            text="Annulla"
            icon="close"
            (onClick)="closeFormPopup()">
          </dx-button>
          <dx-button
            class="btn-action-save"
            [text]="isSaving() ? 'Salvataggio...' : 'Salva'"
            type="default"
            stylingMode="contained"
            icon="save"
            [disabled]="isSaving()"
            (onClick)="save()">
          </dx-button>
        </div>
      </div>

    </div>
  </div>
</dx-popup>
