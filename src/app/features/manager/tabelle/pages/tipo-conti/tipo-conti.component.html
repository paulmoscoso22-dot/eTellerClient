<app-sempione-page-shell title="Tipo Conto">

  <app-sempione-card>

    <app-sempione-card-header title="Tipi Conto">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
      </svg>
    </app-sempione-card-header>

    <div [formGroup]="filterForm">
      <app-sempione-toolbar>

        <app-sempione-id-des-filter
          idPlaceholder="Codice..."
          desPlaceholder="Cerca per descrizione..."
          (enterKey)="search()">
        </app-sempione-id-des-filter>

        <app-sempione-crud-toolbar-actions
          [showAll]="true"
          [isLoading]="isLoading()"
          (search)="search()"
          (reset)="resetFilters()"
          (listAll)="showAll()"
          (add)="openPopup()">
        </app-sempione-crud-toolbar-actions>

      </app-sempione-toolbar>
    </div>

    <app-sempione-data-grid
      [dataSource]="items()"
      [columns]="gridColumns"
      keyExpr="id"
      [isLoading]="isLoading()"
      [error]="error()"
      [showEditAction]="true"
      [showTraceAction]="true"
      noDataText="Nessun tipo conto trovato."
      (rowEdit)="openEditPopup($event)"
      (rowTrace)="onTrace($event.id)">
    </app-sempione-data-grid>

  </app-sempione-card>

</app-sempione-page-shell>

<app-sempione-simple-crud-popup
  [(visible)]="isFormPopupVisible"
  [mode]="isEditMode() ? 'edit' : 'new'"
  [item]="popupItem()"
  tableName="ST_ACCOUNTTYPE"
  entityLabel="Tipo Conto"
  newTitle="Nuovo Tipo Conto"
  cardTitle="Dati tipo conto"
  [idMaxLength]="10"
  [onInsert]="doInsert"
  [onUpdate]="doUpdate"
  (saved)="search()"
  (storico)="onTrace($event)">
</app-sempione-simple-crud-popup>
