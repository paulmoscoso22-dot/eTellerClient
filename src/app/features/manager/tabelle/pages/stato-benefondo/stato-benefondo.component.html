<div class="page-shell">

  <!-- ── Titolo pagina ── -->
  <div class="page-header-row">
    <h1 class="page-title">Stato Bene Fondo</h1>
  </div>

  <!-- ── Card Main ── -->
  <section class="card-section">

    <div class="sempione-card-header">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      <h2 class="card-title">Stato Bene Fondo</h2>
    </div>
    <div class="gold-divider"></div>

    <!-- ── Toolbar ── -->
    <div class="card-toolbar" [formGroup]="filterForm">
      <div class="toolbar-inner">

        <div class="toolbar-filters">
          <div class="toolbar-field">
            <span class="filter-label">ID</span>
            <dx-text-box
              formControlName="id"
              [showClearButton]="true"
              placeholder="Numero..."
              valueChangeEvent="input">
            </dx-text-box>
          </div>
          <div class="toolbar-field toolbar-field--lg">
            <span class="filter-label">Descrizione</span>
            <dx-text-box
              formControlName="des"
              [showClearButton]="true"
              placeholder="Descrizione..."
              valueChangeEvent="input">
            </dx-text-box>
          </div>
        </div>

        <div class="toolbar-actions">
          <dx-button
            icon="search"
            hint="Cerca"
            stylingMode="outlined"
            class="btn-fin-secondary"
            [disabled]="isLoading()"
            (onClick)="search()">
          </dx-button>
          <dx-button
            icon="revert"
            hint="Ripristina ricerca"
            stylingMode="outlined"
            class="btn-fin-secondary"
            (onClick)="resetFilters()">
          </dx-button>
          <dx-button
            class="btn-fin-primary action-shadow"
            text="Nuovo"
            stylingMode="contained"
            (onClick)="openAddPopup()">
          </dx-button>
        </div>

      </div>
    </div>

    <!-- ── Grid ── -->
    <div class="card-body card-body--grid">

      @if (error()) {
        <div class="grid-message grid-message--error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          {{ error() }}
        </div>
      }

      @if (isLoading()) {
        <div class="grid-message grid-message--loading">
          <svg class="spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
          </svg>
          Caricamento in corso...
        </div>
      }

      @if (!isLoading() && !error()) {
        <dx-data-grid
          [dataSource]="items()"
          [showBorders]="false"
          [showColumnLines]="false"
          [showRowLines]="true"
          [columnAutoWidth]="true"
          [rowAlternationEnabled]="true"
          [hoverStateEnabled]="true"
          [height]="'100%'"
          keyExpr="id"
          noDataText="Nessun elemento trovato. Inserire i criteri di ricerca e premere Cerca.">

          <dxo-selection mode="single"></dxo-selection>
          <dxo-paging [pageSize]="30"></dxo-paging>
          <dxo-pager
            [showInfo]="true"
            infoText="{2} stati"
            [showPageSizeSelector]="true"
            [allowedPageSizes]="[20, 30, 50, 100]"
            [showNavigationButtons]="true"
            displayMode="full">
          </dxo-pager>

          <dxi-column dataField="id"  caption="ID"          alignment="right" [width]="100" dataType="number"></dxi-column>
          <dxi-column dataField="des" caption="Descrizione" alignment="left"></dxi-column>

          <dxi-column
            caption="Azioni"
            [width]="110"
            [allowSorting]="false"
            [allowFiltering]="false"
            alignment="center"
            cellTemplate="actionsTemplate">
          </dxi-column>

          <div *dxTemplate="let cell of 'actionsTemplate'" class="actions-cell">
            <button class="action-btn action-btn--view" title="Visualizza" (click)="openViewPopup(cell.data)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
            <button class="action-btn action-btn--edit" title="Modifica" (click)="openEditPopup(cell.data)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
            <button class="action-btn action-btn--trace" title="Storico" (click)="onTrace()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
            </button>
          </div>

          <dxo-load-panel [enabled]="false"></dxo-load-panel>

        </dx-data-grid>
      }

    </div>

  </section>
</div>

<!-- ══════════════════════════════════════
     Popup: Dettaglio / Modifica / Nuovo Stato Bene Fondo
     ══════════════════════════════════════ -->
<dx-popup
  [(visible)]="isFormPopupVisible"
  [showTitle]="true"
  [title]="popupMode() === 'edit' ? 'Modifica Stato Bene Fondo — ' + selectedId()
         : popupMode() === 'view' ? 'Dettaglio Stato Bene Fondo — ' + selectedId()
         : 'Nuovo Stato Bene Fondo'"
  [dragEnabled]="true"
  [hideOnOutsideClick]="false"
  [showCloseButton]="true"
  [width]="480"
  [height]="'auto'"
  [maxHeight]="'90vh'"
  (onHidden)="closeFormPopup()">

  <div *dxTemplate="let data of 'content'">
    <form [formGroup]="editForm"
          class="popup-layout"
          [class.popup-view-mode]="popupMode() === 'view'">

      <!-- ── Card: Dati stato ── -->
      <section class="popup-card">
        <h3 class="popup-card-title">Dati stato bene fondo</h3>
        <div class="popup-fields-grid">

          <div class="popup-field-group" [class.field-id-locked]="popupMode() !== 'new'">
            <label class="popup-field-label">ID (intero) *</label>
            <dx-number-box
              formControlName="id"
              [readOnly]="popupMode() !== 'new'"
              [showClearButton]="popupMode() === 'new'"
              [showSpinButtons]="popupMode() === 'new'"
              [min]="0"
              format="#0"
              placeholder="Numero intero...">
            </dx-number-box>
          </div>

          <div class="popup-field-group">
            <label class="popup-field-label">Descrizione *</label>
            <dx-text-box
              formControlName="des"
              [readOnly]="popupMode() === 'view'"
              [maxLength]="50"
              [showClearButton]="popupMode() !== 'view'"
              placeholder="Max 50 caratteri...">
            </dx-text-box>
          </div>

        </div>

        @if (saveError()) {
          <div class="save-error-message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            {{ saveError() }}
          </div>
        }
      </section>

      <!-- ── Action Bar ── -->
      <div class="popup-action-bar">

        <div class="popup-actions-secondary">
          @if (popupMode() !== 'new') {
            <dx-button
              class="btn-fin-secondary"
              text="Storico"
              icon="clock"
              stylingMode="outlined"
              (onClick)="onTrace()">
            </dx-button>
          }
        </div>

        <div class="popup-actions-primary">
          <dx-button
            [text]="popupMode() === 'new' ? 'Annulla' : 'Chiudi'"
            stylingMode="outlined"
            class="btn-fin-secondary"
            (onClick)="closeFormPopup()">
          </dx-button>
          @if (popupMode() !== 'view') {
            <dx-button
              [text]="isSaving() ? 'Salvataggio...' : (popupMode() === 'new' ? 'Crea Stato' : 'Salva Modifiche')"
              [icon]="popupMode() === 'new' ? 'plus' : 'save'"
              stylingMode="contained"
              class="btn-fin-primary"
              [disabled]="isSaving()"
              (onClick)="save()">
            </dx-button>
          }
        </div>

      </div>

    </form>
  </div>
</dx-popup>
