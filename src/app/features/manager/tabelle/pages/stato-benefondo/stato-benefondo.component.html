<app-sempione-page-shell title="Stato Bene Fondo">

  <app-sempione-card>

    <app-sempione-card-header title="Stato Bene Fondo (ST_BEFSTATUS)">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
    </app-sempione-card-header>

    <div [formGroup]="filterForm">
      <app-sempione-toolbar>

        <app-sempione-id-des-filter
          idPlaceholder="ID..."
          desPlaceholder="Cerca per descrizione..."
          (enterKey)="search()">
        </app-sempione-id-des-filter>

        <app-sempione-crud-toolbar-actions
          [showAll]="true"
          [isLoading]="isLoading()"
          (search)="search()"
          (reset)="resetFilters()"
          (listAll)="showAll()"
          (add)="openAddPopup()">
        </app-sempione-crud-toolbar-actions>

      </app-sempione-toolbar>
    </div>

    <app-sempione-data-grid
      [dataSource]="items()"
      [columns]="gridColumns"
      keyExpr="id"
      [isLoading]="isLoading()"
      [error]="error()"
      [showViewAction]="true"
      [showEditAction]="true"
      [showTraceAction]="true"
      noDataText="Nessun risultato trovato."
      (rowView)="openViewPopup($event)"
      (rowEdit)="openEditPopup($event)"
      (rowTrace)="onTrace($event.id)">
    </app-sempione-data-grid>

  </app-sempione-card>

</app-sempione-page-shell>

<app-sempione-simple-crud-popup
  [(visible)]="isFormPopupVisible"
  [mode]="popupMode()"
  [item]="popupItem()"
  tableName="ST_BEFSTATUS"
  entityLabel="Stato Bene Fondo"
  newTitle="Nuovo Stato Bene Fondo"
  cardTitle="Dati stato bene fondo"
  idInputType="number"
  idLabel="ID (intero)"
  idPlaceholder="Numero intero..."
  [onInsert]="doInsert"
  [onUpdate]="doUpdate"
  (saved)="onSaved()"
  (storico)="onTrace($event)">
</app-sempione-simple-crud-popup>
