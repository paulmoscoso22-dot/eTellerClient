<div class="page-shell">

  <app-sempione-page-header title="Gestione Servizi"></app-sempione-page-header>

  <app-sempione-card>

    <app-sempione-card-header title="Elenco Servizi">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M6.34 17.66a8 8 0 1 1 11.32 0"></path>
        <line x1="12" y1="22" x2="12" y2="17"></line>
      </svg>
    </app-sempione-card-header>

    <app-sempione-toolbar>
      <div class="toolbar-field toolbar-field--lg">
        <dx-text-box
          [value]="searchValue()"
          placeholder="Cerca per ID o descrizione..."
          [showClearButton]="true"
          valueChangeEvent="input"
          (onValueChanged)="onSearchChanged($event)">
        </dx-text-box>
      </div>
      <div toolbar-actions>
        <app-sempione-button
          icon="search"
          hint="Cerca"
          variant="secondary"
          (clicked)="loadServizi()">
        </app-sempione-button>
        <app-sempione-button
          icon="revert"
          hint="Ripristina ricerca"
          variant="secondary"
          (clicked)="onResetForm()">
        </app-sempione-button>
        <span class="toolbar-sep" toolbar-actions></span>
        <app-sempione-button
          text="Nuovo Servizio"
          icon="add"
          variant="primary"
          [shadow]="true"
          (clicked)="openNewPopup()">
        </app-sempione-button>
      </div>
    </app-sempione-toolbar>

    <!-- Grid kept as raw dx-data-grid: has bool templates and drop-down-button actions -->
    <div class="card-body card-body--grid">
      <dx-data-grid
        [dataSource]="filteredServizi()"
        [showBorders]="false"
        [rowAlternationEnabled]="true"
        [hoverStateEnabled]="true"
        [wordWrapEnabled]="true"
        [height]="'100%'"
        keyExpr="serId"
        noDataText="Nessun servizio trovato.">

        <dxo-selection mode="single"></dxo-selection>
        <dxo-paging [pageSize]="15"></dxo-paging>
        <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[15, 25, 50]" [showInfo]="true"></dxo-pager>
        <dxo-load-panel [enabled]="false"></dxo-load-panel>

        <dxi-column dataField="serId"      caption="ID"               [width]="130" alignment="left"></dxi-column>
        <dxi-column dataField="serDes"     caption="Descrizione"                    alignment="left"></dxi-column>
        <dxi-column dataField="serRunning" caption="Running"   [width]="90"  alignment="center" [allowSorting]="false" [allowFiltering]="false" cellTemplate="boolTemplate"></dxi-column>
        <dxi-column dataField="serTrace"   caption="Traccia"   [width]="90"  alignment="center" [allowSorting]="false" [allowFiltering]="false" cellTemplate="boolTemplate"></dxi-column>
        <dxi-column dataField="serEmail"   caption="Email"     [width]="80"  alignment="center" [allowSorting]="false" [allowFiltering]="false" cellTemplate="boolTemplate"></dxi-column>
        <dxi-column dataField="serEnable"  caption="Abilitato" [width]="90"  alignment="center" [allowSorting]="false" [allowFiltering]="false" cellTemplate="boolTemplate"></dxi-column>
        <dxi-column dataField="serLastRun" caption="Ultima esecuzione" [width]="160" alignment="left"></dxi-column>

        <dxi-column
          caption="Azioni"
          [width]="90"
          [allowSorting]="false"
          [allowFiltering]="false"
          alignment="center"
          cellTemplate="actionsTemplate">
        </dxi-column>

        <div *dxTemplate="let cell of 'boolTemplate'" class="bool-cell">
          @if (cell.value) {
            <span class="bool-pill bool-pill--yes">✓</span>
          } @else {
            <span class="bool-pill bool-pill--no">—</span>
          }
        </div>

        <div *dxTemplate="let cell of 'actionsTemplate'" class="actions-cell">
          <app-sempione-row-actions
            [showView]="true"
            [showEdit]="true"
            [showTrace]="true"
            [showDelete]="true"
            (view)="onTableAction('view', cell.data)"
            (edit)="onTableAction('edit', cell.data)"
            (trace)="onTableAction('trace', cell.data)"
            (delete)="onTableAction('delete', cell.data)">
          </app-sempione-row-actions>
        </div>

      </dx-data-grid>
    </div>

  </app-sempione-card>

</div>

<!-- ── Popup Dettaglio / Form Servizio ── -->
<app-sempione-popup
  [(visible)]="isDetailPopupVisible"
  [title]="popupMode() === 'edit' ? 'Modifica Servizio — ' + selectedSerId()
         : popupMode() === 'view' ? 'Dettaglio Servizio — ' + selectedSerId()
         : 'Nuovo Servizio'"
  [maxWidth]="700"
  (hidden)="closePopup()">

  <form [formGroup]="serviziForm" class="popup-layout">

    <app-sempione-popup-card title="Dati Servizio">
      <div class="popup-fields-grid popup-fields-grid--2col">

        <app-sempione-field-group label="Codice" [required]="true" [locked]="popupMode() !== 'new'">
          <dx-text-box
            formControlName="serId"
            [readOnly]="popupMode() !== 'new'"
            [showClearButton]="popupMode() === 'new'">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </app-sempione-field-group>

        <div></div>

        <app-sempione-field-group label="Descrizione" [required]="true" class="popup-col-span-2">
          <dx-text-area
            formControlName="serDes"
            [height]="80"
            [readOnly]="popupMode() === 'view'">
          </dx-text-area>
        </app-sempione-field-group>

        @if (popupMode() !== 'new') {
          <app-sempione-field-group label="Ultimo errore" class="popup-col-span-2">
            <dx-text-area
              formControlName="serDeserr"
              [height]="56"
              [readOnly]="true">
            </dx-text-area>
          </app-sempione-field-group>
        }

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-card title="Configurazione">
      <div class="popup-fields-grid popup-fields-grid--2col">

        <app-sempione-field-group label="Email di sistema">
          <dx-text-box formControlName="serSyserrmail" [readOnly]="popupMode() === 'view'" [showClearButton]="popupMode() !== 'view'"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Email applicazione">
          <dx-text-box formControlName="serApperrmail" [readOnly]="popupMode() === 'view'" [showClearButton]="popupMode() !== 'view'"></dx-text-box>
        </app-sempione-field-group>

      </div>

      <div class="popup-flags-row" style="margin-top: 14px;">
        <div class="popup-flag-group">
          <label class="popup-field-label">Invio Email</label>
          <dx-check-box formControlName="serEmail" [readOnly]="popupMode() === 'view'"></dx-check-box>
        </div>
        <div class="popup-flag-group">
          <label class="popup-field-label">Abilitato</label>
          <dx-check-box formControlName="serEnable" [readOnly]="popupMode() === 'view'"></dx-check-box>
        </div>
        <div class="popup-flag-group">
          <label class="popup-field-label">Attiva Trace</label>
          <dx-check-box formControlName="serTrace" [readOnly]="popupMode() === 'view'"></dx-check-box>
        </div>
      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      [cancelText]="popupMode() === 'new' ? 'Annulla' : 'Chiudi'"
      [saveText]="popupMode() === 'new' ? 'Aggiungi' : 'Salva'"
      [showSave]="popupMode() !== 'view'"
      [isSaving]="false"
      (save)="popupMode() === 'new' ? onSubmit() : onUpdate()"
      (cancel)="closePopup()">
      @if (popupMode() !== 'new') {
        <app-sempione-button secondary-actions text="Storico" icon="clock" variant="secondary" (clicked)="onTrace()"></app-sempione-button>
      }
    </app-sempione-popup-action-bar>

  </form>

</app-sempione-popup>
