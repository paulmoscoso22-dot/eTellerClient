<div class="page-shell">

  <app-sempione-page-header title="Tipo Device"></app-sempione-page-header>

  <app-sempione-card>

    <app-sempione-card-header title="Tipi Device (sys_DEVICETYPE)">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
        <line x1="12" y1="18" x2="12.01" y2="18"></line>
      </svg>
    </app-sempione-card-header>

    <div [formGroup]="filterForm">
      <app-sempione-toolbar>

        <app-sempione-id-des-filter
          idPlaceholder="Codice..."
          desPlaceholder="Descrizione..."
          (enterKey)="search()">
        </app-sempione-id-des-filter>

        <app-sempione-crud-toolbar-actions
          [showAll]="true"
          [isLoading]="isLoading()"
          (search)="search()"
          (reset)="resetFilters()"
          (listAll)="showAll()"
          (add)="openAddPopup()">
        </app-sempione-crud-toolbar-actions>

      </app-sempione-toolbar>
    </div>

    <app-sempione-data-grid
      [dataSource]="items()"
      [columns]="gridColumns"
      keyExpr="id"
      [isLoading]="isLoading()"
      [error]="error()"
      [showViewAction]="true"
      [showEditAction]="true"
      [showTraceAction]="true"
      noDataText="Nessun risultato trovato."
      (rowView)="openViewPopup($event)"
      (rowEdit)="openEditPopup($event)"
      (rowTrace)="onTrace($event.id)">
    </app-sempione-data-grid>

  </app-sempione-card>

</div>

<app-sempione-simple-crud-popup
  [(visible)]="isFormPopupVisible"
  [mode]="popupMode()"
  [item]="popupItem()"
  tableName="sys_DEVICETYPE"
  entityLabel="Tipo Device"
  newTitle="Nuovo Tipo Device"
  cardTitle="Dati tipo device"
  [onInsert]="doInsert"
  [onUpdate]="doUpdate"
  (saved)="search()"
  (storico)="onTrace($event)">
</app-sempione-simple-crud-popup>
