<div class="page-shell">

  <app-sempione-page-header title="Tipo Device"></app-sempione-page-header>

  <app-sempione-card>

    <app-sempione-card-header title="Tipi Device (sys_DEVICETYPE)">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
        <line x1="12" y1="18" x2="12.01" y2="18"></line>
      </svg>
    </app-sempione-card-header>

    <div [formGroup]="filterForm">
      <app-sempione-toolbar>

        <div class="toolbar-field toolbar-field--sm">
          <dx-text-box
            formControlName="id"
            placeholder="Codice..."
            [showClearButton]="true"
            (onEnterKey)="search()">
          </dx-text-box>
        </div>

        <div class="toolbar-field toolbar-field--lg">
          <dx-text-box
            formControlName="des"
            placeholder="Descrizione..."
            [showClearButton]="true"
            (onEnterKey)="search()">
          </dx-text-box>
        </div>

        <div toolbar-actions>
          <app-sempione-button
            icon="search"
            hint="Cerca"
            variant="secondary"
            [disabled]="isLoading()"
            (clicked)="search()">
          </app-sempione-button>
          <app-sempione-button
            icon="revert"
            hint="Reset filtri"
            variant="secondary"
            (clicked)="resetFilters()">
          </app-sempione-button>
          <app-sempione-button
            icon="checklist"
            hint="Mostra tutti"
            variant="secondary"
            [disabled]="isLoading()"
            (clicked)="showAll()">
          </app-sempione-button>
          <span class="toolbar-sep" toolbar-actions></span>
          <app-sempione-button
            text="Nuovo"
            icon="add"
            variant="primary"
            [shadow]="true"
            (clicked)="openAddPopup()">
          </app-sempione-button>
        </div>

      </app-sempione-toolbar>
    </div>

    <app-sempione-data-grid
      [dataSource]="items()"
      [columns]="gridColumns"
      keyExpr="id"
      [isLoading]="isLoading()"
      [error]="error()"
      [showViewAction]="true"
      [showEditAction]="true"
      [showTraceAction]="true"
      noDataText="Nessun risultato trovato."
      (rowView)="openViewPopup($event)"
      (rowEdit)="openEditPopup($event)"
      (rowTrace)="onTrace($event.id)">
    </app-sempione-data-grid>

  </app-sempione-card>

</div>

<!-- ── Popup Aggiungi / Visualizza / Modifica ── -->
<app-sempione-popup
  [(visible)]="isFormPopupVisible"
  [title]="popupMode() === 'edit' ? 'Modifica Tipo Device — ' + selectedId()
         : popupMode() === 'view' ? 'Dettaglio Tipo Device — ' + selectedId()
         : 'Nuovo Tipo Device'"
  [maxWidth]="480"
  (hidden)="closeFormPopup()">

  <div [formGroup]="editForm" class="popup-layout">

    <app-sempione-popup-card title="Dati tipo device">
      <div class="popup-fields-grid popup-fields-grid--1col">

        <app-sempione-field-group label="ID" [required]="true" [locked]="popupMode() !== 'add'">
          <dx-text-box
            formControlName="id"
            [readOnly]="popupMode() !== 'add'"
            [maxLength]="50"
            [showClearButton]="popupMode() === 'add'"
            placeholder="Max 50 caratteri...">
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Descrizione" [required]="true">
          <dx-text-box
            formControlName="des"
            [readOnly]="popupMode() === 'view'"
            [maxLength]="50"
            [showClearButton]="popupMode() !== 'view'"
            placeholder="Descrizione...">
          </dx-text-box>
        </app-sempione-field-group>

      </div>
      <app-sempione-alert [message]="saveError()"></app-sempione-alert>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      [cancelText]="popupMode() === 'add' ? 'Annulla' : 'Chiudi'"
      [saveText]="popupMode() === 'edit' ? 'Salva Modifiche' : 'Crea Device'"
      [showSave]="popupMode() !== 'view'"
      [isSaving]="isSaving()"
      (save)="save()"
      (cancel)="closeFormPopup()">
      @if (popupMode() !== 'add') {
        <app-sempione-button
          secondary-actions
          text="Storico"
          icon="clock"
          variant="secondary"
          (clicked)="onTrace(selectedId()!)">
        </app-sempione-button>
      }
    </app-sempione-popup-action-bar>

  </div>

</app-sempione-popup>
