<div class="page-shell">

  <!-- ── Titolo pagina ── -->
  <div class="page-header-row">
    <h1 class="page-title">Livello Accesso Funzioni</h1>
  </div>

  <!-- ── Card Main ── -->
  <section class="card-section">

    <div class="sempione-card-header">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <h2 class="card-title">Elenco Livelli Accesso (ST_FUNACCTYP)</h2>
    </div>
    <div class="gold-divider"></div>

    <!-- ── Toolbar ── -->
    <div class="card-toolbar">
      <div class="toolbar-inner" [formGroup]="filterForm">

        <div class="toolbar-filters">
          <div class="toolbar-field toolbar-field--sm">
            <dx-text-box
              formControlName="id"
              placeholder="ID..."
              [showClearButton]="true"
              valueChangeEvent="input">
            </dx-text-box>
          </div>
          <div class="toolbar-field toolbar-field--lg">
            <dx-text-box
              formControlName="des"
              placeholder="Cerca per descrizione..."
              [showClearButton]="true"
              valueChangeEvent="input">
            </dx-text-box>
          </div>
        </div>

        <div class="toolbar-actions">
          <dx-button
            icon="search"
            hint="Cerca"
            stylingMode="outlined"
            class="btn-fin-secondary"
            [disabled]="isLoading()"
            (onClick)="search()">
          </dx-button>
          <dx-button
            icon="revert"
            hint="Reset filtri"
            stylingMode="outlined"
            class="btn-fin-secondary"
            (onClick)="resetFilters()">
          </dx-button>
          <dx-button
            icon="checklist"
            hint="Mostra tutti"
            stylingMode="outlined"
            class="btn-fin-secondary"
            [disabled]="isLoading()"
            (onClick)="showAll()">
          </dx-button>
          <dx-button
            class="btn-fin-primary action-shadow"
            text="Nuovo"
            icon="add"
            stylingMode="contained"
            (onClick)="openAddPopup()">
          </dx-button>
        </div>

      </div>
    </div>

    <!-- ── Griglia ── -->
    <div class="card-body card-body--grid">

      @if (error()) {
        <div class="grid-message grid-message--error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          {{ error() }}
        </div>
      }

      @if (isLoading()) {
        <div class="grid-message grid-message--loading">
          <svg class="spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
          </svg>
          Caricamento in corso...
        </div>
      }

      @if (!isLoading() && !error()) {
        <dx-data-grid
          [dataSource]="items()"
          [showBorders]="false"
          [columnAutoWidth]="true"
          [rowAlternationEnabled]="true"
          [hoverStateEnabled]="true"
          [height]="'100%'"
          keyExpr="id"
          noDataText="Nessun elemento trovato. Inserire i criteri di ricerca e premere Cerca.">

          <dxo-selection mode="single"></dxo-selection>
          <dxo-paging [pageSize]="30"></dxo-paging>
          <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[20, 30, 50, 100]" [showInfo]="true"></dxo-pager>

          <dxi-column dataField="id"  caption="ID"          alignment="right" [width]="100" dataType="number"></dxi-column>
          <dxi-column dataField="des" caption="Descrizione" alignment="left"></dxi-column>

          <dxi-column
            caption="Azioni"
            [width]="95"
            [allowSorting]="false"
            [allowFiltering]="false"
            alignment="center"
            cellTemplate="actionsTemplate">
          </dxi-column>

          <div *dxTemplate="let cell of 'actionsTemplate'" class="actions-cell">
            <button class="action-btn action-btn--view" title="Dettaglio"
                    (click)="openEditPopup(cell.data)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
            <button class="action-btn action-btn--edit" title="Modifica"
                    (click)="openEditPopup(cell.data)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
            <button class="action-btn action-btn--delete" title="Elimina">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6l-1 14H6L5 6"></path>
                <path d="M10 11v6M14 11v6"></path>
                <path d="M9 6V4h6v2"></path>
              </svg>
            </button>
          </div>

          <dxo-load-panel [enabled]="false"></dxo-load-panel>

        </dx-data-grid>
      }

    </div>

  </section>

</div>

<!-- ══════════════════════════════════════
     Popup: Dettaglio / Form
     ══════════════════════════════════════ -->
<dx-popup
  [(visible)]="isFormPopupVisible"
  [showTitle]="true"
  [title]="isEditMode() ? 'Modifica — ID ' + selectedId() : 'Nuovo livello accesso'"
  [dragEnabled]="true"
  [hideOnOutsideClick]="false"
  [showCloseButton]="true"
  [width]="440"
  [height]="'auto'"
  [maxHeight]="'92vh'"
  (onHidden)="closeFormPopup()">

  <div *dxTemplate="let data of 'content'">
    <form [formGroup]="editForm" class="popup-layout">

      <!-- ── Card: Dati ── -->
      <section class="popup-card">
        <h3 class="popup-card-title">Dati livello accesso</h3>
        <div class="popup-fields-grid popup-fields-grid--1col">

          <div class="popup-field-group" [class.field-id-locked]="isEditMode()">
            <label class="popup-field-label">ID (intero) <span class="req">*</span></label>
            <dx-number-box
              formControlName="id"
              [readOnly]="isEditMode()"
              [showClearButton]="!isEditMode()"
              [showSpinButtons]="!isEditMode()"
              [min]="0"
              format="#0"
              placeholder="Numero intero...">
            </dx-number-box>
          </div>

          <div class="popup-field-group">
            <label class="popup-field-label">Descrizione <span class="req">*</span></label>
            <dx-text-box
              formControlName="des"
              [maxLength]="50"
              [showClearButton]="true"
              placeholder="Descrizione...">
            </dx-text-box>
          </div>

        </div>

        @if (saveError()) {
          <div class="save-error-message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            {{ saveError() }}
          </div>
        }
      </section>

      <!-- ── Action Bar ── -->
      <div class="popup-action-bar">

        <div class="popup-actions-secondary">
          @if (isEditMode()) {
            <dx-button
              text="Traccia"
              icon="chart"
              stylingMode="outlined"
              class="btn-fin-secondary"
              (onClick)="onTrace()">
            </dx-button>
          }
        </div>

        <div class="popup-actions-primary">
          <dx-button
            text="Annulla"
            stylingMode="outlined"
            class="btn-fin-secondary"
            (onClick)="closeFormPopup()">
          </dx-button>
          <dx-button
            [text]="isSaving() ? 'Salvataggio...' : 'Salva'"
            icon="save"
            stylingMode="contained"
            class="btn-fin-primary"
            [disabled]="isSaving()"
            (onClick)="save()">
          </dx-button>
        </div>

      </div>

    </form>
  </div>
</dx-popup>
