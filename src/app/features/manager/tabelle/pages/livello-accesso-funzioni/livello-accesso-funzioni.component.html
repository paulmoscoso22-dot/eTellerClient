<div class="page-shell">

  <app-sempione-page-header title="Livello Accesso Funzioni"></app-sempione-page-header>

  <app-sempione-card>

    <app-sempione-card-header title="Elenco Livelli Accesso (ST_FUNACCTYP)">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </app-sempione-card-header>

    <div [formGroup]="filterForm">
      <app-sempione-toolbar>

        <app-sempione-id-des-filter
          idPlaceholder="ID..."
          desPlaceholder="Cerca per descrizione..."
          (enterKey)="search()">
        </app-sempione-id-des-filter>

        <app-sempione-crud-toolbar-actions
          [showAll]="true"
          [isLoading]="isLoading()"
          (search)="search()"
          (reset)="resetFilters()"
          (listAll)="showAll()"
          (add)="openAddPopup()">
        </app-sempione-crud-toolbar-actions>

      </app-sempione-toolbar>
    </div>

    <app-sempione-data-grid
      [dataSource]="items()"
      [columns]="gridColumns"
      keyExpr="id"
      [isLoading]="isLoading()"
      [error]="error()"
      [showEditAction]="true"
      [showTraceAction]="true"
      noDataText="Nessun risultato trovato."
      (rowEdit)="openEditPopup($event)"
      (rowTrace)="onTrace($event.id)">
    </app-sempione-data-grid>

  </app-sempione-card>

</div>

<app-sempione-simple-crud-popup
  [(visible)]="isFormPopupVisible"
  [mode]="isEditMode() ? 'edit' : 'new'"
  [item]="popupItem()"
  tableName="ST_FUNACCTYP"
  entityLabel="Livello Accesso"
  newTitle="Nuovo livello accesso"
  cardTitle="Dati livello accesso"
  idInputType="number"
  idLabel="ID (intero)"
  idPlaceholder="Numero intero..."
  [onInsert]="doInsert"
  [onUpdate]="doUpdate"
  (saved)="search()"
  (storico)="onTrace($event)">
</app-sempione-simple-crud-popup>
