<div class="page-shell">

  <app-sempione-page-header title="Livello Accesso Funzioni"></app-sempione-page-header>

  <app-sempione-card>

    <app-sempione-card-header title="Elenco Livelli Accesso (ST_FUNACCTYP)">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </app-sempione-card-header>

    <div [formGroup]="filterForm">
      <app-sempione-toolbar>

        <div class="toolbar-field toolbar-field--sm">
          <dx-text-box
            formControlName="id"
            placeholder="ID..."
            [showClearButton]="true"
            valueChangeEvent="input">
          </dx-text-box>
        </div>

        <div class="toolbar-field toolbar-field--lg">
          <dx-text-box
            formControlName="des"
            placeholder="Cerca per descrizione..."
            [showClearButton]="true"
            valueChangeEvent="input">
          </dx-text-box>
        </div>

        <div toolbar-actions>
          <app-sempione-button
            icon="search"
            hint="Cerca"
            variant="secondary"
            [disabled]="isLoading()"
            (clicked)="search()">
          </app-sempione-button>
          <app-sempione-button
            icon="revert"
            hint="Reset filtri"
            variant="secondary"
            (clicked)="resetFilters()">
          </app-sempione-button>
          <app-sempione-button
            icon="checklist"
            hint="Mostra tutti"
            variant="secondary"
            [disabled]="isLoading()"
            (clicked)="showAll()">
          </app-sempione-button>
          <span class="toolbar-sep" toolbar-actions></span>
          <app-sempione-button
            text="Nuovo"
            icon="add"
            variant="primary"
            [shadow]="true"
            (clicked)="openAddPopup()">
          </app-sempione-button>
        </div>

      </app-sempione-toolbar>
    </div>

    <app-sempione-data-grid
      [dataSource]="items()"
      [columns]="gridColumns"
      keyExpr="id"
      [isLoading]="isLoading()"
      [error]="error()"
      [showEditAction]="true"
      [showTraceAction]="true"
      noDataText="Nessun risultato trovato."
      (rowEdit)="openEditPopup($event)"
      (rowTrace)="onTrace($event)">
    </app-sempione-data-grid>

  </app-sempione-card>

</div>

<!-- ── Popup Aggiungi / Modifica ── -->
<app-sempione-popup
  [(visible)]="isFormPopupVisible"
  [title]="isEditMode() ? 'Modifica — ID ' + selectedId() : 'Nuovo livello accesso'"
  [maxWidth]="440"
  (hidden)="closeFormPopup()">

  <div [formGroup]="editForm" class="popup-layout">

    <app-sempione-popup-card title="Dati livello accesso">
      <div class="popup-fields-grid popup-fields-grid--1col">

        <app-sempione-field-group label="ID (intero)" [required]="true" [locked]="isEditMode()">
          <dx-number-box
            formControlName="id"
            [readOnly]="isEditMode()"
            [showClearButton]="!isEditMode()"
            [showSpinButtons]="!isEditMode()"
            [min]="0"
            format="#0"
            placeholder="Numero intero...">
          </dx-number-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Descrizione" [required]="true">
          <dx-text-box
            formControlName="des"
            [maxLength]="50"
            [showClearButton]="true"
            placeholder="Descrizione...">
          </dx-text-box>
        </app-sempione-field-group>

      </div>
      <app-sempione-alert [message]="saveError()"></app-sempione-alert>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      [isSaving]="isSaving()"
      (save)="save()"
      (cancel)="closeFormPopup()">
      @if (isEditMode()) {
        <app-sempione-button
          secondary-actions
          text="Storico"
          icon="clock"
          variant="secondary"
          (clicked)="onTrace()">
        </app-sempione-button>
      }
    </app-sempione-popup-action-bar>

  </div>

</app-sempione-popup>
