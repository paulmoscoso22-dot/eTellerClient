<app-sempione-page-shell title="Forza Traccia">

  <app-sempione-card>

    <app-sempione-card-header title="Elenco Forzature Traccia">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <line x1="9" y1="9" x2="15" y2="9"></line>
        <line x1="9" y1="13" x2="15" y2="13"></line>
        <line x1="9" y1="17" x2="13" y2="17"></line>
      </svg>
    </app-sempione-card-header>

    <app-sempione-toolbar>
      <div class="toolbar-field toolbar-field--sm">
        <dx-select-box
          [dataSource]="languages"
          displayExpr="label"
          valueExpr="id"
          [value]="selectedLanCode()"
          (onValueChanged)="onLanguageChanged($event.value)">
        </dx-select-box>
      </div>
      <div toolbar-actions>
        <app-sempione-button
          icon="search"
          hint="Cerca"
          variant="secondary"
          [disabled]="isLoading()"
          (clicked)="search()">
        </app-sempione-button>
      </div>
    </app-sempione-toolbar>

    <app-sempione-data-grid
      [dataSource]="items()"
      [columns]="gridColumns"
      keyExpr="trfId"
      [isLoading]="isLoading()"
      [error]="error()"
      [showViewAction]="true"
      noDataText="Nessuna transazione trovata. Premere Cerca per caricare i dati."
      (rowView)="openDetail($event)">
    </app-sempione-data-grid>

  </app-sempione-card>

</div>

<!-- ── Popup Dettaglio Forzatura ── -->
<app-sempione-popup
  [(visible)]="isDetailPopupVisible"
  [title]="'Dettaglio Forzatura — ID ' + (selectedItem()?.trfId ?? '')"
  [maxWidth]="600"
  (hidden)="closeDetail()">

  @if (selectedItem(); as item) {
    <div class="popup-layout">

      <app-sempione-popup-card title="Dati Forzatura">
        <div class="popup-fields-grid popup-fields-grid--2col">

          <app-sempione-field-group label="ID Forzatura">
            <dx-text-box [value]="item.trfId.toString()" [readOnly]="true"></dx-text-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="ID Transazione">
            <dx-text-box [value]="item.trfTrxId.toString()" [readOnly]="true"></dx-text-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="Data operazione">
            <dx-text-box [value]="(item.trxDatope | date:'dd.MM.yyyy') ?? ''" [readOnly]="true"></dx-text-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="Data valuta">
            <dx-text-box [value]="(item.trxDatval | date:'dd.MM.yyyy') ?? ''" [readOnly]="true"></dx-text-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="Tipo forzatura">
            <dx-text-box [value]="item.trfFortyp" [readOnly]="true"></dx-text-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="Testo" class="popup-col-span-2">
            <dx-text-box [value]="item.trfFortxt ?? ''" [readOnly]="true"></dx-text-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="Descrizione errore" class="popup-col-span-2">
            <dx-text-box [value]="item.errDesc ?? ''" [readOnly]="true"></dx-text-box>
          </app-sempione-field-group>

        </div>
      </app-sempione-popup-card>

      <app-sempione-popup-action-bar
        cancelText="Chiudi"
        [showSave]="false"
        (cancel)="closeDetail()">
      </app-sempione-popup-action-bar>

    </div>
  }

</app-sempione-popup>
