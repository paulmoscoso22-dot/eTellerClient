<div class="page-shell">

  <app-sempione-page-header title="Gestione Errori"></app-sempione-page-header>

  <app-sempione-card>

    <app-sempione-card-header title="Elenco Errori (ST_ERRORCODE)">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </app-sempione-card-header>

    <div [formGroup]="filterForm">
      <app-sempione-toolbar>

        <div class="toolbar-field toolbar-field--sm">
          <dx-text-box
            formControlName="errId"
            placeholder="Codice errore..."
            [showClearButton]="true"
            valueChangeEvent="input">
          </dx-text-box>
        </div>

        <div class="toolbar-field toolbar-field--lg">
          <dx-text-box
            formControlName="testoLike"
            placeholder="Cerca per descrizione..."
            [showClearButton]="true"
            valueChangeEvent="input">
          </dx-text-box>
        </div>

        <div toolbar-actions>
          <app-sempione-button
            icon="search"
            hint="Cerca"
            variant="secondary"
            [disabled]="isLoading()"
            (clicked)="search()">
          </app-sempione-button>
          <app-sempione-button
            icon="revert"
            hint="Reset filtri"
            variant="secondary"
            (clicked)="resetFilters()">
          </app-sempione-button>
          <app-sempione-button
            icon="checklist"
            hint="Mostra tutti"
            variant="secondary"
            [disabled]="isLoading()"
            (clicked)="showAll()">
          </app-sempione-button>
          <span class="toolbar-sep" toolbar-actions></span>
          <app-sempione-button
            text="Nuovo"
            icon="add"
            variant="primary"
            [shadow]="true"
            (clicked)="openAddPopup()">
          </app-sempione-button>
        </div>

      </app-sempione-toolbar>
    </div>

    <!-- Grid kept as raw dx-data-grid: has delete action -->
    <div class="card-body card-body--grid">

      @if (error()) {
        <div class="grid-message grid-message--error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          {{ error() }}
        </div>
      }

      @if (isLoading()) {
        <div class="grid-message grid-message--loading">
          <svg class="spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
          </svg>
          Caricamento in corso...
        </div>
      }

      @if (!isLoading() && !error()) {
        <dx-data-grid
          [dataSource]="items()"
          [showBorders]="false"
          [columnAutoWidth]="true"
          [rowAlternationEnabled]="true"
          [hoverStateEnabled]="true"
          [height]="'100%'"
          noDataText="Nessun risultato trovato.">

          <dxo-selection mode="single"></dxo-selection>
          <dxo-paging [pageSize]="30"></dxo-paging>
          <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[20, 30, 50, 100]" [showInfo]="true"></dxo-pager>
          <dxo-load-panel [enabled]="false"></dxo-load-panel>

          <dxi-column dataField="errId"     caption="Codice"      alignment="left"   [width]="140"></dxi-column>
          <dxi-column dataField="errTyp"    caption="Tipo"        alignment="center" [width]="60"></dxi-column>
          <dxi-column dataField="errDescIt" caption="Descrizione" alignment="left"></dxi-column>

          <dxi-column caption="Azioni" [width]="90" [allowSorting]="false" [allowFiltering]="false" alignment="center" cellTemplate="actionsTemplate"></dxi-column>

          <div *dxTemplate="let cell of 'actionsTemplate'" class="actions-cell">
            <app-sempione-row-actions
              [showView]="true"
              [showEdit]="true"
              [showTrace]="true"
              [showDelete]="true"
              (view)="openViewPopup(cell.data)"
              (edit)="openEditPopup(cell.data)"
              (trace)="openTrace(cell.data)"
              (delete)="requestDelete(cell.data)">
            </app-sempione-row-actions>
          </div>

        </dx-data-grid>
      }

    </div>

  </app-sempione-card>

</div>

<!-- ── Popup Aggiungi / Modifica / Dettaglio Errore ── -->
<app-sempione-popup
  [(visible)]="isFormPopupVisible"
  [title]="popupMode() === 'edit' ? 'Modifica Errore — ' + selectedErrId()
         : popupMode() === 'view' ? 'Dettaglio Errore — ' + selectedErrId()
         : 'Nuovo Errore'"
  [maxWidth]="700"
  (hidden)="closeFormPopup()">

  <form [formGroup]="editForm" class="popup-layout">

    <app-sempione-popup-card title="Codice e Descrizioni">
      <div class="popup-fields-grid popup-fields-grid--2col">

        <app-sempione-field-group label="Codice Errore" [required]="true" [locked]="popupMode() !== 'new'">
          <dx-text-box
            formControlName="errId"
            [maxLength]="25"
            [showClearButton]="popupMode() === 'new'"
            [readOnly]="popupMode() !== 'new'"
            placeholder="Max 25 caratteri...">
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Tipo">
          <dx-select-box
            formControlName="errTyp"
            [items]="errTypOptions"
            displayExpr="label"
            valueExpr="id"
            [showClearButton]="popupMode() !== 'view'"
            [readOnly]="popupMode() === 'view'"
            placeholder="Seleziona tipo...">
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Descrizione IT" [required]="true" class="popup-col-span-2">
          <dx-text-box
            formControlName="errDescIt"
            [showClearButton]="popupMode() !== 'view'"
            [readOnly]="popupMode() === 'view'"
            placeholder="Descrizione in italiano...">
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Descrizione EN">
          <dx-text-box formControlName="errDescEn" [showClearButton]="popupMode() !== 'view'" [readOnly]="popupMode() === 'view'" placeholder="Description in English..."></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Descrizione FR">
          <dx-text-box formControlName="errDescFr" [showClearButton]="popupMode() !== 'view'" [readOnly]="popupMode() === 'view'" placeholder="Description en Français..."></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Descrizione DE">
          <dx-text-box formControlName="errDescDe" [showClearButton]="popupMode() !== 'view'" [readOnly]="popupMode() === 'view'" placeholder="Beschreibung auf Deutsch..."></dx-text-box>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-card title="Opzioni e Soluzione">
      <div class="popup-flags-row">
        <div class="popup-flag-group">
          <label class="popup-field-label">Cancellabile</label>
          <dx-check-box formControlName="errCanFlag" [readOnly]="popupMode() === 'view'"></dx-check-box>
        </div>
        <div class="popup-flag-group">
          <label class="popup-field-label">Confermabile</label>
          <dx-check-box formControlName="errConFlag" [readOnly]="popupMode() === 'view'"></dx-check-box>
        </div>
        <div class="popup-flag-group popup-flag-group--accent">
          <label class="popup-field-label">Force Code abilitato</label>
          <dx-check-box formControlName="errForFlag" [readOnly]="popupMode() === 'view'"></dx-check-box>
        </div>
      </div>

      <div class="popup-fields-grid popup-fields-grid--2col" style="margin-top: 14px;">
        <app-sempione-field-group label="Force Code">
          <dx-select-box
            formControlName="errFocId"
            [items]="forceCodes()"
            displayExpr="focDes"
            valueExpr="focId"
            [showClearButton]="popupMode() !== 'view'"
            [readOnly]="popupMode() === 'view'"
            [disabled]="!isFocIdEnabled"
            placeholder="Seleziona force code...">
          </dx-select-box>
        </app-sempione-field-group>
      </div>

      <div class="popup-fields-grid popup-fields-grid--1col" style="margin-top: 12px;">
        <app-sempione-field-group label="Soluzione suggerita">
          <dx-text-area formControlName="errDesSol" [height]="80" [readOnly]="popupMode() === 'view'" placeholder="Descrizione della soluzione suggerita..."></dx-text-area>
        </app-sempione-field-group>
      </div>

      <app-sempione-alert [message]="saveError()"></app-sempione-alert>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      [cancelText]="popupMode() === 'new' ? 'Annulla' : 'Chiudi'"
      [saveText]="popupMode() === 'edit' ? 'Aggiorna' : 'Inserisci'"
      [showSave]="popupMode() !== 'view'"
      [isSaving]="isSaving()"
      (save)="save()"
      (cancel)="closeFormPopup()">
      @if (popupMode() !== 'new') {
        <app-sempione-button secondary-actions text="Storico" icon="clock" variant="secondary" (clicked)="openTrace($any({errId: selectedErrId()}))"></app-sempione-button>
      }
    </app-sempione-popup-action-bar>

  </form>

</app-sempione-popup>

<!-- ── Popup Conferma Eliminazione ── -->
<dx-popup
  [(visible)]="isConfirmDeleteVisible"
  [showTitle]="false"
  [dragEnabled]="false"
  [hideOnOutsideClick]="false"
  [showCloseButton]="false"
  [width]="420"
  [height]="'auto'"
  (onHidden)="cancelDelete()">

  <div *dxTemplate="let data of 'content'">
    <div class="popup-confirm-layout">

      <div class="popup-confirm-body">
        <div class="popup-confirm-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <div class="popup-confirm-text">
          <p class="popup-confirm-title">Conferma eliminazione</p>
          <p class="popup-confirm-msg">
            Stai per eliminare l'errore <strong>{{ itemToDelete()?.errId }}</strong>.
            Questa operazione non può essere annullata.
          </p>
        </div>
      </div>

      <div class="popup-confirm-actions">
        <dx-button
          text="Annulla"
          stylingMode="outlined"
          class="btn-fin-secondary"
          (onClick)="cancelDelete()">
        </dx-button>
        <dx-button
          text="Elimina"
          icon="trash"
          stylingMode="contained"
          class="btn-fin-danger"
          (onClick)="confirmDelete()">
        </dx-button>
      </div>

    </div>
  </div>
</dx-popup>
