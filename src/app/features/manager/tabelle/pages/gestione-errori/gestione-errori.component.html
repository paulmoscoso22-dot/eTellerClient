<app-sempione-page-shell title="Gestione Errori">

  <app-sempione-card>

    <app-sempione-card-header title="Elenco Errori">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </app-sempione-card-header>

    <app-sempione-search-mode mode="header" newText="Aggiungi" (reset)="clearGridFilters()" (add)="openAddPopup()">
    </app-sempione-search-mode>

    <app-sempione-data-grid
      [dataSource]="items()"
      [columns]="gridColumns"
      keyExpr="errId"
      [isLoading]="isLoading()"
      [error]="error()"
      [showHeaderFilter]="true"
      [showViewAction]="true"
      [showEditAction]="true"
      [showTraceAction]="true"
      [showDeleteAction]="true"
      noDataText="Nessun errore trovato."
      (rowView)="openViewPopup($event)"
      (rowEdit)="openEditPopup($event)"
      (rowTrace)="openTrace($event)"
      (rowDelete)="requestDelete($event)"
      (rowDblClick)="openViewPopup($event)">
    </app-sempione-data-grid>

  </app-sempione-card>

</app-sempione-page-shell>

<!-- ── Popup Aggiungi / Modifica / Dettaglio Errore ── -->
<app-sempione-popup
  [visible]="isFormPopupVisible()"
  (visibleChange)="isFormPopupVisible.set($event)"
  [title]="popupMode() === 'edit' ? 'Modifica Errore — ' + selectedErrId()
         : popupMode() === 'view' ? 'Dettaglio Errore — ' + selectedErrId()
         : 'Nuovo Errore'"
  [maxWidth]="700"
  (hidden)="closeFormPopup()">

  <form [formGroup]="editForm" class="popup-layout">

    <app-sempione-popup-card title="Codice e Descrizioni">
      <div class="popup-fields-grid popup-fields-grid--2col">

        <app-sempione-field-group label="Codice Errore" [required]="true" [locked]="popupMode() !== 'new'">
          <dx-text-box
            formControlName="errId"
            [maxLength]="25"
            [showClearButton]="popupMode() === 'new'"
            [readOnly]="popupMode() !== 'new'"
            placeholder="Max 25 caratteri...">
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Tipo">
          <dx-select-box
            formControlName="errTyp"
            [items]="errTypOptions"
            displayExpr="label"
            valueExpr="id"
            [showClearButton]="popupMode() !== 'view'"
            [readOnly]="popupMode() === 'view'"
            placeholder="Seleziona tipo...">
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Descrizione IT" [required]="true" class="popup-col-span-2">
          <dx-text-box
            formControlName="errDescIt"
            [showClearButton]="popupMode() !== 'view'"
            [readOnly]="popupMode() === 'view'"
            placeholder="Descrizione in italiano...">
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Descrizione EN">
          <dx-text-box formControlName="errDescEn" [showClearButton]="popupMode() !== 'view'" [readOnly]="popupMode() === 'view'" placeholder="Description in English..."></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Descrizione FR">
          <dx-text-box formControlName="errDescFr" [showClearButton]="popupMode() !== 'view'" [readOnly]="popupMode() === 'view'" placeholder="Description en Français..."></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Descrizione DE">
          <dx-text-box formControlName="errDescDe" [showClearButton]="popupMode() !== 'view'" [readOnly]="popupMode() === 'view'" placeholder="Beschreibung auf Deutsch..."></dx-text-box>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-card title="Opzioni e Soluzione">
      <div class="popup-flags-row">
        <div class="popup-flag-group">
          <label class="popup-field-label">Cancellabile</label>
          <dx-check-box formControlName="errCanFlag" [readOnly]="popupMode() === 'view'"></dx-check-box>
        </div>
        <div class="popup-flag-group">
          <label class="popup-field-label">Confermabile</label>
          <dx-check-box formControlName="errConFlag" [readOnly]="popupMode() === 'view'"></dx-check-box>
        </div>
        <div class="popup-flag-group popup-flag-group--accent">
          <label class="popup-field-label">Force Code abilitato</label>
          <dx-check-box formControlName="errForFlag" [readOnly]="popupMode() === 'view'"></dx-check-box>
        </div>
      </div>

      <div class="popup-fields-grid popup-fields-grid--2col">
        <app-sempione-field-group label="Force Code">
          <dx-select-box
            formControlName="errFocId"
            [items]="forceCodes()"
            displayExpr="focDes"
            valueExpr="focId"
            [showClearButton]="popupMode() !== 'view'"
            [readOnly]="popupMode() === 'view'"
            placeholder="Seleziona force code...">
          </dx-select-box>
        </app-sempione-field-group>
      </div>

      <div class="popup-fields-grid popup-fields-grid--1col">
        <app-sempione-field-group label="Soluzione suggerita">
          <dx-text-area formControlName="errDesSol" [height]="80" [readOnly]="popupMode() === 'view'" placeholder="Descrizione della soluzione suggerita..."></dx-text-area>
        </app-sempione-field-group>
      </div>

      <app-sempione-alert [message]="saveError()"></app-sempione-alert>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      [cancelText]="popupMode() === 'new' ? 'Annulla' : 'Chiudi'"
      [saveText]="popupMode() === 'edit' ? 'Aggiorna' : 'Inserisci'"
      [showSave]="popupMode() !== 'view'"
      [isSaving]="isSaving()"
      [showStorico]="popupMode() !== 'new'"
      (save)="save()"
      (cancel)="closeFormPopup()"
      (storico)="openTrace($any({errId: selectedErrId()}))">
    </app-sempione-popup-action-bar>

  </form>

</app-sempione-popup>

<!-- ── Popup Conferma Eliminazione ── -->
<app-sempione-confirm-delete
  [visible]="isConfirmDeleteVisible()"
  (visibleChange)="isConfirmDeleteVisible.set($event)"
  entityLabel="l'errore"
  [entityName]="itemToDelete()?.errId"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()">
</app-sempione-confirm-delete>
