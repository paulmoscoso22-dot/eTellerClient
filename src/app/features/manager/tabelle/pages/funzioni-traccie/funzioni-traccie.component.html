<div class="page-shell">

  <!-- ── Main Card ── -->
  <section class="card-section">

    <div class="sempione-card-header">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      <h2 class="card-title">Funzioni Tracce (ST_TRACE_FUNCTION)</h2>
    </div>
    <div class="gold-divider"></div>

    <!-- ── Filtri ── -->
    <div class="card-toolbar" [formGroup]="filterForm">
      <div class="toolbar-row">

        <span class="filter-label">Codice:</span>
        <dx-text-box
          formControlName="id"
          [showClearButton]="true"
          placeholder="Filtro codice..."
          class="filter-control filter-control--sm">
        </dx-text-box>

        <span class="filter-label">Descrizione:</span>
        <dx-text-box
          formControlName="desLike"
          [showClearButton]="true"
          placeholder="Filtro descrizione..."
          class="filter-control filter-control--md">
        </dx-text-box>

        <div class="toolbar-row-spacer"></div>

        <div class="toolbar-actions">
          <dx-button
            class="btn-reset"
            text="Reset"
            stylingMode="outlined"
            icon="revert"
            (onClick)="resetFilters()">
          </dx-button>
          <dx-button
            class="btn-showall"
            text="Mostra tutti"
            stylingMode="outlined"
            icon="checklist"
            [disabled]="isLoading()"
            (onClick)="showAll()">
          </dx-button>
          <dx-button
            class="btn-cerca"
            text="Cerca"
            type="default"
            stylingMode="contained"
            icon="search"
            [disabled]="isLoading()"
            (onClick)="search()">
          </dx-button>
          <dx-button
            class="btn-add"
            text="Aggiungi"
            stylingMode="outlined"
            icon="add"
            (onClick)="openAddPopup()">
          </dx-button>
        </div>

      </div>
    </div>

    <!-- ── Griglia ── -->
    <div class="card-body card-body--grid">

      @if (error()) {
        <div class="grid-message grid-message--error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          {{ error() }}
        </div>
      }

      @if (isLoading()) {
        <div class="grid-message grid-message--loading">
          <svg class="spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
          </svg>
          Caricamento in corso...
        </div>
      }

      @if (!isLoading() && !error()) {
        <dx-data-grid
          [dataSource]="items()"
          [showBorders]="false"
          [columnAutoWidth]="true"
          [rowAlternationEnabled]="true"
          [hoverStateEnabled]="true"
          [height]="'100%'"
          noDataText="Nessun risultato trovato.">

          <dxo-selection mode="single"></dxo-selection>
          <dxo-paging [pageSize]="30"></dxo-paging>
          <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[20, 30, 50, 100]" [showInfo]="true"></dxo-pager>

          <dxi-column dataField="id"  caption="Codice"      alignment="left" [width]="120"></dxi-column>
          <dxi-column dataField="des" caption="Descrizione" alignment="left"></dxi-column>

          <dxi-column
            caption="Azioni"
            [width]="100"
            [allowSorting]="false"
            [allowFiltering]="false"
            alignment="center"
            cellTemplate="actionsTemplate">
          </dxi-column>

          <div *dxTemplate="let cell of 'actionsTemplate'" class="actions-cell">
            <button class="action-btn action-btn--edit" title="Modifica" (click)="openEditPopup(cell.data)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
            <button class="action-btn action-btn--trace" title="Traccia" (click)="openTrace(cell.data)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
            </button>
          </div>

          <dxo-load-panel [enabled]="false"></dxo-load-panel>

        </dx-data-grid>
      }

    </div>

  </section>

</div>

<!-- ══ Popup Aggiungi / Modifica ══ -->
<dx-popup
  [(visible)]="isFormPopupVisible"
  [showTitle]="true"
  [title]="isEditMode() ? 'Modifica Funzione Traccia' : 'Nuova Funzione Traccia'"
  [dragEnabled]="true"
  [hideOnOutsideClick]="false"
  [showCloseButton]="true"
  [width]="'90%'"
  [maxWidth]="500"
  [height]="'auto'"
  [maxHeight]="'92vh'"
  (onHidden)="closeFormPopup()">

  <div *dxTemplate="let data of 'content'">
    <div class="popup-layout" [formGroup]="editForm">

      <section class="popup-card">
        <div class="popup-fields-grid popup-fields-grid--1col">

          <div class="popup-field-group">
            <label class="popup-field-label">Codice <span class="req">*</span></label>
            <dx-text-box
              formControlName="id"
              [maxLength]="5"
              [showClearButton]="!isEditMode()"
              placeholder="Max 5 caratteri...">
            </dx-text-box>
          </div>

          <div class="popup-field-group">
            <label class="popup-field-label">Descrizione <span class="req">*</span></label>
            <dx-text-box
              formControlName="des"
              [showClearButton]="true"
              placeholder="Inserire descrizione...">
            </dx-text-box>
          </div>

        </div>
      </section>

      @if (saveError()) {
        <div class="popup-error">{{ saveError() }}</div>
      }

      <div class="popup-actions">
        <dx-button
          text="Annulla"
          stylingMode="outlined"
          icon="close"
          (onClick)="closeFormPopup()">
        </dx-button>
        <dx-button
          [text]="isEditMode() ? 'Aggiorna' : 'Inserisci'"
          type="default"
          stylingMode="contained"
          icon="save"
          [disabled]="isSaving()"
          (onClick)="save()">
        </dx-button>
      </div>

    </div>
  </div>

</dx-popup>
