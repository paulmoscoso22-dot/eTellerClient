<app-sempione-page-shell title="Funzioni Tracce">

  <app-sempione-card>

    <app-sempione-card-header title="Elenco Funzioni Tracce (ST_TRACE_FUNCTION)">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
    </app-sempione-card-header>

    <app-sempione-search-mode mode="header" newText="Nuovo" (reset)="clearGridFilters()" (add)="openAddPopup()">
    </app-sempione-search-mode>

    <app-sempione-data-grid
      [dataSource]="items()"
      [columns]="gridColumns"
      [isLoading]="isLoading()"
      [error]="error()"
      [showHeaderFilter]="true"
      [showEditAction]="true"
      [showTraceAction]="true"
      noDataText="Nessun risultato trovato."
      (rowEdit)="openEditPopup($event)"
      (rowTrace)="openTrace($event)">
    </app-sempione-data-grid>

  </app-sempione-card>

</app-sempione-page-shell>

<!-- ── Popup Aggiungi / Modifica ── -->
<app-sempione-popup
  [(visible)]="isFormPopupVisible"
  [title]="isEditMode() ? 'Modifica Funzione Traccia' : 'Nuova Funzione Traccia'"
  [maxWidth]="500"
  (hidden)="closeFormPopup()">

  <div [formGroup]="editForm" class="popup-layout">

    <app-sempione-popup-card title="Dati funzione traccia">
      <div class="popup-fields-grid popup-fields-grid--1col">

        <app-sempione-field-group label="Codice" [required]="true" [locked]="isEditMode()">
          <dx-text-box
            formControlName="id"
            [maxLength]="5"
            [showClearButton]="!isEditMode()"
            placeholder="Max 5 caratteri...">
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Descrizione" [required]="true">
          <dx-text-box
            formControlName="des"
            [showClearButton]="true"
            placeholder="Inserire descrizione...">
          </dx-text-box>
        </app-sempione-field-group>

      </div>
      <app-sempione-alert [message]="saveError()"></app-sempione-alert>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      [saveText]="isEditMode() ? 'Aggiorna' : 'Inserisci'"
      [isSaving]="isSaving()"
      (save)="save()"
      (cancel)="closeFormPopup()">
    </app-sempione-popup-action-bar>

  </div>

</app-sempione-popup>
