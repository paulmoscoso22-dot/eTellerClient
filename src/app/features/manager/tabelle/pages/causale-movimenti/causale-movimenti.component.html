<app-sempione-page-shell title="Causali Movimenti">

  <app-sempione-card>

    <app-sempione-card-header title="Causali Movimenti">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
    </app-sempione-card-header>

    <div [formGroup]="filterForm">
      <app-sempione-toolbar>

        <div class="toolbar-field">
          <dx-select-box
            formControlName="brcCutId"
            [dataSource]="currencyTypes()"
            displayExpr="cutDes"
            valueExpr="cutId"
            [showClearButton]="true"
            [searchEnabled]="true"
            placeholder="Tipo divisa...">
          </dx-select-box>
        </div>

        <div class="toolbar-field">
          <dx-select-box
            formControlName="brcOptId"
            [dataSource]="operationTypes()"
            displayExpr="optDes"
            valueExpr="optId"
            [showClearButton]="true"
            [searchEnabled]="true"
            placeholder="Tipo operazione...">
          </dx-select-box>
        </div>

        <div class="toolbar-field">
          <dx-select-box
            formControlName="brcActId"
            [dataSource]="accountTypes()"
            displayExpr="actDes"
            valueExpr="actId"
            [showClearButton]="true"
            [searchEnabled]="true"
            placeholder="Genere conto...">
          </dx-select-box>
        </div>

        <div toolbar-actions>
          <app-sempione-button
            icon="search"
            hint="Cerca"
            variant="secondary"
            [disabled]="isLoading()"
            (clicked)="search()">
          </app-sempione-button>
          <app-sempione-button
            icon="revert"
            hint="Reset filtri"
            variant="secondary"
            (clicked)="resetFilters()">
          </app-sempione-button>
          <app-sempione-button
            icon="checklist"
            hint="Mostra tutti"
            variant="secondary"
            [disabled]="isLoading()"
            (clicked)="showAll()">
          </app-sempione-button>
          <span class="toolbar-sep" toolbar-actions></span>
          <app-sempione-button
            text="Aggiungi"
            icon="add"
            variant="primary"
            [shadow]="true"
            (clicked)="openAddPopup()">
          </app-sempione-button>
        </div>

      </app-sempione-toolbar>
    </div>

    <app-sempione-data-grid
      [dataSource]="items()"
      [columns]="gridColumns"
      [isLoading]="isLoading()"
      [error]="error()"
      [showViewAction]="true"
      [showEditAction]="true"
      [showTraceAction]="true"
      noDataText="Nessuna causale trovata. Inserire i criteri di ricerca e premere Cerca."
      (rowView)="openViewPopup($event)"
      (rowEdit)="openEditPopup($event)"
      (rowTrace)="openTrace($event)">
    </app-sempione-data-grid>

  </app-sempione-card>

</app-sempione-page-shell>

<!-- ── Popup Aggiungi / Modifica ── -->
<app-sempione-popup
  [(visible)]="isFormPopupVisible"
  [title]="isEditMode() ? ('Modifica Causale — ' + selectedKeyLabel()) : 'Nuova Causale'"
  [maxWidth]="700"
  (hidden)="closeFormPopup()">

  <div [formGroup]="editForm" class="popup-layout">

    <app-sempione-popup-card title="Classificazione">
      <div class="popup-fields-grid popup-fields-grid--3col">

        <app-sempione-field-group label="Tipo divisa" [required]="true" [locked]="isEditMode()">
          <dx-select-box
            formControlName="brcCutId"
            [dataSource]="currencyTypes()"
            displayExpr="cutDes"
            valueExpr="cutId"
            [showClearButton]="!isEditMode()"
            [searchEnabled]="true"
            placeholder="Selezionare...">
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Tipo operazione" [required]="true" [locked]="isEditMode()">
          <dx-select-box
            formControlName="brcOptId"
            [dataSource]="operationTypes()"
            displayExpr="optDes"
            valueExpr="optId"
            [showClearButton]="!isEditMode()"
            [searchEnabled]="true"
            placeholder="Selezionare...">
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Genere conto" [required]="true" [locked]="isEditMode()">
          <dx-select-box
            formControlName="brcActId"
            [dataSource]="accountTypes()"
            displayExpr="actDes"
            valueExpr="actId"
            [showClearButton]="!isEditMode()"
            [searchEnabled]="true"
            placeholder="Selezionare...">
          </dx-select-box>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-card title="Causali e testi">
      <div class="popup-fields-grid popup-fields-grid--2col">

        <app-sempione-field-group label="Codice causale dare" [required]="true">
          <dx-text-box
            formControlName="brcCodcau"
            [maxLength]="10"
            [showClearButton]="true"
            placeholder="Max 10 caratteri...">
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Codice causale avere" [required]="true">
          <dx-text-box
            formControlName="brcCodcausto"
            [maxLength]="10"
            [showClearButton]="true"
            placeholder="Max 10 caratteri...">
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Testo 1">
          <dx-text-box
            formControlName="brcText1"
            [maxLength]="50"
            [showClearButton]="true">
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Testo 2">
          <dx-text-box
            formControlName="brcText2"
            [maxLength]="50"
            [showClearButton]="true">
          </dx-text-box>
        </app-sempione-field-group>

      </div>
      <app-sempione-alert [message]="saveError()"></app-sempione-alert>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      [saveText]="isEditMode() ? 'Aggiorna' : 'Inserisci'"
      [isSaving]="isSaving()"
      [showStorico]="isEditMode()"
      (save)="save()"
      (cancel)="closeFormPopup()"
      (storico)="openTraceSelected()">
    </app-sempione-popup-action-bar>

  </div>

</app-sempione-popup>

<!-- ── Popup Visualizzazione ── -->
@if (viewItem()) {
<app-sempione-popup
  [(visible)]="isViewPopupVisible"
  [title]="'Dettaglio Causale — ' + viewItem()!.brcCutId + ' / ' + viewItem()!.brcOptId + ' / ' + viewItem()!.brcActId"
  [maxWidth]="700"
  (hidden)="closeViewPopup()">

  <div class="popup-layout">

    <app-sempione-popup-card title="Classificazione">
      <div class="popup-fields-grid popup-fields-grid--3col">

        <app-sempione-field-group label="Tipo divisa" [locked]="true">
          <dx-select-box
            [value]="viewItem()!.brcCutId"
            [dataSource]="currencyTypes()"
            displayExpr="cutDes"
            valueExpr="cutId"
            [readOnly]="true"
            [showClearButton]="false">
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Tipo operazione" [locked]="true">
          <dx-select-box
            [value]="viewItem()!.brcOptId"
            [dataSource]="operationTypes()"
            displayExpr="optDes"
            valueExpr="optId"
            [readOnly]="true"
            [showClearButton]="false">
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Genere conto" [locked]="true">
          <dx-select-box
            [value]="viewItem()!.brcActId"
            [dataSource]="accountTypes()"
            displayExpr="actDes"
            valueExpr="actId"
            [readOnly]="true"
            [showClearButton]="false">
          </dx-select-box>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-card title="Causali e testi">
      <div class="popup-fields-grid popup-fields-grid--2col">

        <app-sempione-field-group label="Codice causale dare">
          <dx-text-box [value]="viewItem()!.brcCodcau" [readOnly]="true" [showClearButton]="false"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Codice causale avere">
          <dx-text-box [value]="viewItem()!.brcCodcausto" [readOnly]="true" [showClearButton]="false"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Testo 1">
          <dx-text-box [value]="viewItem()!.brcText1 ?? ''" [readOnly]="true" [showClearButton]="false"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Testo 2">
          <dx-text-box [value]="viewItem()!.brcText2 ?? ''" [readOnly]="true" [showClearButton]="false"></dx-text-box>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      [showSave]="false"
      cancelText="Chiudi"
      (cancel)="closeViewPopup()">
    </app-sempione-popup-action-bar>

  </div>

</app-sempione-popup>
}
