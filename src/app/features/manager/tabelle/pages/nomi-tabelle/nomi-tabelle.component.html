<div class="page-shell">

  <!-- ── Titolo pagina ── -->
  <div class="page-header-row">
    <h1 class="page-title">Nomi Tabelle</h1>
  </div>

  <!-- ── Card Main ── -->
  <section class="card-section">

    <div class="sempione-card-header">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="3" y1="9" x2="21" y2="9"></line>
        <line x1="9" y1="21" x2="9" y2="9"></line>
      </svg>
      <h2 class="card-title">Elenco Nomi Tabelle (ST_TABLENAME)</h2>
    </div>
    <div class="gold-divider"></div>

    <!-- ── Toolbar ── -->
    <div class="card-toolbar">
      <div class="toolbar-inner" [formGroup]="filterForm">

        <div class="toolbar-filters">
          <div class="toolbar-field toolbar-field--sm">
            <label class="toolbar-lbl">ID</label>
            <dx-text-box
              formControlName="id"
              placeholder="Codice tabella..."
              [showClearButton]="true"
              valueChangeEvent="input">
            </dx-text-box>
          </div>
          <div class="toolbar-field toolbar-field--lg">
            <label class="toolbar-lbl">Descrizione</label>
            <dx-text-box
              formControlName="des"
              placeholder="Cerca per descrizione..."
              [showClearButton]="true"
              valueChangeEvent="input">
            </dx-text-box>
          </div>
        </div>

        <div class="toolbar-actions">
          <dx-button
            icon="search"
            hint="Cerca"
            stylingMode="outlined"
            class="btn-fin-secondary"
            [disabled]="isLoading()"
            (onClick)="search()">
          </dx-button>
          <dx-button
            icon="revert"
            hint="Reset filtri"
            stylingMode="outlined"
            class="btn-fin-secondary"
            (onClick)="resetFilters()">
          </dx-button>
          <dx-button
            icon="checklist"
            hint="Mostra tutti"
            stylingMode="outlined"
            class="btn-fin-secondary"
            [disabled]="isLoading()"
            (onClick)="showAll()">
          </dx-button>
          <dx-button
            class="btn-fin-primary action-shadow"
            text="Nuovo"
            icon="add"
            stylingMode="contained"
            (onClick)="openAddPopup()">
          </dx-button>
        </div>

      </div>
    </div>

    <!-- ── Griglia ── -->
    <div class="card-body card-body--grid">

      @if (error()) {
        <div class="grid-message grid-message--error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          {{ error() }}
        </div>
      }

      @if (isLoading()) {
        <div class="grid-message grid-message--loading">
          <svg class="spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
          </svg>
          Caricamento in corso...
        </div>
      }

      @if (!isLoading() && !error()) {
        <dx-data-grid
          [dataSource]="items()"
          [showBorders]="false"
          [columnAutoWidth]="false"
          [rowAlternationEnabled]="true"
          [hoverStateEnabled]="true"
          [height]="'100%'"
          keyExpr="id"
          noDataText="Nessun elemento trovato. Inserire i criteri di ricerca e premere Cerca.">

          <dxo-selection mode="single"></dxo-selection>
          <dxo-paging [pageSize]="30"></dxo-paging>
          <dxo-pager
            [showPageSizeSelector]="true"
            [allowedPageSizes]="[20, 30, 50, 100]"
            [showInfo]="true"
            [showNavigationButtons]="true"
            displayMode="full">
          </dxo-pager>

          <dxi-column dataField="id"  caption="ID"          alignment="left" [width]="220"></dxi-column>
          <dxi-column dataField="des" caption="Descrizione" alignment="left" [minWidth]="200"></dxi-column>

          <dxi-column
            caption="Azioni"
            [width]="90"
            [allowSorting]="false"
            [allowFiltering]="false"
            alignment="center"
            cellTemplate="actionsTemplate">
          </dxi-column>

          <div *dxTemplate="let cell of 'actionsTemplate'" class="actions-cell">
            <button class="action-btn action-btn--trace" title="Storico"
                    (click)="onTrace(cell.data.id)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
            </button>
            <button class="action-btn action-btn--edit" title="Modifica"
                    (click)="openEditPopup(cell.data)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
          </div>

          <dxo-load-panel [enabled]="false"></dxo-load-panel>

        </dx-data-grid>
      }

    </div>

  </section>

</div>

<!-- ══════════════════════════════════════
     Popup: Aggiungi / Modifica
     ══════════════════════════════════════ -->
<dx-popup
  [(visible)]="isFormPopupVisible"
  [showTitle]="true"
  [title]="isEditMode() ? 'Modifica — ' + selectedId() : 'Nuovo nome tabella'"
  [dragEnabled]="true"
  [hideOnOutsideClick]="false"
  [showCloseButton]="true"
  [width]="480"
  [height]="'auto'"
  [maxHeight]="'92vh'"
  (onHidden)="closeFormPopup()">

  <div *dxTemplate="let data of 'content'">
    <form [formGroup]="editForm" class="popup-layout">

      <!-- ── Card: Dati ── -->
      <section class="popup-card">
        <h3 class="popup-card-title">Dati nome tabella</h3>
        <div class="popup-fields-grid popup-fields-grid--1col">

          <div class="popup-field-group" [class.field-id-locked]="isEditMode()">
            <label class="popup-field-label">ID <span class="req">*</span></label>
            <dx-text-box
              formControlName="id"
              [readOnly]="isEditMode()"
              [maxLength]="50"
              [showClearButton]="!isEditMode()"
              placeholder="Codice identificativo...">
            </dx-text-box>
          </div>

          <div class="popup-field-group">
            <label class="popup-field-label">Descrizione <span class="req">*</span></label>
            <dx-text-box
              formControlName="des"
              [maxLength]="50"
              [showClearButton]="true"
              placeholder="Descrizione...">
            </dx-text-box>
          </div>

        </div>

        @if (saveError()) {
          <div class="save-error-message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            {{ saveError() }}
          </div>
        }
      </section>

      <!-- ── Action Bar ── -->
      <div class="popup-action-bar">

        <div class="popup-actions-secondary">
          @if (isEditMode()) {
            <dx-button
              text="Storico"
              icon="clock"
              stylingMode="outlined"
              class="btn-fin-secondary"
              (onClick)="onTrace()">
            </dx-button>
          }
        </div>

        <div class="popup-actions-primary">
          <dx-button
            text="Annulla"
            stylingMode="outlined"
            class="btn-fin-secondary"
            (onClick)="closeFormPopup()">
          </dx-button>
          <dx-button
            [text]="isSaving() ? 'Salvataggio...' : 'Salva'"
            icon="save"
            stylingMode="contained"
            class="btn-fin-primary"
            [disabled]="isSaving()"
            (onClick)="save()">
          </dx-button>
        </div>

      </div>

    </form>
  </div>
</dx-popup>
