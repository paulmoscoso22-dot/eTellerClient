<div class="page-shell">

  <app-sempione-page-header title="Nomi Tabelle"></app-sempione-page-header>

  <app-sempione-card>

    <app-sempione-card-header title="Elenco Nomi Tabelle (ST_TABLENAME)">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="3" y1="9" x2="21" y2="9"></line>
        <line x1="9" y1="21" x2="9" y2="9"></line>
      </svg>
    </app-sempione-card-header>

    <div [formGroup]="filterForm">
      <app-sempione-toolbar>

        <app-sempione-id-des-filter
          idPlaceholder="Codice tabella..."
          desPlaceholder="Cerca per descrizione..."
          (enterKey)="search()">
        </app-sempione-id-des-filter>

        <app-sempione-crud-toolbar-actions
          [showAll]="true"
          [isLoading]="isLoading()"
          (search)="search()"
          (reset)="resetFilters()"
          (listAll)="showAll()"
          (add)="openAddPopup()">
        </app-sempione-crud-toolbar-actions>

      </app-sempione-toolbar>
    </div>

    <app-sempione-data-grid
      [dataSource]="items()"
      [columns]="gridColumns"
      keyExpr="id"
      [isLoading]="isLoading()"
      [error]="error()"
      [showEditAction]="true"
      [showTraceAction]="true"
      noDataText="Nessun risultato trovato."
      (rowEdit)="openEditPopup($event)"
      (rowTrace)="onTrace($event.id)">
    </app-sempione-data-grid>

  </app-sempione-card>

</div>

<app-sempione-simple-crud-popup
  [(visible)]="isFormPopupVisible"
  [mode]="isEditMode() ? 'edit' : 'new'"
  [item]="popupItem()"
  tableName="ST_TABLENAME"
  entityLabel="Nome Tabella"
  newTitle="Nuovo nome tabella"
  cardTitle="Dati nome tabella"
  idPlaceholder="Codice identificativo..."
  [onInsert]="doInsert"
  [onUpdate]="doUpdate"
  (saved)="search()"
  (storico)="onTrace($event)">
</app-sempione-simple-crud-popup>
