<app-sempione-page-shell title="Stato Transazione">

  <app-sempione-card>

    <app-sempione-card-header title="Stato Transazione (sys_TRX_STATUS)">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="17 1 21 5 17 9"></polyline>
        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
        <polyline points="7 23 3 19 7 15"></polyline>
        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
      </svg>
    </app-sempione-card-header>

    <app-sempione-search-mode mode="header" newText="Aggiungi" (reset)="clearGridFilters()" (add)="openAddPopup()">
    </app-sempione-search-mode>

    <app-sempione-data-grid
      [dataSource]="items()"
      [columns]="gridColumns"
      keyExpr="id"
      [isLoading]="isLoading()"
      [error]="error()"
      [showHeaderFilter]="true"
      [showViewAction]="true"
      [showEditAction]="true"
      [showTraceAction]="true"
      noDataText="Nessun risultato trovato."
      (rowView)="openViewPopup($event)"
      (rowEdit)="openEditPopup($event)"
      (rowTrace)="onTrace($event.id)"
      (rowDblClick)="openViewPopup($event)">
    </app-sempione-data-grid>

  </app-sempione-card>

</app-sempione-page-shell>

<app-sempione-simple-crud-popup
  [(visible)]="isFormPopupVisible"
  [mode]="popupMode()"
  [item]="popupItem()"
  tableName="sys_TRX_STATUS"
  entityLabel="Stato Transazione"
  newTitle="Nuovo Stato Transazione"
  cardTitle="Dati stato transazione"
  idInputType="number"
  idLabel="ID (intero)"
  idPlaceholder="Numero intero..."
  [onInsert]="doInsert"
  [onUpdate]="doUpdate"
  (saved)="search()"
  (storico)="onTrace($event)">
</app-sempione-simple-crud-popup>
