<app-sempione-page-header title="Gestione Scheduled Tasks"></app-sempione-page-header>

<div class="page-shell">

  <app-sempione-card>

    <app-sempione-card-header title="Elenco Scheduled Task">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </app-sempione-card-header>

    <app-sempione-toolbar>
      <div class="toolbar-field toolbar-field--lg">
        <dx-text-box
          [value]="searchValue()"
          placeholder="Cerca per ID, nome o descrizione..."
          [showClearButton]="true"
          valueChangeEvent="input"
          (onValueChanged)="onSearchChanged($event)">
        </dx-text-box>
      </div>
      <div toolbar-actions>
        <app-sempione-button
          icon="refresh"
          hint="Aggiorna"
          variant="secondary"
          (clicked)="onRefresh()">
        </app-sempione-button>
        <span class="toolbar-sep" toolbar-actions></span>
        <app-sempione-button
          text="Nuovo Task"
          icon="add"
          variant="primary"
          [shadow]="true"
          (clicked)="openNewPopup()">
        </app-sempione-button>
      </div>
    </app-sempione-toolbar>

    <!-- Grid kept as raw dx-data-grid: has bool/periodo/err cell templates -->
    <div class="card-body card-body--grid">
      <dx-data-grid
        [dataSource]="filteredTasks()"
        [showBorders]="false"
        [columnAutoWidth]="true"
        [rowAlternationEnabled]="true"
        [hoverStateEnabled]="true"
        [height]="'100%'"
        keyExpr="futId"
        noDataText="Nessun task trovato.">

        <dxo-selection mode="single"></dxo-selection>
        <dxo-paging [pageSize]="15"></dxo-paging>
        <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[15, 25, 50]" [showInfo]="true"></dxo-pager>
        <dxo-load-panel [enabled]="false"></dxo-load-panel>

        <dxi-column dataField="futId"         caption="ID"       [width]="110" alignment="left"></dxi-column>
        <dxi-column dataField="futFunname"    caption="Nome"                   alignment="left"></dxi-column>
        <dxi-column dataField="futScriptname" caption="Script"   [width]="180" alignment="left"></dxi-column>
        <dxi-column dataField="futTimeout"    caption="Timeout"  [width]="80"  alignment="right"></dxi-column>
        <dxi-column dataField="futActive"     caption="Attiva"   [width]="80"  alignment="center" [allowSorting]="false" [allowFiltering]="false" cellTemplate="boolTemplate"></dxi-column>
        <dxi-column dataField="futAutatt"     caption="Auto"     [width]="70"  alignment="center" [allowSorting]="false" [allowFiltering]="false" cellTemplate="boolTemplate"></dxi-column>
        <dxi-column dataField="futTrace"      caption="Traccia"  [width]="80"  alignment="center" [allowSorting]="false" [allowFiltering]="false" cellTemplate="boolTemplate"></dxi-column>
        <dxi-column dataField="futOffline"    caption="Offline"  [width]="78"  alignment="center" [allowSorting]="false" [allowFiltering]="false" cellTemplate="boolTemplate"></dxi-column>
        <dxi-column                           caption="Periodo"  [width]="120" alignment="left"   [allowSorting]="false" [allowFiltering]="false" cellTemplate="periodoTemplate"></dxi-column>
        <dxi-column dataField="futLastrun"    caption="Ultimo"   [width]="140" alignment="left"></dxi-column>
        <dxi-column dataField="futErrcount"   caption="Err."     [width]="60"  alignment="center" cellTemplate="errTemplate"></dxi-column>

        <dxi-column
          caption="Azioni"
          [width]="90"
          [allowSorting]="false"
          [allowFiltering]="false"
          alignment="center"
          cellTemplate="actionsTemplate">
        </dxi-column>

        <div *dxTemplate="let cell of 'boolTemplate'" class="bool-cell">
          @if (cell.value) {
            <span class="bool-pill bool-pill--yes">✓</span>
          } @else {
            <span class="bool-pill bool-pill--no">—</span>
          }
        </div>

        <div *dxTemplate="let cell of 'periodoTemplate'" class="text-cell">
          {{ getPeriodLabel(cell.data) }}
        </div>

        <div *dxTemplate="let cell of 'errTemplate'" class="err-cell">
          @if (cell.value > 0) {
            <span class="err-pill">{{ cell.value }}</span>
          } @else {
            <span class="bool-pill bool-pill--yes">0</span>
          }
        </div>

        <div *dxTemplate="let cell of 'actionsTemplate'" class="actions-cell">
          <app-sempione-row-actions
            [showView]="true"
            [showEdit]="true"
            [showTrace]="true"
            [showDelete]="true"
            (view)="onTableAction('view', cell.data)"
            (edit)="onTableAction('edit', cell.data)"
            (trace)="onTraceFromRow(cell.data)"
            (delete)="onTableAction('delete', cell.data)">
          </app-sempione-row-actions>
        </div>

      </dx-data-grid>
    </div>

  </app-sempione-card>

</div>

<!-- ── Popup Dettaglio Task ── -->
<app-sempione-popup
  [(visible)]="isDetailPopupVisible"
  [title]="popupMode() === 'edit' ? 'Modifica Task — ' + selectedFutId()
         : popupMode() === 'view' ? 'Dettaglio Task — ' + selectedFutId()
         : 'Nuovo Scheduled Task'"
  [maxWidth]="900"
  (hidden)="closePopup()">

  <form [formGroup]="taskForm" class="popup-layout">

    <app-sempione-popup-card title="Dati Task">
      <div class="popup-fields-grid popup-fields-grid--4col">

        <app-sempione-field-group label="Codice" [required]="true" [locked]="popupMode() !== 'new'">
          <dx-text-box formControlName="futId" [readOnly]="popupMode() !== 'new'">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Nome" [required]="true" class="popup-col-span-3">
          <dx-text-box formControlName="futFunname" [readOnly]="popupMode() === 'view'">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Descrizione" [required]="true" class="popup-col-span-3">
          <dx-text-box formControlName="futDes" [readOnly]="popupMode() === 'view'">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Timeout (ms)" [required]="true">
          <dx-number-box
            formControlName="futTimeout"
            [min]="100"
            [max]="10000000"
            [readOnly]="popupMode() === 'view'">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
              <dxi-validation-rule type="range" [min]="100" [max]="10000000" message="Valore tra 100 e 10.000.000"></dxi-validation-rule>
            </dx-validator>
          </dx-number-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Script" [required]="true" class="popup-col-span-4">
          <dx-text-box formControlName="futScriptname" [readOnly]="popupMode() === 'view'">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </app-sempione-field-group>

      </div>

      <div class="popup-flags-row">
        <div class="popup-flag-group">
          <label class="popup-field-label">Traccia</label>
          <dx-check-box formControlName="futTrace" [readOnly]="popupMode() === 'view'"></dx-check-box>
        </div>
        <div class="popup-flag-group">
          <label class="popup-field-label">Abilitata</label>
          <dx-check-box formControlName="futActive" [readOnly]="popupMode() === 'view'"></dx-check-box>
        </div>
        <div class="popup-flag-group">
          <label class="popup-field-label">Offline</label>
          <dx-check-box formControlName="futOffline" [readOnly]="popupMode() === 'view'"></dx-check-box>
        </div>
        <div class="popup-flag-group popup-flag-group--accent">
          <label class="popup-field-label">Auto (schedulata)</label>
          <dx-check-box formControlName="futAutatt" [readOnly]="popupMode() === 'view'"></dx-check-box>
        </div>
      </div>
    </app-sempione-popup-card>

    @if (showScheduling) {
      <app-sempione-popup-card title="Schedulazione automatica">
        <div class="popup-fields-grid popup-fields-grid--2col">
          <app-sempione-field-group label="DLL">
            <dx-text-box formControlName="futNamedll" [readOnly]="popupMode() === 'view'"></dx-text-box>
          </app-sempione-field-group>
          <app-sempione-field-group label="Classe">
            <dx-text-box formControlName="futClassname" [readOnly]="popupMode() === 'view'"></dx-text-box>
          </app-sempione-field-group>
        </div>

        <div class="popup-fields-grid popup-fields-grid--4col" >
          <app-sempione-field-group label="Dalle">
            <dx-text-box formControlName="futStart" placeholder="HH:MM:SS" [readOnly]="popupMode() === 'view'"></dx-text-box>
          </app-sempione-field-group>
          <app-sempione-field-group label="Alle">
            <dx-text-box formControlName="futEnd" placeholder="HH:MM:SS" [readOnly]="popupMode() === 'view'"></dx-text-box>
          </app-sempione-field-group>
          <app-sempione-field-group label="Tipo Periodo">
            <dx-select-box
              formControlName="futPeriodtyp"
              [dataSource]="periodTypes()"
              displayExpr="des"
              valueExpr="id"
              [readOnly]="popupMode() === 'view'">
            </dx-select-box>
          </app-sempione-field-group>
          <app-sempione-field-group label="Valore">
            <dx-number-box formControlName="futPeriod" [min]="0" [readOnly]="popupMode() === 'view'"></dx-number-box>
          </app-sempione-field-group>
        </div>

        <div class="popup-fields-grid popup-fields-grid--4col" >
          <app-sempione-field-group label="Errori max">
            <dx-number-box formControlName="futErrcount" [min]="1" [max]="100" [readOnly]="popupMode() === 'view'"></dx-number-box>
          </app-sempione-field-group>
        </div>
      </app-sempione-popup-card>
    }

    @if (!showScheduling) {
      <app-sempione-popup-card title="Configurazione Manuale">
        <div class="popup-flags-row">
          <div class="popup-flag-group">
            <label class="popup-field-label">Validazione Host</label>
            <dx-check-box formControlName="futHosval" [readOnly]="popupMode() === 'view'"></dx-check-box>
          </div>
        </div>
      </app-sempione-popup-card>
    }

    <app-sempione-popup-action-bar
      [cancelText]="popupMode() === 'new' ? 'Annulla' : 'Chiudi'"
      [saveText]="popupMode() === 'new' ? 'Aggiungi' : 'Salva'"
      [showSave]="popupMode() !== 'view'"
      [isSaving]="isSaving()"
      (save)="popupMode() === 'new' ? onSubmit() : onUpdate()"
      (cancel)="closePopup()">
      @if (popupMode() !== 'new') {
        <app-sempione-button secondary-actions text="Traccia" icon="clock" variant="secondary" (clicked)="onTrace()"></app-sempione-button>
      }
      @if (popupMode() === 'edit') {
        <app-sempione-button secondary-actions text="Esecuzione singola" icon="runner" variant="secondary" (clicked)="onOneTimeRun()"></app-sempione-button>
      }
      @if (popupMode() === 'edit') {
        <app-sempione-button secondary-actions text="Reset errori" icon="revert" variant="secondary" (clicked)="onResetErrors()"></app-sempione-button>
      }
    </app-sempione-popup-action-bar>

  </form>

</app-sempione-popup>
