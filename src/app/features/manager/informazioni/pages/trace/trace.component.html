<app-sempione-page-shell title="Storico Tracce">

  <app-sempione-card>

    <app-sempione-card-header title="Registro Delle Tracce">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 3v5h5"></path>
        <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"></path>
        <polyline points="12 7 12 12 15 15"></polyline>
      </svg>
    </app-sempione-card-header>

    <app-sempione-toolbar>

      <div class="toolbar-field">
        <dx-select-box
          [items]="funzioni()"
          displayExpr="tfcDes"
          valueExpr="tfcId"
          [searchEnabled]="true"
          labelMode="hidden"
          placeholder="Funzione..."
          [value]="filterFunCode()"
          (onValueChanged)="filterFunCode.set($event.value)">
        </dx-select-box>
      </div>

      <div class="toolbar-field">
        <dx-select-box
          [items]="utenti()"
          displayExpr="des"
          valueExpr="usrId"
          [searchEnabled]="true"
          labelMode="hidden"
          placeholder="Utente..."
          [value]="filterUser()"
          (onValueChanged)="filterUser.set($event.value)">
        </dx-select-box>
      </div>

      <div class="toolbar-field">
        <dx-select-box
          [items]="clients()"
          displayExpr="cliDes"
          valueExpr="cliId"
          [searchEnabled]="true"
          labelMode="hidden"
          placeholder="Cassa..."
          [value]="filterStation()"
          (onValueChanged)="filterStation.set($event.value)">
        </dx-select-box>
      </div>

      <div class="toolbar-field">
        <dx-select-box
          [items]="tabellaItems()"
          displayExpr="des"
          valueExpr="id"
          [searchEnabled]="true"
          labelMode="hidden"
          placeholder="Tabella..."
          [value]="filterTabNam()"
          (onValueChanged)="filterTabNam.set($event.value)">
        </dx-select-box>
      </div>

      <div class="toolbar-field">
        <dx-text-box
          labelMode="hidden"
          placeholder="Id Entità..."
          [showClearButton]="true"
          [value]="$any(filterEntCode())"
          (onValueChanged)="filterEntCode.set($event.value || null)">
        </dx-text-box>
      </div>

      <div class="toolbar-field">
        <dx-select-box
          [items]="errorOptions"
          displayExpr="text"
          valueExpr="id"
          labelMode="hidden"
          placeholder="Errore..."
          [value]="filterError()"
          (onValueChanged)="filterError.set($event.value)">
        </dx-select-box>
      </div>

      <div class="toolbar-field">
        <dx-date-box
          type="date"
          displayFormat="dd/MM/yyyy"
          labelMode="hidden"
          placeholder="Dal..."
          [showClearButton]="true"
          [width]="130"
          [value]="filterDateFrom()"
          (onValueChanged)="filterDateFrom.set($event.value)">
        </dx-date-box>
      </div>

      <div class="toolbar-field">
        <dx-date-box
          type="date"
          displayFormat="dd/MM/yyyy"
          labelMode="hidden"
          placeholder="Al..."
          [showClearButton]="true"
          [width]="130"
          [value]="filterDateTo()"
          (onValueChanged)="filterDateTo.set($event.value)">
        </dx-date-box>
      </div>

      <div toolbar-actions>
        <app-sempione-button
          icon="search"
          hint="Cerca"
          variant="secondary"
          [disabled]="isLoading()"
          (clicked)="onVisualizza()">
        </app-sempione-button>
        <app-sempione-button
          icon="revert"
          hint="Reset filtri"
          variant="secondary"
          (clicked)="resetFilters()">
        </app-sempione-button>
      </div>

    </app-sempione-toolbar>

    <app-sempione-data-grid
      [dataSource]="traces()"
      [columns]="gridColumns"
      [isLoading]="isLoading()"
      [pageSize]="30"
      [allowedPageSizes]="[20, 30, 50, 100]"
      [showViewAction]="true"
      [showEditAction]="false"
      noDataText="Nessuna traccia trovata."
      (rowView)="openDetail($event)">
    </app-sempione-data-grid>

  </app-sempione-card>

</app-sempione-page-shell>

<!-- ── Popup Dettaglio Traccia ── -->
<app-sempione-popup
  [(visible)]="detailVisible"
  [title]="'Dettaglio Traccia — #' + (selectedTrace()?.traId ?? '')"
  [maxWidth]="680"
  (hidden)="closeDetail()">

  <div class="popup-layout">

    <app-sempione-popup-card title="Informazioni Traccia">
      <div class="popup-fields-grid popup-fields-grid--2col">

        <app-sempione-field-group label="ID" [locked]="true">
          <dx-text-box [value]="selectedTrace()?.traId?.toString() ?? ''" [readOnly]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Data e Ora" [locked]="true">
          <dx-text-box [value]="formatDateTime(selectedTrace()?.traTime)" [readOnly]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Utente" [locked]="true">
          <dx-text-box [value]="selectedTrace()?.traUser || '—'" [readOnly]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Stazione" [locked]="true">
          <dx-text-box [value]="selectedTrace()?.traStation || '—'" [readOnly]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Funzione" [locked]="true">
          <dx-text-box [value]="selectedTrace()?.traFunCode || '—'" [readOnly]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Sottofunzione" [locked]="true">
          <dx-text-box [value]="selectedTrace()?.traSubFun || '—'" [readOnly]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Tabella" [locked]="true">
          <dx-text-box [value]="selectedTrace()?.traTabNam || '—'" [readOnly]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Id Entità" [locked]="true">
          <dx-text-box [value]="selectedTrace()?.traEntCode || '—'" [readOnly]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Errore" [locked]="true">
          <dx-text-box [value]="selectedTrace()?.traError ? 'Sì' : 'No'" [readOnly]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      cancelText="Chiudi"
      [showSave]="false"
      (cancel)="closeDetail()">
    </app-sempione-popup-action-bar>

  </div>

</app-sempione-popup>
