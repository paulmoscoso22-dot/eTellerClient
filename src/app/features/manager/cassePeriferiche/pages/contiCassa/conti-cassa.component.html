<div class="page-shell">

  <app-sempione-page-header title="Conti Cassa"></app-sempione-page-header>

  <app-sempione-card>

    <app-sempione-card-header title="Conti Cassa">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="5" width="20" height="14" rx="2"></rect>
        <line x1="2" y1="10" x2="22" y2="10"></line>
      </svg>
    </app-sempione-card-header>

    <app-sempione-toolbar>

      <div class="toolbar-field">
        <dx-select-box
          [dataSource]="cassaFilterList"
          displayExpr="cliDes"
          valueExpr="cliId"
          labelMode="hidden"
          placeholder="Cassa..."
          [value]="filterCassa()"
          (onValueChanged)="onFilterCassaChanged($event)">
        </dx-select-box>
      </div>

      <div class="toolbar-field">
        <dx-select-box
          [dataSource]="actFilterList"
          displayExpr="actDes"
          valueExpr="actId"
          labelMode="hidden"
          placeholder="Tipo conto..."
          [value]="filterActId()"
          (onValueChanged)="onFilterActChanged($event)">
        </dx-select-box>
      </div>

      <div class="toolbar-field">
        <dx-select-box
          [dataSource]="brancheFilterList"
          displayExpr="braDes"
          valueExpr="braId"
          labelMode="hidden"
          placeholder="Località..."
          [value]="filterBraId()"
          (onValueChanged)="onFilterBraChanged($event)">
        </dx-select-box>
      </div>

      <div class="toolbar-field">
        <dx-select-box
          [dataSource]="divisaFilterList"
          displayExpr="curLondes"
          valueExpr="curId"
          labelMode="hidden"
          placeholder="Divisa..."
          [value]="filterCurId()"
          (onValueChanged)="onFilterCurChanged($event)">
        </dx-select-box>
      </div>

      <div class="toolbar-field">
        <dx-text-box
          labelMode="hidden"
          placeholder="N° Conto..."
          [showClearButton]="true"
          [value]="filterAccId()"
          valueChangeEvent="input"
          (onValueChanged)="onFilterAccIdChanged($event)">
        </dx-text-box>
      </div>

      <div class="toolbar-field">
        <dx-select-box
          [dataSource]="gruppoFilterList"
          displayExpr="cutDes"
          valueExpr="cutId"
          labelMode="hidden"
          placeholder="Gruppo..."
          [value]="filterCutId()"
          (onValueChanged)="onFilterCutChanged($event)">
        </dx-select-box>
      </div>

      <div class="toolbar-field">
        <dx-text-box
          labelMode="hidden"
          placeholder="Descrizione..."
          [showClearButton]="true"
          [value]="filterDes()"
          valueChangeEvent="input"
          (onValueChanged)="onFilterDesChanged($event)">
        </dx-text-box>
      </div>

      <div toolbar-actions>
        <app-sempione-button
          icon="revert"
          hint="Reset filtri"
          variant="secondary"
          (clicked)="resetFilters()">
        </app-sempione-button>
        <span class="toolbar-sep" toolbar-actions></span>
        <app-sempione-button
          text="Nuovo Conto"
          icon="add"
          variant="primary"
          [shadow]="true"
          (clicked)="openNewPopup()">
        </app-sempione-button>
      </div>

    </app-sempione-toolbar>

    <app-sempione-data-grid
      [dataSource]="gridData()"
      [columns]="gridColumns"
      keyExpr="iacId"
      [isLoading]="isLoading()"
      [error]="error()"
      [pageSize]="20"
      [allowedPageSizes]="[20, 50, 100]"
      [showViewAction]="true"
      [showEditAction]="true"
      [showTraceAction]="true"
      noDataText="Nessun conto trovato."
      (rowView)="onTableAction('view', $event)"
      (rowEdit)="onTableAction('edit', $event)"
      (rowTrace)="onRowTrace($event)">
    </app-sempione-data-grid>

  </app-sempione-card>

</div>

<!-- ── Popup Dettaglio / Modifica / Nuovo Conto Cassa ── -->
<app-sempione-popup
  [(visible)]="isDetailPopupVisible"
  [title]="popupTitle()"
  [maxWidth]="740"
  (hidden)="closePopup()">

  <form [formGroup]="contoForm" class="popup-layout" [class.popup-view-mode]="popupMode() === 'view'">

    <app-sempione-popup-card title="Identificazione">
      <div class="popup-fields-grid popup-fields-grid--2col">

        <app-sempione-field-group label="Numero Conto *" [locked]="popupMode() !== 'new'">
          <dx-text-box formControlName="iacAccId" [readOnly]="popupMode() !== 'new'" placeholder="Max 50 caratteri" labelMode="hidden">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
              <dxi-validation-rule type="stringLength" [max]="50" message="Massimo 50 caratteri"></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Tipo Conto Host *">
          <dx-text-box formControlName="iacHostPrefix" [readOnly]="popupMode() === 'view'" placeholder="Es. 10 o 95" labelMode="hidden">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
              <dxi-validation-rule type="stringLength" [max]="25" message="Massimo 25 caratteri"></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Descrizione *" class="popup-col-span-2">
          <dx-text-box formControlName="iacDes" [readOnly]="popupMode() === 'view'" placeholder="Max 50 caratteri" labelMode="hidden">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
              <dxi-validation-rule type="stringLength" [max]="50" message="Massimo 50 caratteri"></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-card title="Classificazione">
      <div class="popup-fields-grid popup-fields-grid--3col">

        <app-sempione-field-group label="Tipo Conto *">
          <dx-select-box formControlName="iacActId" [dataSource]="actList" displayExpr="actDes" valueExpr="actId" [readOnly]="popupMode() === 'view'" labelMode="hidden">
            <dx-validator><dxi-validation-rule type="required"></dxi-validation-rule></dx-validator>
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Gruppo Operazioni *">
          <dx-select-box formControlName="iacCutId" [dataSource]="gruppoList" displayExpr="cutDes" valueExpr="cutId" [readOnly]="popupMode() === 'view'" labelMode="hidden">
            <dx-validator><dxi-validation-rule type="required"></dxi-validation-rule></dx-validator>
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Divisa">
          <dx-select-box formControlName="iacCurId" [dataSource]="divisaFormList" displayExpr="curLondes" valueExpr="curId" [readOnly]="popupMode() === 'view'" labelMode="hidden"></dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Cassa *">
          <dx-select-box formControlName="iacCliCassa" [dataSource]="cassaList" displayExpr="cliDes" valueExpr="cliId" [readOnly]="popupMode() === 'view'" labelMode="hidden"
            (onValueChanged)="popupMode() !== 'view' && onCassaFormChanged($event)">
            <dx-validator><dxi-validation-rule type="required"></dxi-validation-rule></dx-validator>
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Località" [locked]="true">
          <dx-text-box formControlName="iacBraId" [readOnly]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      [cancelText]="popupMode() === 'view' ? 'Chiudi' : 'Annulla'"
      [saveText]="popupMode() === 'new' ? 'Crea Conto' : 'Salva Modifiche'"
      [showSave]="popupMode() !== 'view'"
      [showStorico]="popupMode() !== 'new'"
      (save)="popupMode() === 'new' ? onSubmit() : onUpdate()"
      (cancel)="closePopup()"
      (storico)="onTrace()">
    </app-sempione-popup-action-bar>

  </form>

</app-sempione-popup>
