<app-sempione-page-shell title="Casse">

  <app-sempione-card>

    <app-sempione-card-header title="Elenco Casse">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
        <path d="M12 8v8M8 12h8"></path>
      </svg>
    </app-sempione-card-header>

    <app-sempione-search-mode
      mode="header"
      newText="Nuova Cassa"
      (reset)="clearGridFilters()"
      (add)="openNewPopup()">
    </app-sempione-search-mode>

    <app-sempione-data-grid
      [dataSource]="gridData()"
      [columns]="gridColumns"
      keyExpr="cliId"
      [isLoading]="isLoading()"
      [error]="error()"
      [showHeaderFilter]="true"
      [pageSize]="20"
      [allowedPageSizes]="[20, 50, 100]"
      [showViewAction]="true"
      [showEditAction]="true"
      [showTraceAction]="true"
      [showDeleteAction]="true"
      noDataText="Nessuna cassa trovata."
      (rowView)="onTableAction('view', $event)"
      (rowEdit)="onTableAction('edit', $event)"
      (rowTrace)="onRowTrace($event)"
      (rowDelete)="onRowDelete($event)"
      (rowDblClick)="onTableAction('view', $event)">
    </app-sempione-data-grid>

  </app-sempione-card>

</app-sempione-page-shell>

<!-- ── Popup Dettaglio / Modifica / Nuova Cassa ── -->
<app-sempione-popup
  [(visible)]="isDetailPopupVisible"
  [title]="popupTitle()"
  [maxWidth]="800"
  (hidden)="closePopup()">

  <form [formGroup]="cassaForm" class="popup-layout">

    <app-sempione-popup-card title="Identificazione">
      <div class="popup-fields-grid popup-fields-grid--4col">

        <app-sempione-field-group label="ID Cassa" [required]="true" [locked]="popupMode() !== 'new'">
          <dx-text-box formControlName="cliId" [readOnly]="popupMode() !== 'new'" placeholder="Es. A01" labelMode="hidden">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
              <dxi-validation-rule type="pattern" [pattern]="'^[0-9A-Z]{3}$'" message="3 caratteri: cifre o lettere maiuscole"></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Stato" [required]="true" [locked]="popupMode() === 'view'">
          <dx-select-box formControlName="cliStatus" [dataSource]="statiList()" displayExpr="steDes" valueExpr="steId" [readOnly]="popupMode() === 'view'" labelMode="hidden">
            <dx-validator><dxi-validation-rule type="required"></dxi-validation-rule></dx-validator>
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Lingua" [required]="true" [locked]="popupMode() === 'view'">
          <dx-select-box formControlName="cliLingua" [dataSource]="languagesList()" displayExpr="lanDes" valueExpr="lanId" [readOnly]="popupMode() === 'view'" labelMode="hidden">
            <dx-validator><dxi-validation-rule type="required"></dxi-validation-rule></dx-validator>
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Ufficio" [locked]="popupMode() === 'view'">
          <dx-text-box formControlName="cliOff" [readOnly]="popupMode() === 'view'" placeholder="Codice ufficio" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Filiale" [required]="true" [locked]="popupMode() === 'view'" class="popup-col-span-2">
          <dx-select-box formControlName="cliBraId" [dataSource]="branchesList()" displayExpr="braDes" valueExpr="braId" [readOnly]="popupMode() === 'view'" labelMode="hidden"
            (onValueChanged)="popupMode() !== 'view' && onBranchChanged($event.value)">
            <dx-validator><dxi-validation-rule type="required"></dxi-validation-rule></dx-validator>
          </dx-select-box>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-card title="Configurazione Rete">
      <div class="popup-fields-grid popup-fields-grid--2col">

        <app-sempione-field-group label="Indirizzo IP" [required]="true" [locked]="popupMode() === 'view'">
          <dx-text-box formControlName="cliIp" [readOnly]="popupMode() === 'view'" placeholder="Es. 192.168.1.10" labelMode="hidden">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
              <dxi-validation-rule type="pattern"
                [pattern]="'^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$'"
                message="Indirizzo IP non valido">
              </dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Indirizzo MAC" [required]="true" [locked]="popupMode() === 'view'">
          <dx-text-box formControlName="cliMac" [readOnly]="popupMode() === 'view'" placeholder="Es. AA-BB-CC-DD-EE-FF" labelMode="hidden">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
              <dxi-validation-rule type="pattern"
                [pattern]="'^[0-9A-F]{2}-[0-9A-F]{2}-[0-9A-F]{2}-[0-9A-F]{2}-[0-9A-F]{2}-[0-9A-F]{2}$'"
                message="Formato MAC: XX-XX-XX-XX-XX-XX (maiuscolo)">
              </dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Descrizione" [locked]="popupMode() === 'view'" class="popup-col-span-2">
          <dx-text-area formControlName="cliDes" [readOnly]="popupMode() === 'view'" [height]="60" placeholder="Descrizione della cassa..." labelMode="hidden"></dx-text-area>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-card title="Periferiche Assegnate">
      <app-control-assign
        [assignedRoles]="assignedRolesForControl"
        [possibleRoles]="possibleRolesForControl"
        [disabled]="popupMode() === 'view'"
        (rolesChanged)="onRolesChanged($event)">
      </app-control-assign>
    </app-sempione-popup-card>

    @if (popupMode() !== 'new') {
      <app-sempione-popup-card title="Informazioni di Sistema">
        <div class="popup-fields-grid popup-fields-grid--3col">

          <app-sempione-field-group label="N° Operazioni" [locked]="true">
            <dx-text-box formControlName="cliCnt" [readOnly]="true" labelMode="hidden"></dx-text-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="Ultimo Reset Counter" [locked]="true">
            <dx-text-box formControlName="cliDatcounter" [readOnly]="true" labelMode="hidden"></dx-text-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="In Uso" [locked]="true">
            <dx-check-box formControlName="inUso" [readOnly]="true"></dx-check-box>
          </app-sempione-field-group>

        </div>
      </app-sempione-popup-card>
    }

    <app-sempione-popup-action-bar
      [cancelText]="popupMode() === 'new' ? 'Annulla' : 'Chiudi'"
      [saveText]="popupMode() === 'new' ? 'Crea Cassa' : 'Salva Modifiche'"
      [showSave]="popupMode() !== 'view'"
      [showStorico]="popupMode() !== 'new'"
      (save)="popupMode() === 'new' ? onSubmit() : onUpdate()"
      (cancel)="closePopup()"
      (storico)="onTrace()">
      @if (popupMode() === 'edit') {
        <div secondary-actions>
          <app-sempione-button text="Elimina" icon="trash" variant="danger" (clicked)="requestDeleteFromPopup()"></app-sempione-button>
        </div>
      }
    </app-sempione-popup-action-bar>

  </form>

</app-sempione-popup>

<!-- ── Popup Conferma Eliminazione ── -->
<app-sempione-confirm-delete
  [(visible)]="isConfirmDeleteVisible"
  entityLabel="la cassa"
  [entityName]="pendingDeleteId()"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()">
</app-sempione-confirm-delete>
