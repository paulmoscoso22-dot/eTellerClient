<app-sempione-page-header title="Informazione sulle autorizzazioni di un utente"></app-sempione-page-header>

<div class="content-layout">
<app-sempione-card>
  <app-sempione-card-header title="Autorizzazioni Utente">
    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <line x1="3" y1="9" x2="21" y2="9"/>
      <line x1="9" y1="21" x2="9" y2="9"/>
    </svg>
  </app-sempione-card-header>

  <app-sempione-toolbar>
    <dx-text-box
      [value]="filterData().funlikeName ?? ''"
      (onValueChanged)="setFunlikeName($event.value)"
      placeholder="Nome funzione"
      labelMode="hidden"
      [showClearButton]="true">
    </dx-text-box>
    <dx-text-box
      [value]="filterData().funlikeDes ?? ''"
      (onValueChanged)="setFunlikeDes($event.value)"
      placeholder="Descrizione"
      labelMode="hidden"
      [showClearButton]="true">
    </dx-text-box>

    <div toolbar-actions>
      <app-sempione-button icon="search" hint="Cerca" variant="secondary" (clicked)="onSearch()"></app-sempione-button>
      <app-sempione-button icon="revert" hint="Ripristina filtri" variant="secondary" (clicked)="onClear()"></app-sempione-button>
    </div>
  </app-sempione-toolbar>

  <div class="card-body--grid">
    <dx-data-grid
      [dataSource]="userAuthorizations()"
      [showBorders]="false"
      [columnAutoWidth]="false"
      [rowAlternationEnabled]="true"
      [hoverStateEnabled]="true"
      [allowColumnResizing]="true"
      columnResizingMode="nextColumn"
      [height]="'100%'">

      <dxo-paging [pageSize]="15" [enabled]="true"></dxo-paging>
      <dxo-pager
        [showInfo]="true"
        infoText="{2} autorizzazioni"
        [showPageSizeSelector]="true"
        [allowedPageSizes]="[15, 30, 50]"
        [showNavigationButtons]="true"
        displayMode="full">
      </dxo-pager>

      <dxi-column
        dataField="funId"
        caption="ID"
        [width]="65"
        dataType="number"
        alignment="center">
      </dxi-column>

      <dxi-column
        dataField="funName"
        caption="Nome Funzione"
        [width]="200">
      </dxi-column>

      <dxi-column
        dataField="funDescription"
        caption="Descrizione">
      </dxi-column>

      <dxi-column
        dataField="roleName"
        caption="Ruolo"
        [width]="185"
        cellTemplate="roleBadgeTemplate">
      </dxi-column>

      <dxi-column
        dataField="accessLevel"
        caption="Tipo di Accesso"
        [width]="145"
        alignment="center"
        cellTemplate="accessBadgeTemplate">
      </dxi-column>

      <div *dxTemplate="let cell of 'roleBadgeTemplate'">
        <span class="role-badge" [ngClass]="getRoleBadgeClass(cell.value)">
          {{ cell.value }}
        </span>
      </div>

      <div *dxTemplate="let cell of 'accessBadgeTemplate'">
        <span class="access-badge" [ngClass]="getAccessBadgeClass(cell.value)">
          {{ getAccessLabel(cell.value) }}
        </span>
      </div>

    </dx-data-grid>
  </div>

</app-sempione-card>

</div>
