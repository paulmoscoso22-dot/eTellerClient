<div class="page-shell">

  <!-- ── Titolo pagina ── -->
  <div class="page-header-row">
    <h1 class="page-title">Informazione sulle autorizzazioni di un utente</h1>
  </div>

  <!-- ══════════════════════════════════════
       CARD 1 — Filtri di Ricerca
       ══════════════════════════════════════ -->
  <section class="card-section card-section--filters">

    <div class="sempione-card-header">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <h2 class="card-title">Filtri di Ricerca</h2>
    </div>
    <div class="gold-divider"></div>

    <div class="filter-body">
      <div class="filter-fields">
        <div class="filter-field">
          <label class="toolbar-lbl">Nome funzione</label>
          <dx-text-box
            class="toolbar-input"
            [value]="filterData().funlikeName ?? ''"
            (valueChange)="setFunlikeName($event)"
            placeholder="es. manager/user.aspx">
          </dx-text-box>
        </div>
        <div class="filter-field">
          <label class="toolbar-lbl">Descrizione</label>
          <dx-text-box
            class="toolbar-input"
            [value]="filterData().funlikeDes ?? ''"
            (valueChange)="setFunlikeDes($event)"
            placeholder="es. Gestione accessi utente">
          </dx-text-box>
        </div>
      </div>
      <div class="filter-footer">
        <dx-button
          text="Ripristina"
          icon="revert"
          stylingMode="outlined"
          class="btn-reset"
          (onClick)="onClear()">
        </dx-button>
        <dx-button
          text="Cerca"
          icon="search"
          type="default"
          stylingMode="contained"
          class="btn-cerca"
          (onClick)="onSearch()">
        </dx-button>
      </div>
    </div>

  </section>

  <!-- ══════════════════════════════════════
       CARD 2 — Risultati della Ricerca
       ══════════════════════════════════════ -->
  <section class="card-section card-section--results">

    <div class="sempione-card-header">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
        <line x1="9" y1="21" x2="9" y2="9"/>
      </svg>
      <h2 class="card-title">Risultati della ricerca — Autorizzazioni Utente</h2>
    </div>
    <div class="gold-divider"></div>

    <div class="card-body card-body--grid">
      <dx-data-grid
        [dataSource]="userAuthorizations()"
        [showBorders]="false"
        [columnAutoWidth]="false"
        [rowAlternationEnabled]="true"
        [hoverStateEnabled]="true"
        [allowColumnResizing]="true"
        columnResizingMode="nextColumn"
        width="100%">

        <dxo-paging [pageSize]="15" [enabled]="true"></dxo-paging>
        <dxo-pager
          [showInfo]="true"
          infoText="{2} autorizzazioni"
          [showPageSizeSelector]="true"
          [allowedPageSizes]="[15, 30, 50]"
          [showNavigationButtons]="true"
          displayMode="full">
        </dxo-pager>

        <dxi-column
          dataField="funId"
          caption="ID"
          [width]="65"
          dataType="number"
          alignment="center">
        </dxi-column>

        <dxi-column
          dataField="funName"
          caption="Nome Funzione"
          [width]="200">
        </dxi-column>

        <dxi-column
          dataField="funDescription"
          caption="Descrizione">
        </dxi-column>

        <dxi-column
          dataField="roleName"
          caption="Ruolo"
          [width]="185"
          cellTemplate="roleBadgeTemplate">
        </dxi-column>

        <dxi-column
          dataField="accessLevel"
          caption="Tipo di Accesso"
          [width]="145"
          alignment="center"
          cellTemplate="accessBadgeTemplate">
        </dxi-column>

        <div *dxTemplate="let cell of 'roleBadgeTemplate'">
          <span class="role-badge" [ngClass]="getRoleBadgeClass(cell.value)">
            {{ cell.value }}
          </span>
        </div>

        <div *dxTemplate="let cell of 'accessBadgeTemplate'">
          <span class="access-badge" [ngClass]="getAccessBadgeClass(cell.value)">
            {{ getAccessLabel(cell.value) }}
          </span>
        </div>

      </dx-data-grid>
    </div>

  </section>

</div>
