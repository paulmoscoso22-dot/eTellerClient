<app-sempione-page-header title="Utenti Collegati"></app-sempione-page-header>

<app-sempione-card>
  <app-sempione-card-header title="Elenco Utenti Collegati">
    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
      <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>
  </app-sempione-card-header>

  <app-sempione-toolbar>
    <dx-text-box
      [value]="searchText()"
      (onValueChanged)="searchText.set($event.value)"
      placeholder="Cerca per User ID o Client ID..."
      labelMode="hidden"
      [showClearButton]="true">
    </dx-text-box>

    <div toolbar-actions>
      <dx-button
        icon="revert"
        hint="Ripristina"
        stylingMode="outlined"
        class="btn-fin-secondary"
        (onClick)="searchText.set('')">
      </dx-button>
      <dx-button
        icon="refresh"
        text="Aggiorna"
        stylingMode="outlined"
        class="btn-fin-secondary"
        (onClick)="onRefresh()">
      </dx-button>
      <dx-button
        icon="remove"
        text="Forza Uscita"
        stylingMode="contained"
        class="btn-fin-danger-filled"
        [disabled]="!selectedUsrCliId() || isLoading()"
        (onClick)="forzaUscita()">
      </dx-button>
    </div>
  </app-sempione-toolbar>

  <app-sempione-data-grid
    [dataSource]="filteredUsers()"
    [keyExpr]="'usrCliId'"
    [columns]="columns"
    [pageSize]="15"
    [allowedPageSizes]="[15, 30, 50]"
    [showEditAction]="false"
    [showForceAction]="true"
    [isLoading]="isLoading()"
    (selectionChanged)="onSelectionChanged($event)"
    (rowForce)="forzaUscitaFromRow($event)">
  </app-sempione-data-grid>
</app-sempione-card>
