<app-sempione-page-header title="Funzioni di Sistema"></app-sempione-page-header>

<!-- ══ Layout 2/3 + 1/3 — preserved ══ -->
<div class="content-grid">

  <!-- ══ Card Elenco Funzioni (2/3) ══ -->
  <app-sempione-card>
    <app-sempione-card-header title="Elenco Funzioni">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
    </app-sempione-card-header>

    <app-sempione-toolbar>
      <dx-text-box
        [value]="filterFunDescription()"
        (onValueChanged)="filterFunDescription.set($event.value)"
        placeholder="Cerca per descrizione..."
        labelMode="hidden"
        [showClearButton]="true">
      </dx-text-box>
      <dx-text-box
        [value]="filterFunName()"
        (onValueChanged)="filterFunName.set($event.value)"
        placeholder="Cerca per nome funzione..."
        labelMode="hidden"
        [showClearButton]="true">
      </dx-text-box>

      <div toolbar-actions>
        <app-sempione-button icon="search" hint="Cerca" variant="secondary" (clicked)="filterFunDescription.set(filterFunDescription())"></app-sempione-button>
        <app-sempione-button icon="revert" hint="Ripristina filtri" variant="secondary" (clicked)="resetFilters()"></app-sempione-button>
        <app-sempione-button icon="refresh" hint="Reset selezione" variant="secondary" (clicked)="onReset()"></app-sempione-button>
        <span class="toolbar-sep"></span>
        <app-sempione-button text="Nuovo" icon="plus" variant="primary" [shadow]="true" (clicked)="onAdd()"></app-sempione-button>
      </div>
    </app-sempione-toolbar>

    <app-sempione-data-grid
      [dataSource]="filteredFunctions()"
      [keyExpr]="'funId'"
      [columns]="columns"
      [pageSize]="15"
      [allowedPageSizes]="[15, 30, 50]"
      [showEditAction]="true"
      [showTraceAction]="true"
      [showDeleteAction]="true"
      (selectionChanged)="onFunctionSelect($event)"
      (rowEdit)="openEditPopup($event)"
      (rowTrace)="onTraceFromRow($event)"
      (rowDelete)="onDeleteFromRow($event)">
    </app-sempione-data-grid>
  </app-sempione-card>

  <!-- ══ Colonna destra: Ruoli + Utenti (1/3) — preserved ══ -->
  <div class="cards-right">

    <app-sempione-card>
      <app-sempione-card-header title="Ruoli">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </app-sempione-card-header>
      <app-sempione-toolbar>
        <dx-text-box
          [value]="searchRoles()"
          (onValueChanged)="searchRoles.set($event.value)"
          placeholder="Cerca ruolo..."
          labelMode="hidden"
          [showClearButton]="true">
        </dx-text-box>
        <div toolbar-actions>
          <app-sempione-button icon="search" hint="Cerca" variant="secondary" (clicked)="searchRoles.set(searchRoles())"></app-sempione-button>
          <app-sempione-button icon="revert" hint="Ripristina" variant="secondary" (clicked)="searchRoles.set('')"></app-sempione-button>
        </div>
      </app-sempione-toolbar>
      <div class="card-body--grid">
        <app-sempione-data-grid
          #rolesGrid
          [dataSource]="filteredSysRoles()"
          [keyExpr]="'roleId'"
          [columns]="rolesColumns"
          [pageSize]="5"
          [allowedPageSizes]="[5, 10, 20]"
          [showEditAction]="false"
          [showTraceAction]="false"
          [showDeleteAction]="false"
          (selectionChanged)="onRoleSelect($event)">
        </app-sempione-data-grid>
      </div>
    </app-sempione-card>

    <app-sempione-card>
      <app-sempione-card-header title="Utenti associati">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </app-sempione-card-header>
      <app-sempione-toolbar>
        <dx-text-box
          [value]="searchUsers()"
          (onValueChanged)="searchUsers.set($event.value)"
          placeholder="Cerca utente..."
          labelMode="hidden"
          [showClearButton]="true">
        </dx-text-box>
        <div toolbar-actions>
          <app-sempione-button icon="search" hint="Cerca" variant="secondary" (clicked)="searchUsers.set(searchUsers())"></app-sempione-button>
          <app-sempione-button icon="revert" hint="Ripristina" variant="secondary" (clicked)="searchUsers.set('')"></app-sempione-button>
        </div>
      </app-sempione-toolbar>
      <div class="card-body--grid">
        <app-sempione-data-grid
          #usersGrid
          [dataSource]="filteredUsersRoleFunctions()"
          [keyExpr]="'usrId'"
          [columns]="usersColumns"
          [pageSize]="5"
          [allowedPageSizes]="[5, 10, 20]"
          [showEditAction]="false"
          [showTraceAction]="false"
          [showDeleteAction]="false"
          (selectionChanged)="onUserSelect($event)">
        </app-sempione-data-grid>
      </div>
    </app-sempione-card>

  </div>
</div>

<!-- ══ Popup: Dettaglio / Modifica Funzione ══ -->
<app-sempione-popup
  [visible]="showDetailPopup()"
  (visibleChange)="showDetailPopup.set($event)"
  [title]="(popupMode() === 'edit' ? 'Modifica Funzione' : 'Dettaglio Funzione') + (selectedFunName() ? ' — ' + selectedFunName() : '')"
  [maxWidth]="560">

  <div class="popup-layout">
    <app-sempione-popup-card title="Dettaglio Funzione">
      <div class="popup-fields-grid popup-fields-grid--2col">

        <div class="popup-col-span-2">
          <app-sempione-field-group label="Nome">
            <dx-text-box
              [value]="selectedFunName()"
              [readOnly]="popupMode() === 'view'"
              (onValueChanged)="popupMode() === 'edit' && selectedFunName.set($event.value)">
            </dx-text-box>
          </app-sempione-field-group>
        </div>

        <app-sempione-field-group label="Host Code">
          <dx-number-box
            [value]="selectedFunHostcode()"
            [readOnly]="popupMode() === 'view'"
            (onValueChanged)="popupMode() === 'edit' && selectedFunHostcode.set($event.value)">
          </dx-number-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Offline">
          @if (popupMode() === 'view') {
            <dx-text-box
              [value]="selectedOffline() ? 'Sì' : 'No'"
              [readOnly]="true">
            </dx-text-box>
          } @else {
            <dx-check-box
              [value]="selectedOffline()"
              (onValueChanged)="selectedOffline.set($event.value)"
              text="Disponibile in modalità offline">
            </dx-check-box>
          }
        </app-sempione-field-group>

        <div class="popup-col-span-2">
          <app-sempione-field-group label="Descrizione">
            <dx-text-area
              [value]="selectedFunDescription()"
              [readOnly]="popupMode() === 'view'"
              [height]="80"
              (onValueChanged)="popupMode() === 'edit' && selectedFunDescription.set($event.value)">
            </dx-text-area>
          </app-sempione-field-group>
        </div>

      </div>
    </app-sempione-popup-card>

    @if (popupMode() === 'view') {
      <app-sempione-popup-action-bar
        saveText="Modifica"
        cancelText="Chiudi"
        [showStorico]="true"
        (save)="switchToEditMode()"
        (cancel)="showDetailPopup.set(false)"
        (storico)="onTrace()">
      </app-sempione-popup-action-bar>
    } @else {
      <app-sempione-popup-action-bar
        saveText="Salva Modifiche"
        cancelText="Annulla"
        [showStorico]="true"
        [isSaving]="isLoading()"
        (save)="onSaveDetail()"
        (cancel)="showDetailPopup.set(false)"
        (storico)="onTrace()">
        <app-sempione-button secondary-actions text="Cancella" icon="trash" variant="danger" (clicked)="requestDelete()"></app-sempione-button>
      </app-sempione-popup-action-bar>
    }
  </div>

</app-sempione-popup>

<!-- ══ Popup: Aggiungi Funzione ══ -->
<app-sempione-popup
  [visible]="showAddPopup()"
  (visibleChange)="showAddPopup.set($event)"
  title="Nuova Funzione"
  [maxWidth]="560">

  <form [formGroup]="addForm" class="popup-layout">
    <app-sempione-popup-card title="Dettagli Funzione">
      <div class="popup-fields-grid popup-fields-grid--2col">

        <div class="popup-col-span-2">
          <app-sempione-field-group label="Nome" [required]="true">
            <dx-text-box
              formControlName="funName"
              placeholder="Nome della funzione"
              [isValid]="!(addForm.get('funName')?.invalid && addForm.get('funName')?.touched)">
            </dx-text-box>
            @if (addForm.get('funName')?.invalid && addForm.get('funName')?.touched) {
              <span class="field-error">Nome funzione richiesto</span>
            }
          </app-sempione-field-group>
        </div>

        <app-sempione-field-group label="Host Code">
          <dx-number-box
            formControlName="funHostcode"
            [isValid]="!(addForm.get('funHostcode')?.invalid && addForm.get('funHostcode')?.touched)">
          </dx-number-box>
          @if (addForm.get('funHostcode')?.invalid && addForm.get('funHostcode')?.touched) {
            <span class="field-error">Host code richiesto</span>
          }
        </app-sempione-field-group>

        <app-sempione-field-group label="Offline">
          <dx-check-box formControlName="offline" text="Disponibile in modalità offline"></dx-check-box>
        </app-sempione-field-group>

        <div class="popup-col-span-2">
          <app-sempione-field-group label="Descrizione">
            <dx-text-area formControlName="funDescription" [height]="80"></dx-text-area>
          </app-sempione-field-group>
        </div>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      saveText="Crea Funzione"
      cancelText="Annulla"
      [isSaving]="isLoading()"
      (save)="onSaveAdd()"
      (cancel)="onCancelAdd()">
    </app-sempione-popup-action-bar>
  </form>

</app-sempione-popup>

<!-- ══ Popup Conferma Eliminazione ══ -->
<app-sempione-confirm-delete
  [(visible)]="isConfirmDeleteVisible"
  entityLabel="la funzione"
  [entityName]="pendingDeleteFun()?.funName ?? ''"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()">
</app-sempione-confirm-delete>
