<app-sempione-page-shell title="Gestione Utenti">

<!-- ══ Card principale ══ -->
<app-sempione-card>
  <app-sempione-card-header title="Elenco Utenti">
    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
      <circle cx="9" cy="7" r="4"></circle>
      <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
    </svg>
  </app-sempione-card-header>

  <app-sempione-toolbar>
    <!-- Segmented filter (preserved as custom widget) -->
    <div class="segmented-control" role="group">
      @for (item of filterItems; track item.value) {
        <button class="segment-btn"
                [class.active]="selectedFilter() === item.value"
                (click)="onFilterChanged({ value: item.value })">
          {{ item.label }}
        </button>
      }
    </div>

    <dx-text-box
      placeholder="Cerca utenti..."
      [showClearButton]="true"
      labelMode="hidden"
      valueChangeEvent="input"
      (onValueChanged)="onSearchChanged($event)">
    </dx-text-box>

    <div toolbar-actions>
      <app-sempione-button
        icon="print"
        hint="Stampa lista utenti"
        variant="secondary"
        (clicked)="onStampaLista()">
      </app-sempione-button>
      <app-sempione-button
        text="Nuovo"
        icon="plus"
        variant="primary"
        [shadow]="true"
        (clicked)="openNewUserPopup()">
      </app-sempione-button>
    </div>
  </app-sempione-toolbar>

  <!-- Griglia utenti -->
  <app-sempione-data-grid
    [dataSource]="gridData()"
    [columns]="gridColumns"
    keyExpr="usrId"
    [pageSize]="20"
    [allowedPageSizes]="[20, 50, 100]"
    [showViewAction]="true"
    [showEditAction]="true"
    [showTraceAction]="true"
    [showDeleteAction]="false"
    noDataText="Nessun utente trovato."
    (selectionChanged)="onSelectionChanged($event)"
    (rowView)="openViewPopup($event)"
    (rowEdit)="openEditPopup($event)"
    (rowTrace)="onRowTrace($event)">
  </app-sempione-data-grid>
</app-sempione-card>

</app-sempione-page-shell>

<!-- ══ Popup: Dettaglio / Form Utente ══ -->
<app-sempione-popup
  [visible]="showDetailPopup()"
  (visibleChange)="onDetailPopupVisibleChange($event)"
  [title]="popupMode() === 'edit' ? 'Modifica Utente — ' + selectedUserId()
         : popupMode() === 'view' ? 'Dettaglio Utente — ' + selectedUserId()
         : 'Nuovo Utente'"
  [maxWidth]="900">

  <form [formGroup]="userForm"
        (ngSubmit)="onSubmit()"
        class="popup-layout"
        [class.popup-view-mode]="popupMode() === 'view'">

    <!-- ── Sezione 1: Informazioni Profilo ── -->
    <app-sempione-popup-card title="Informazioni Profilo">
      <div class="popup-fields-grid popup-fields-grid--3col">

        <app-sempione-field-group label="ID Utente" [required]="true" [locked]="popupMode() === 'edit'">
          <dx-text-box formControlName="usrId" [readOnly]="popupMode() === 'edit' || popupMode() === 'view'">
            <dx-validator><dxi-validation-rule type="required"></dxi-validation-rule></dx-validator>
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Stato" [required]="true">
          <dx-select-box formControlName="usrStatus" [dataSource]="statiEntitaList()" displayExpr="steDes" valueExpr="steId" [readOnly]="popupMode() === 'view'">
            <dx-validator><dxi-validation-rule type="required"></dxi-validation-rule></dx-validator>
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Riferimento Esterno">
          <dx-text-box formControlName="usrExtref" [readOnly]="popupMode() === 'view'"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Host ID" [required]="true">
          <dx-text-box formControlName="usrHostId" [readOnly]="popupMode() === 'view'">
            <dx-validator><dxi-validation-rule type="required"></dxi-validation-rule></dx-validator>
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Filiale" [required]="true">
          <dx-select-box formControlName="usrBraId" [dataSource]="branchesList()" displayExpr="braDes" valueExpr="braId" [readOnly]="popupMode() === 'view'">
            <dx-validator><dxi-validation-rule type="required"></dxi-validation-rule></dx-validator>
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Lingua" [required]="true">
          <dx-select-box formControlName="usrLingua" [dataSource]="languagesList()" displayExpr="lanDes" valueExpr="lanId" [readOnly]="popupMode() === 'view'">
            <dx-validator><dxi-validation-rule type="required"></dxi-validation-rule></dx-validator>
          </dx-select-box>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <!-- ── Sezione 2: Gestione Ruoli ── -->
    <app-sempione-popup-card title="Gestione Ruoli">
      @if (popupMode() === 'view') {
        <dx-data-grid
          [dataSource]="assignedRoles()"
          [showBorders]="false"
          keyExpr="roleId"
          [height]="'auto'"
          [columnAutoWidth]="true"
          [hoverStateEnabled]="true"
          [rowAlternationEnabled]="true">
          <dxo-paging [pageSize]="5"></dxo-paging>
          <dxo-pager [showInfo]="true" infoText="{2} ruoli" [showPageSizeSelector]="false" [showNavigationButtons]="true" displayMode="full"></dxo-pager>
          <dxi-column dataField="roleName" caption="Ruolo"></dxi-column>
          <dxo-load-panel [enabled]="false"></dxo-load-panel>
        </dx-data-grid>
      } @else {
        <app-control-assign
          [assignedRoles]="assignedRoles"
          [possibleRoles]="possibleRoles"
          [disabled]="false"
          (rolesChanged)="onRolesChanged($event)">
        </app-control-assign>
      }
    </app-sempione-popup-card>

    <!-- ── Barra Azioni ── -->
    @if (popupMode() === 'view') {
      <app-sempione-popup-action-bar
        saveText="Modifica"
        cancelText="Chiudi"
        [showStorico]="true"
        (save)="openEditPopup({ usrId: selectedUserId() })"
        (cancel)="onClear()"
        (storico)="onTrace()">
        <app-sempione-button
          secondary-actions
          text="Stampa"
          icon="print"
          variant="secondary"
          (clicked)="onStampaLista()">
        </app-sempione-button>
      </app-sempione-popup-action-bar>
    } @else if (popupMode() === 'new') {
      <app-sempione-popup-action-bar
        saveText="Aggiungi"
        cancelText="Annulla"
        (save)="onSubmit()"
        (cancel)="onClear()">
      </app-sempione-popup-action-bar>
    } @else {
      <app-sempione-popup-action-bar
        saveText="Salva"
        cancelText="Annulla"
        [showStorico]="true"
        (save)="onUpdate()"
        (cancel)="onClear()"
        (storico)="onTrace()">
        <dx-button
          secondary-actions
          text="Reset Password"
          icon="key"
          stylingMode="outlined"
          class="btn-fin-danger"
          (onClick)="openResetPasswordPopup()">
        </dx-button>
      </app-sempione-popup-action-bar>
    }

  </form>
</app-sempione-popup>

<!-- ══ Popup: Reset Password ══ -->
<app-sempione-popup
  [visible]="showResetPopup()"
  (visibleChange)="showResetPopup.set($event)"
  title="Reset Password"
  [maxWidth]="420">

  <form [formGroup]="resetPasswordForm" (ngSubmit)="changePassword()" class="popup-layout">

    <app-sempione-popup-card title="Nuova Password">
      <div class="popup-fields-grid popup-fields-grid--1col">
        <app-sempione-field-group label="Password" [required]="true">
          <dx-text-box formControlName="password" mode="password">
            <dx-validator><dxi-validation-rule type="required"></dxi-validation-rule></dx-validator>
          </dx-text-box>
        </app-sempione-field-group>
        <app-sempione-field-group label="Conferma Password" [required]="true">
          <dx-text-box formControlName="confirmPassword" mode="password">
            <dx-validator><dxi-validation-rule type="required"></dxi-validation-rule></dx-validator>
          </dx-text-box>
        </app-sempione-field-group>
      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      saveText="Cambia Password"
      cancelText="Annulla"
      (save)="changePassword()"
      (cancel)="cancelResetPassword()">
    </app-sempione-popup-action-bar>

  </form>
</app-sempione-popup>
