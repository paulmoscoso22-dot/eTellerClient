<app-sempione-page-header title="Ruoli"></app-sempione-page-header>

<div class="layout-body">

  <!-- ══ Top Row: Gestione Ruoli (2/3) + Utenti associati (1/3) ══ -->
  <div class="top-row">

    <!-- ── Gestione Ruoli ── -->
    <app-sempione-card>
      <app-sempione-card-header title="Gestione Ruoli">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </app-sempione-card-header>

      <app-sempione-toolbar>
        <dx-text-box
          [value]="searchRoles()"
          (onValueChanged)="searchRoles.set($event.value)"
          placeholder="Cerca per nome o descrizione..."
          labelMode="hidden"
          [showClearButton]="true">
        </dx-text-box>
        <div toolbar-actions>
          <app-sempione-button icon="revert" hint="Ripristina filtri" variant="secondary" (clicked)="resetFilters()"></app-sempione-button>
          <app-sempione-button text="Nuovo" icon="plus" variant="primary" [shadow]="true" (clicked)="onAdd()"></app-sempione-button>
        </div>
      </app-sempione-toolbar>

      <app-sempione-data-grid
        [dataSource]="filteredRoles()"
        [keyExpr]="'roleId'"
        [columns]="ruoliColumns"
        [pageSize]="5"
        [allowedPageSizes]="[5, 10, 20]"
        [showEditAction]="true"
        [showTraceAction]="true"
        [showDeleteAction]="true"
        (selectionChanged)="onRoleSelectionChanged($event)"
        (rowEdit)="openEditPopup($event)"
        (rowTrace)="onTraceFromRow($event)"
        (rowDelete)="onDeleteFromRow($event)">
      </app-sempione-data-grid>
    </app-sempione-card>

    <!-- ── Utenti associati ── -->
    <app-sempione-card>
      <app-sempione-card-header title="Utenti associati">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </app-sempione-card-header>

      <app-sempione-toolbar>
        <dx-text-box
          [value]="searchUsers()"
          (onValueChanged)="searchUsers.set($event.value)"
          placeholder="Cerca utente..."
          labelMode="hidden"
          [showClearButton]="true">
        </dx-text-box>
        <div toolbar-actions>
          <app-sempione-button icon="revert" hint="Ripristina filtri" variant="secondary" (clicked)="searchUsers.set('')"></app-sempione-button>
        </div>
      </app-sempione-toolbar>

      <div class="card-body--grid">
        <app-sempione-data-grid
          [dataSource]="filteredUsersByRoleMapped()"
          [keyExpr]="'usrId'"
          [columns]="usersColumns"
          [pageSize]="5"
          [allowedPageSizes]="[5, 10, 20]"
          [showEditAction]="false"
          [showTraceAction]="false"
          [showDeleteAction]="false">
        </app-sempione-data-grid>
      </div>
    </app-sempione-card>

  </div>

  <!-- ══ Bottom Row: Funzioni per Ruolo ══ -->
  <div class="bottom-row">
    <app-sempione-card>
      <app-sempione-card-header title="Funzioni per Ruolo">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8"  y1="6"  x2="21" y2="6"></line>
          <line x1="8"  y1="12" x2="21" y2="12"></line>
          <line x1="8"  y1="18" x2="21" y2="18"></line>
          <line x1="3"  y1="6"  x2="3.01" y2="6"></line>
          <line x1="3"  y1="12" x2="3.01" y2="12"></line>
          <line x1="3"  y1="18" x2="3.01" y2="18"></line>
        </svg>
      </app-sempione-card-header>

      <app-sempione-toolbar>
        <dx-text-box
          [value]="searchName() ?? ''"
          (onValueChanged)="searchName.set($event.value)"
          placeholder="Filtra per nome..."
          labelMode="hidden"
          [showClearButton]="true">
        </dx-text-box>
        <dx-text-box
          [value]="searchDes() ?? ''"
          (onValueChanged)="searchDes.set($event.value)"
          placeholder="Filtra per descrizione..."
          labelMode="hidden"
          [showClearButton]="true">
        </dx-text-box>
        <div toolbar-actions>
          <app-sempione-button icon="search" hint="Cerca" variant="secondary" (clicked)="onCerca()"></app-sempione-button>
          <app-sempione-button icon="revert" hint="Ripristina filtri" variant="secondary" (clicked)="searchName.set(null); searchDes.set(null)"></app-sempione-button>
        </div>
      </app-sempione-toolbar>

      <div class="card-body--grid">
        <dx-data-grid
          [dataSource]="functionsByRole()"
          keyExpr="funId"
          [showBorders]="false"
          [columnAutoWidth]="true"
          [rowAlternationEnabled]="true"
          [hoverStateEnabled]="true"
          [height]="'100%'">
          <dxo-paging [pageSize]="10" [enabled]="true"></dxo-paging>
          <dxo-pager
            [showInfo]="true"
            infoText="{2} funzioni"
            [showPageSizeSelector]="true"
            [allowedPageSizes]="[5, 10, 20, 50]"
            [showNavigationButtons]="true"
            displayMode="full">
          </dxo-pager>
          <dxi-column dataField="funId"          caption="ID"              [width]="60"></dxi-column>
          <dxi-column dataField="funName"        caption="Nome Funzione"   [width]="200"></dxi-column>
          <dxi-column dataField="accessLevel"    caption="Livello Accesso" [width]="220" cellTemplate="accessCell"></dxi-column>
          <dxi-column dataField="funDescription" caption="Descrizione"></dxi-column>

          <div *dxTemplate="let cell of 'accessCell'">
            <dx-select-box
              [dataSource]="funcAccTyp()"
              valueExpr="fatId"
              displayExpr="fatDes"
              [value]="cell.value"
              [readOnly]="false">
            </dx-select-box>
          </div>

          <dxo-load-panel [enabled]="false"></dxo-load-panel>
        </dx-data-grid>
      </div>
    </app-sempione-card>
  </div>

</div>

<!-- ══ Popup: Dettaglio / Modifica Ruolo ══ -->
<app-sempione-popup
  [visible]="showDetailPopup()"
  (visibleChange)="showDetailPopup.set($event)"
  [title]="(popupMode() === 'edit' ? 'Modifica Ruolo' : 'Dettaglio Ruolo') + (selectedRoleName() ? ' — ' + selectedRoleName() : '')"
  [maxWidth]="480">

  <div class="popup-layout">
    <app-sempione-popup-card title="Dettaglio Ruolo">
      <div class="popup-fields-grid popup-fields-grid--2col">

        <app-sempione-field-group label="ID">
          <div class="detail-value mono">{{ selectedRoleId() || '—' }}</div>
        </app-sempione-field-group>

        <div class="popup-col-span-2">
          <app-sempione-field-group label="Nome Ruolo">
            <dx-text-box
              [value]="selectedRoleName()"
              [readOnly]="popupMode() === 'view'"
              (onValueChanged)="popupMode() === 'edit' && selectedRoleName.set($event.value)">
            </dx-text-box>
          </app-sempione-field-group>
        </div>

        <div class="popup-col-span-2">
          <app-sempione-field-group label="Descrizione">
            <dx-text-box
              [value]="selectedRoleDes()"
              [readOnly]="popupMode() === 'view'"
              (onValueChanged)="popupMode() === 'edit' && selectedRoleDes.set($event.value)">
            </dx-text-box>
          </app-sempione-field-group>
        </div>

      </div>
    </app-sempione-popup-card>

    @if (popupMode() === 'view') {
      <app-sempione-popup-action-bar
        saveText="Modifica"
        cancelText="Chiudi"
        [showStorico]="true"
        (save)="switchToEditMode()"
        (cancel)="showDetailPopup.set(false)"
        (storico)="onTrace()">
      </app-sempione-popup-action-bar>
    } @else {
      <app-sempione-popup-action-bar
        saveText="Salva Modifiche"
        cancelText="Annulla"
        [showStorico]="true"
        [isSaving]="isLoading()"
        (save)="onSaveDetail()"
        (cancel)="showDetailPopup.set(false)"
        (storico)="onTrace()">
        <dx-button
          secondary-actions
          text="Cancella"
          icon="trash"
          stylingMode="outlined"
          class="btn-fin-danger"
          (onClick)="requestDelete()">
        </dx-button>
      </app-sempione-popup-action-bar>
    }
  </div>

</app-sempione-popup>

<!-- ══ Popup: Aggiungi Ruolo ══ -->
<app-sempione-popup
  [visible]="showAddPopup()"
  (visibleChange)="showAddPopup.set($event)"
  title="Nuovo Ruolo"
  [maxWidth]="440">

  <form [formGroup]="addForm" class="popup-layout">
    <app-sempione-popup-card title="Dettagli Ruolo">
      <div class="popup-fields-grid popup-fields-grid--1col">

        <app-sempione-field-group label="Nome" [required]="true">
          <dx-text-box
            formControlName="roleName"
            placeholder="Nome del ruolo"
            [isValid]="!(addForm.get('roleName')?.invalid && addForm.get('roleName')?.touched)">
          </dx-text-box>
          @if (addForm.get('roleName')?.invalid && addForm.get('roleName')?.touched) {
            <span class="field-error">Nome ruolo richiesto</span>
          }
        </app-sempione-field-group>

        <app-sempione-field-group label="Descrizione">
          <dx-text-box formControlName="roleDes" placeholder="Descrizione opzionale"></dx-text-box>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      saveText="Crea Ruolo"
      cancelText="Annulla"
      [isSaving]="isLoading()"
      (save)="onSaveAdd()"
      (cancel)="onCancelAdd()">
    </app-sempione-popup-action-bar>
  </form>

</app-sempione-popup>

<!-- ══ Popup Conferma Eliminazione ══ -->
<app-sempione-confirm-delete
  [(visible)]="isConfirmDeleteVisible"
  entityLabel="il ruolo"
  [entityName]="pendingDeleteRole()?.roleName ?? ''"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()">
</app-sempione-confirm-delete>
