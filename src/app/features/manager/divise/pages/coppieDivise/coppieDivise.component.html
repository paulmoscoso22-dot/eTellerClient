<div class="page-shell">

  <!-- ── Titolo pagina ── -->
  <div class="page-header-row">
    <h1 class="page-title">Coppie Divise</h1>
  </div>

  <!-- ── Main Card ── -->
  <section class="card-section">

    <div class="sempione-card-header">
      <svg class="card-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
      <h2 class="card-title">Coppie Divise</h2>
    </div>
    <div class="gold-divider"></div>

    <!-- ── Toolbar ── -->
    <div class="card-toolbar">
      <div class="toolbar-inner">

        <div class="toolbar-filters">
          <div class="toolbar-field">
            <label class="toolbar-lbl">Cerca</label>
            <dx-text-box
              placeholder="Divisa o descrizione..."
              [showClearButton]="true"
              valueChangeEvent="input"
              labelMode="hidden"
              [value]="searchValue()"
              (onValueChanged)="onSearchChanged($event)">
            </dx-text-box>
          </div>
        </div>

        <div class="toolbar-actions">
          <dx-button
            icon="search"
            hint="Cerca"
            stylingMode="contained"
            class="btn-fin-primary action-shadow"
            (onClick)="onSearchChanged({value: searchValue()})">
          </dx-button>
          <dx-button
            icon="revert"
            hint="Ripristina filtri"
            stylingMode="outlined"
            class="btn-fin-secondary"
            (onClick)="onSearchChanged({value: ''})">
          </dx-button>
          <dx-button
            text="Nuova coppia"
            icon="plus"
            stylingMode="contained"
            class="btn-fin-primary action-shadow"
            (onClick)="openNewPopup()">
          </dx-button>
        </div>

      </div>
    </div>

    <!-- ── Griglia coppie divise ── -->
    <div class="card-body card-body--grid">
      <dx-data-grid
        [dataSource]="filteredCoppie()"
        [showBorders]="false"
        [columnAutoWidth]="false"
        [rowAlternationEnabled]="true"
        [hoverStateEnabled]="true"
        [height]="'100%'"
        [keyExpr]="['cucCur1', 'cucCur2']">

        <dxo-selection mode="single"></dxo-selection>
        <dxo-paging [pageSize]="20"></dxo-paging>
        <dxo-pager
          [showPageSizeSelector]="true"
          [allowedPageSizes]="[20, 50, 100]"
          [showInfo]="true"
          [showNavigationButtons]="true"
          displayMode="full">
        </dxo-pager>

        <dxi-column dataField="cucCur1"   caption="Divisa 1"        [width]="110" alignment="center" cellTemplate="currencyTemplate"></dxi-column>
        <dxi-column dataField="cucCur2"   caption="Divisa 2"        [width]="110" alignment="center" cellTemplate="currencyTemplate"></dxi-column>
        <dxi-column dataField="cucLondes" caption="Descrizione"                   alignment="left"></dxi-column>
        <dxi-column dataField="cucShodes" caption="Des. Abbreviata" [width]="150" alignment="left"></dxi-column>
        <dxi-column dataField="cucSize"   caption="Taglio"          [width]="90"  alignment="center" cellTemplate="taglioTemplate"></dxi-column>

        <dxi-column
          caption="Azioni"
          [width]="110"
          [allowSorting]="false"
          [allowFiltering]="false"
          alignment="center"
          cellTemplate="actionsTemplate">
        </dxi-column>

        <div *dxTemplate="let cell of 'currencyTemplate'" class="currency-cell">
          <span class="currency-badge">{{ cell.value }}</span>
        </div>

        <div *dxTemplate="let cell of 'taglioTemplate'" class="taglio-cell">
          <span class="taglio-pill" [class.taglio-pill--100]="cell.value === 100">
            {{ cell.value }}
          </span>
        </div>

        <div *dxTemplate="let cell of 'actionsTemplate'" class="actions-cell">
          <button class="action-btn action-btn--view" title="Visualizza" (click)="onTableAction('view', cell.data)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
          <button class="action-btn action-btn--edit" title="Modifica" (click)="onTableAction('edit', cell.data)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
          </button>
          <button class="action-btn action-btn--delete" title="Elimina" (click)="onTableAction('delete', cell.data)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14H6L5 6"></path>
              <path d="M10 11v6M14 11v6"></path>
              <path d="M9 6V4h6v2"></path>
            </svg>
          </button>
        </div>

        <dxo-load-panel [enabled]="false"></dxo-load-panel>

      </dx-data-grid>
    </div>

  </section>

</div>

<!-- ── Popup Dettaglio Coppia Divise ── -->
<dx-popup
  [(visible)]="isDetailPopupVisible"
  [showTitle]="true"
  [title]="popupMode() === 'edit' ? 'Modifica Coppia — ' + selectedLabel()
         : popupMode() === 'view' ? 'Dettaglio Coppia — ' + selectedLabel()
         : 'Nuova Coppia Divise'"
  [dragEnabled]="true"
  [hideOnOutsideClick]="false"
  [showCloseButton]="true"
  [width]="'90%'"
  [maxWidth]="680"
  [height]="'auto'"
  [maxHeight]="'90vh'"
  (onHidden)="closePopup()">

  <div *dxTemplate="let data of 'content'">
    <form [formGroup]="coppiaForm"
          class="popup-layout"
          [class.popup-view-mode]="popupMode() === 'view'">

      <!-- ── Card: Coppia di Divise ── -->
      <section class="popup-card">
        <h3 class="popup-card-title">Coppia di Divise</h3>

        <div class="popup-fields-grid popup-fields-grid--2col">

          <div class="popup-field-group" [class.field-id-locked]="popupMode() !== 'new'">
            <label class="popup-field-label">Divisa 1</label>
            <dx-select-box
              formControlName="cucCur1"
              [dataSource]="currencies()"
              [valueExpr]="'curId'"
              [displayExpr]="'curShodes'"
              [readOnly]="popupMode() !== 'new'"
              labelMode="hidden"
              placeholder="Seleziona...">
              <dx-validator>
                <dxi-validation-rule type="required"></dxi-validation-rule>
              </dx-validator>
            </dx-select-box>
          </div>

          <div class="popup-field-group" [class.field-id-locked]="popupMode() !== 'new'">
            <label class="popup-field-label">Divisa 2</label>
            <dx-select-box
              formControlName="cucCur2"
              [dataSource]="currencies()"
              [valueExpr]="'curId'"
              [displayExpr]="'curShodes'"
              [readOnly]="popupMode() !== 'new'"
              labelMode="hidden"
              placeholder="Seleziona...">
              <dx-validator>
                <dxi-validation-rule type="required"></dxi-validation-rule>
              </dx-validator>
            </dx-select-box>
          </div>

        </div>

        <div class="popup-section-sep"></div>

        <div class="popup-fields-grid popup-fields-grid--3col">

          <div class="popup-field-group popup-col-span-2">
            <label class="popup-field-label">Descrizione</label>
            <dx-text-box
              formControlName="cucLondes"
              [readOnly]="popupMode() === 'view'"
              labelMode="hidden"
              placeholder="Es. Franco Svizzero / Euro">
              <dx-validator>
                <dxi-validation-rule type="required"></dxi-validation-rule>
              </dx-validator>
            </dx-text-box>
          </div>

          <div class="popup-field-group">
            <label class="popup-field-label">Des. Abbreviata</label>
            <dx-text-box
              formControlName="cucShodes"
              [readOnly]="popupMode() === 'view'"
              labelMode="hidden"
              placeholder="Es. CHF/EUR">
              <dx-validator>
                <dxi-validation-rule type="required"></dxi-validation-rule>
              </dx-validator>
            </dx-text-box>
          </div>

          <div class="popup-field-group">
            <label class="popup-field-label">Taglio</label>
            <dx-select-box
              formControlName="cucSize"
              [dataSource]="taglioOptions"
              [readOnly]="popupMode() === 'view'"
              labelMode="hidden">
              <dx-validator>
                <dxi-validation-rule type="required"></dxi-validation-rule>
              </dx-validator>
            </dx-select-box>
          </div>

        </div>
      </section>

      <!-- ── Action Bar ── -->
      <div class="popup-action-bar">

        <div class="popup-actions-secondary">
          @if (popupMode() !== 'new') {
            <dx-button
              text="Storico"
              icon="clock"
              stylingMode="outlined"
              class="btn-fin-secondary"
              (onClick)="onTrace()">
            </dx-button>
          }
        </div>

        <div class="popup-actions-primary">
          @if (popupMode() === 'view') {
            <dx-button
              text="Chiudi"
              icon="close"
              stylingMode="outlined"
              class="btn-fin-secondary"
              (onClick)="closePopup()">
            </dx-button>
          }
          @if (popupMode() === 'new') {
            <dx-button
              text="Annulla"
              icon="close"
              stylingMode="outlined"
              class="btn-fin-secondary"
              (onClick)="closePopup()">
            </dx-button>
            <dx-button
              text="Aggiungi"
              icon="plus"
              stylingMode="contained"
              class="btn-fin-primary action-shadow"
              (onClick)="onInsert()">
            </dx-button>
          }
          @if (popupMode() === 'edit') {
            <dx-button
              text="Annulla"
              icon="close"
              stylingMode="outlined"
              class="btn-fin-secondary"
              (onClick)="closePopup()">
            </dx-button>
            <dx-button
              text="Salva"
              icon="save"
              stylingMode="contained"
              class="btn-fin-primary action-shadow"
              (onClick)="onUpdate()">
            </dx-button>
          }
        </div>

      </div>

    </form>
  </div>
</dx-popup>
