<app-sempione-page-shell title="Coppie Divise">

  <app-sempione-card>

    <app-sempione-card-header title="Elenco Coppie">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
    </app-sempione-card-header>

    <app-sempione-search-mode mode="header" newText="Nuova Coppia" (reset)="clearGridFilters()" (add)="openNewPopup()">
    </app-sempione-search-mode>

    <app-sempione-data-grid
      [dataSource]="coppie()"
      [columns]="gridColumns"
      [keyExpr]="['cucCur1', 'cucCur2']"
      [pageSize]="20"
      [allowedPageSizes]="[20, 50, 100]"
      [isLoading]="isLoading()"
      [showHeaderFilter]="true"
      [showViewAction]="true"
      [showEditAction]="true"
      [showTraceAction]="true"
      [showDeleteAction]="true"
      noDataText="Nessuna coppia divise trovata."
      (rowView)="onTableAction('view', $event)"
      (rowEdit)="onTableAction('edit', $event)"
      (rowTrace)="onTableAction('trace', $event)"
      (rowDelete)="onTableAction('delete', $event)"
      (rowDblClick)="onTableAction('view', $event)">
    </app-sempione-data-grid>

  </app-sempione-card>

</app-sempione-page-shell>

<!-- ── Popup Dettaglio Coppia Divise ── -->
<app-sempione-popup
  [(visible)]="isDetailPopupVisible"
  [title]="popupMode() === 'edit' ? 'Modifica Coppia — ' + selectedLabel()
         : popupMode() === 'view' ? 'Dettaglio Coppia — ' + selectedLabel()
         : 'Nuova Coppia Divise'"
  [maxWidth]="680"
  (hidden)="closePopup()">

  <form [formGroup]="coppiaForm" class="popup-layout">

    <app-sempione-popup-card title="Coppia di Divise">
      <div class="popup-fields-grid popup-fields-grid--2col">

        <app-sempione-field-group label="Divisa 1" [required]="true" [locked]="popupMode() !== 'new'">
          <dx-select-box
            formControlName="cucCur1"
            [dataSource]="currencies()"
            [valueExpr]="'curId'"
            [displayExpr]="'curShodes'"
            [readOnly]="popupMode() !== 'new'"
            labelMode="hidden"
            placeholder="Seleziona...">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
            </dx-validator>
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Divisa 2" [required]="true" [locked]="popupMode() !== 'new'">
          <dx-select-box
            formControlName="cucCur2"
            [dataSource]="currencies()"
            [valueExpr]="'curId'"
            [displayExpr]="'curShodes'"
            [readOnly]="popupMode() !== 'new'"
            labelMode="hidden"
            placeholder="Seleziona...">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
            </dx-validator>
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Descrizione" [required]="true" class="popup-col-span-2">
          <dx-text-box
            formControlName="cucLondes"
            [readOnly]="popupMode() === 'view'"
            labelMode="hidden"
            placeholder="Es. Franco Svizzero / Euro">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Des. Abbreviata" [required]="true">
          <dx-text-box
            formControlName="cucShodes"
            [readOnly]="popupMode() === 'view'"
            labelMode="hidden"
            placeholder="Es. CHF/EUR">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Taglio" [required]="true">
          <dx-select-box
            formControlName="cucSize"
            [dataSource]="taglioOptions"
            [readOnly]="popupMode() === 'view'"
            labelMode="hidden">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
            </dx-validator>
          </dx-select-box>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      cancelText="Chiudi"
      [saveText]="popupMode() === 'new' ? 'Aggiungi' : 'Salva'"
      [showSave]="popupMode() !== 'view'"
      [showStorico]="popupMode() !== 'new'"
      (save)="popupMode() === 'new' ? onInsert() : onUpdate()"
      (cancel)="closePopup()"
      (storico)="onTrace()">
    </app-sempione-popup-action-bar>

  </form>

</app-sempione-popup>

<!-- ── Popup Conferma Eliminazione ── -->
<app-sempione-confirm-delete
  [(visible)]="isConfirmDeleteVisible"
  entityLabel="la coppia"
  [entityName]="pendingDeleteData() ? pendingDeleteData()!.cucCur1 + '/' + pendingDeleteData()!.cucCur2 : ''"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()">
</app-sempione-confirm-delete>
