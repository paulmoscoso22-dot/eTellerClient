<app-sempione-page-header title="Spread"></app-sempione-page-header>

<div class="page-shell">

  <app-sempione-card>

    <app-sempione-card-header title="Elenco Spread">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
      </svg>
    </app-sempione-card-header>

    <app-sempione-toolbar>

      <div class="toolbar-field">
        <dx-text-box
          placeholder="Divisa..."
          [showClearButton]="true"
          labelMode="hidden"
          valueChangeEvent="input"
          [value]="filterCur()"
          (onValueChanged)="filterCur.set($event.value)">
        </dx-text-box>
      </div>

      <div class="toolbar-field">
        <dx-text-box
          placeholder="Tipo..."
          [showClearButton]="true"
          labelMode="hidden"
          valueChangeEvent="input"
          [value]="filterTipo()"
          (onValueChanged)="filterTipo.set($event.value)">
        </dx-text-box>
      </div>

      <app-sempione-crud-toolbar-actions
        [showSearch]="false"
        newText="Nuovo Spread"
        (reset)="onResetFiltri()"
        (add)="openNewPopup()">
      </app-sempione-crud-toolbar-actions>

    </app-sempione-toolbar>

    <app-sempione-data-grid
      [dataSource]="filteredSpread()"
      [columns]="gridColumns"
      [keyExpr]="['sprCurId', 'sprType']"
      [isLoading]="isLoading()"
      [pageSize]="20"
      [allowedPageSizes]="[20, 50, 100]"
      noDataText="Nessuno spread trovato."
      [showViewAction]="true"
      [showEditAction]="true"
      [showDeleteAction]="true"
      (rowView)="onTableAction('view', $event)"
      (rowEdit)="onTableAction('edit', $event)"
      (rowDelete)="onTableAction('delete', $event)">
    </app-sempione-data-grid>

  </app-sempione-card>

</div>

<!-- ── Popup Spread ── -->
<app-sempione-popup
  [(visible)]="isPopupVisible"
  [title]="popupMode() === 'new' ? 'Nuovo Spread'
         : popupMode() === 'edit' ? 'Modifica Spread — ' + selectedLabel()
         : 'Dettaglio Spread — ' + selectedLabel()"
  [maxWidth]="640"
  (hidden)="closePopup()">

  <form [formGroup]="spreadForm" class="popup-layout">

    <app-sempione-popup-card title="Identificazione">
      <div class="popup-fields-grid popup-fields-grid--2col">

        <app-sempione-field-group label="Divisa" [locked]="popupMode() !== 'new'">
          <dx-text-box
            formControlName="sprCurId"
            [readOnly]="popupMode() !== 'new'"
            labelMode="hidden"
            placeholder="Es. EUR">
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Tipo" [locked]="popupMode() !== 'new'">
          <dx-text-box
            formControlName="sprType"
            [readOnly]="popupMode() !== 'new'"
            labelMode="hidden"
            placeholder="Es. SPT1">
          </dx-text-box>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-card title="Valori">
      <div class="popup-fields-grid popup-fields-grid--2col">

        <app-sempione-field-group label="Valore Spread">
          <dx-number-box
            formControlName="sprValue"
            [format]="'#,##0.0000'"
            [readOnly]="popupMode() === 'view'"
            labelMode="hidden">
          </dx-number-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Valido Dal">
          <dx-date-box
            formControlName="sprDatini"
            [readOnly]="popupMode() === 'view'"
            labelMode="hidden"
            displayFormat="dd/MM/yyyy"
            type="date">
          </dx-date-box>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      cancelText="Chiudi"
      [saveText]="popupMode() === 'new' ? 'Aggiungi' : 'Salva'"
      [showSave]="popupMode() !== 'view'"
      (save)="onSave()"
      (cancel)="closePopup()">
    </app-sempione-popup-action-bar>

  </form>

</app-sempione-popup>

<!-- ── Popup Conferma Eliminazione ── -->
<app-sempione-confirm-delete
  [(visible)]="isConfirmDeleteVisible"
  entityLabel="lo spread"
  [entityName]="pendingDeleteData() ? pendingDeleteData()!.sprCurId + ' ' + pendingDeleteData()!.sprType : ''"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()">
</app-sempione-confirm-delete>
