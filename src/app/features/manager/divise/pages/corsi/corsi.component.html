<div class="page-shell">

  <app-sempione-page-header title="Corsi di Cambio"></app-sempione-page-header>

  <app-sempione-card>

    <app-sempione-card-header title="Corsi di Cambio">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="1" x2="12" y2="23"></line>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
      </svg>
    </app-sempione-card-header>

    <app-sempione-toolbar>

      <div class="toolbar-field">
        <dx-text-box
          placeholder="Divisa..."
          [showClearButton]="true"
          labelMode="hidden"
          valueChangeEvent="input"
          [value]="filterCodice()"
          (onValueChanged)="filterCodice.set($event.value)">
        </dx-text-box>
      </div>

      <div class="toolbar-field toolbar-field--lg">
        <dx-text-box
          placeholder="Descrizione..."
          [showClearButton]="true"
          labelMode="hidden"
          valueChangeEvent="input"
          [value]="filterDescrizione()"
          (onValueChanged)="filterDescrizione.set($event.value)">
        </dx-text-box>
      </div>

      <div class="toolbar-field">
        <dx-select-box
          [dataSource]="tipoOptions"
          displayExpr="des"
          valueExpr="id"
          labelMode="hidden"
          [value]="filterTipo()"
          (onValueChanged)="filterTipo.set($event.value)"
          [width]="160">
        </dx-select-box>
      </div>

      <div class="toolbar-field">
        <dx-date-box
          [value]="filterDateDal()"
          (onValueChanged)="filterDateDal.set($event.value)"
          displayFormat="dd.MM.yyyy"
          labelMode="hidden"
          [showClearButton]="true"
          [width]="130">
        </dx-date-box>
      </div>

      <div class="toolbar-field">
        <dx-date-box
          [value]="filterDateAl()"
          (onValueChanged)="filterDateAl.set($event.value)"
          displayFormat="dd.MM.yyyy"
          labelMode="hidden"
          [showClearButton]="true"
          [width]="130">
        </dx-date-box>
      </div>

      <app-sempione-crud-toolbar-actions
        [showSearch]="true"
        newText="Nuovo Corso"
        (search)="onCerca()"
        (reset)="onResetFiltri()"
        (add)="openNewPopup()">
      </app-sempione-crud-toolbar-actions>

    </app-sempione-toolbar>

    <div class="toolbar-meta">
      <span class="last-update-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        Ultimo aggiornamento: {{ lastUpdate() }}
      </span>
    </div>

    <app-sempione-data-grid
      [dataSource]="filteredCorsi()"
      [columns]="gridColumns"
      [keyExpr]="['cprCurId1', 'cprCurId2', 'cprCutId', 'cprValdat']"
      [pageSize]="20"
      [allowedPageSizes]="[20, 50, 100]"
      [isLoading]="isLoading()"
      [showViewAction]="true"
      [showEditAction]="true"
      [showDeleteAction]="true"
      noDataText="Nessun corso trovato."
      (rowView)="onTableAction('view', $event)"
      (rowEdit)="onTableAction('edit', $event)"
      (rowDelete)="onTableAction('delete', $event)">
    </app-sempione-data-grid>

  </app-sempione-card>

</div>

<!-- ── Popup Dettaglio Corso ── -->
<app-sempione-popup
  [(visible)]="isDetailPopupVisible"
  [title]="popupMode() === 'edit' ? 'Modifica Corso — ' + selectedLabel()
         : popupMode() === 'view' ? 'Dettaglio Corso — ' + selectedLabel()
         : 'Nuovo Corso'"
  [maxWidth]="860"
  (hidden)="closePopup()">

  <form [formGroup]="corsoForm" class="popup-layout">

    <app-sempione-popup-card title="Identificazione">
      <div class="popup-fields-grid popup-fields-grid--4col">

        <app-sempione-field-group label="Divisa CTP" [required]="true" [locked]="popupMode() !== 'new'">
          <dx-select-box
            formControlName="cprCurId1"
            [dataSource]="currencies"
            [readOnly]="popupMode() !== 'new'"
            labelMode="hidden"
            placeholder="Seleziona...">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
            </dx-validator>
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Divisa BASE" [required]="true" [locked]="popupMode() !== 'new'">
          <dx-select-box
            formControlName="cprCurId2"
            [dataSource]="currencies"
            [readOnly]="popupMode() !== 'new'"
            labelMode="hidden"
            placeholder="Seleziona...">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
            </dx-validator>
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Tipo" [required]="true" [locked]="popupMode() !== 'new'">
          <dx-select-box
            formControlName="cprCutId"
            [dataSource]="tipoOptions"
            displayExpr="des"
            valueExpr="id"
            [readOnly]="popupMode() !== 'new'"
            labelMode="hidden"
            placeholder="Seleziona...">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
            </dx-validator>
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Data Valuta" [required]="true" [locked]="popupMode() !== 'new'">
          <dx-date-box
            formControlName="cprValdat"
            displayFormat="dd.MM.yyyy HH:mm:ss"
            type="datetime"
            [readOnly]="popupMode() !== 'new'"
            labelMode="hidden">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
            </dx-validator>
          </dx-date-box>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-card title="Tassi di Cambio">
      <div class="popup-fields-grid popup-fields-grid--3col">

        <app-sempione-field-group label="Cambio BUY" [required]="true">
          <dx-number-box
            formControlName="cprRateBuy"
            [min]="0"
            [format]="'#,##0.0000'"
            [readOnly]="popupMode() === 'view'"
            labelMode="hidden">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
            </dx-validator>
          </dx-number-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Cambio SELL" [required]="true">
          <dx-number-box
            formControlName="cprRateSell"
            [min]="0"
            [format]="'#,##0.0000'"
            [readOnly]="popupMode() === 'view'"
            labelMode="hidden">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
            </dx-validator>
          </dx-number-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Codice HOST">
          <dx-text-box
            formControlName="curHostcod"
            [readOnly]="popupMode() === 'view'"
            labelMode="hidden">
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Descrizione" [locked]="true" class="popup-col-span-3">
          <dx-text-box formControlName="curLondes" [readOnly]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Data Registrazione" [locked]="true">
          <dx-text-box formControlName="cprDatreg" [readOnly]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Data Modifica" [locked]="true">
          <dx-text-box formControlName="curModdat" [readOnly]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      [cancelText]="'Chiudi'"
      [saveText]="popupMode() === 'new' ? 'Aggiungi' : 'Salva'"
      [showSave]="popupMode() !== 'view'"
      [showStorico]="false"
      (save)="popupMode() === 'new' ? onSubmit() : onUpdate()"
      (cancel)="closePopup()">
    </app-sempione-popup-action-bar>

  </form>

</app-sempione-popup>
