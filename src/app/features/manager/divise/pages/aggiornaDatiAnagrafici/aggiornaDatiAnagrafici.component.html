<div class="page-shell">

  <app-sempione-page-header title="Aggiorna Dati Anagrafici Divise"></app-sempione-page-header>

  <app-sempione-card>

    <app-sempione-card-header title="Aggiorna Dati Anagrafici">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M3.05 11a9 9 0 1 1 .5 4"></path>
        <polyline points="3 16 3 11 8 11"></polyline>
      </svg>
    </app-sempione-card-header>

    <app-sempione-toolbar>

      <div class="toolbar-field">
        <dx-text-box
          placeholder="Divisa..."
          [showClearButton]="true"
          labelMode="hidden"
          valueChangeEvent="input"
          [value]="filterCodice()"
          (onValueChanged)="filterCodice.set($event.value)">
        </dx-text-box>
      </div>

      <div class="toolbar-field toolbar-field--lg">
        <dx-text-box
          placeholder="Descrizione..."
          [showClearButton]="true"
          labelMode="hidden"
          valueChangeEvent="input"
          [value]="filterDescrizione()"
          (onValueChanged)="filterDescrizione.set($event.value)">
        </dx-text-box>
      </div>

      <app-sempione-crud-toolbar-actions
        [showSearch]="false"
        [showAdd]="false"
        (reset)="onResetFiltri()">
      </app-sempione-crud-toolbar-actions>

    </app-sempione-toolbar>

    <app-sempione-data-grid
      [dataSource]="filteredDivise()"
      [columns]="gridColumns"
      [keyExpr]="['curId', 'curCutId']"
      [pageSize]="20"
      [allowedPageSizes]="[20, 50, 100]"
      [isLoading]="isLoading()"
      [showViewAction]="true"
      [showEditAction]="true"
      [showTraceAction]="true"
      noDataText="Nessuna divisa trovata."
      (rowView)="onTableAction('view', $event)"
      (rowEdit)="onTableAction('edit', $event)"
      (rowTrace)="onTableAction('trace', $event)">
    </app-sempione-data-grid>

  </app-sempione-card>

</div>

<!-- ── Popup Dettaglio Divisa ── -->
<app-sempione-popup
  [(visible)]="isDetailPopupVisible"
  [title]="popupMode() === 'edit' ? 'Modifica Dati Anagrafici — ' + selectedLabel()
                                  : 'Dettaglio Dati Anagrafici — ' + selectedLabel()"
  [maxWidth]="780"
  (hidden)="closePopup()">

  <form [formGroup]="divisaForm" class="popup-layout">

    <app-sempione-popup-card title="Identificazione">
      <div class="popup-fields-grid popup-fields-grid--3col">

        <app-sempione-field-group label="Divisa" [locked]="true">
          <dx-text-box formControlName="curId" [readOnly]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Tipo Divisa" [locked]="true">
          <dx-text-box formControlName="curCutId" [readOnly]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Des. Abbreviata" [locked]="true">
          <dx-text-box formControlName="curShodes" [readOnly]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Descrizione" [locked]="true" class="popup-col-span-3">
          <dx-text-box formControlName="curLondes" [readOnly]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-card title="Dati Anagrafici">
      <div class="popup-fields-grid popup-fields-grid--3col">

        <app-sempione-field-group label="Taglio Minimo" [required]="true">
          <dx-number-box
            formControlName="curMinamn"
            [min]="0"
            [max]="10000000"
            [format]="'#,##0.##'"
            [readOnly]="popupMode() === 'view'"
            labelMode="hidden">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
              <dxi-validation-rule type="range" [min]="0" [max]="10000000" message="Valore tra 0 e 10.000.000"></dxi-validation-rule>
            </dx-validator>
          </dx-number-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="% Tolleranza" [required]="true">
          <dx-number-box
            formControlName="curTolrat"
            [min]="0"
            [max]="1000000"
            [format]="'#,##0.####'"
            [readOnly]="popupMode() === 'view'"
            labelMode="hidden">
            <dx-validator>
              <dxi-validation-rule type="required"></dxi-validation-rule>
              <dxi-validation-rule type="range" [min]="0" [max]="1000000" message="Valore tra 0 e 1.000.000"></dxi-validation-rule>
            </dx-validator>
          </dx-number-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Finezza">
          <dx-text-box
            formControlName="curFinezza"
            [readOnly]="popupMode() === 'view'"
            placeholder="Es. 999.9"
            labelMode="hidden">
          </dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Data Modifica" [locked]="true">
          <dx-text-box formControlName="curModdat" [readOnly]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      [cancelText]="'Chiudi'"
      [saveText]="'Salva'"
      [showSave]="popupMode() === 'edit'"
      [showStorico]="true"
      (save)="onUpdate()"
      (cancel)="closePopup()"
      (storico)="onTrace()">
    </app-sempione-popup-action-bar>

  </form>

</app-sempione-popup>
