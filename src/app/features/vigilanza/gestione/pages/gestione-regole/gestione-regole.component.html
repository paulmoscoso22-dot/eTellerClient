<app-sempione-page-header title="Gestione Regole Antiriciclaggio"></app-sempione-page-header>

<div class="page-shell">

  <app-sempione-card>
    <app-sempione-card-header title="Regole Antiriciclaggio">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </app-sempione-card-header>

    <div [formGroup]="filterForm">
      <app-sempione-toolbar>

        <div class="toolbar-field">
          <dx-select-box
            formControlName="arlOpTypeId"
            [dataSource]="operationTypes()"
            displayExpr="optDes"
            valueExpr="optId"
            [showClearButton]="true"
            [searchEnabled]="true"
            placeholder="Tipo operazione..."
            labelMode="hidden">
          </dx-select-box>
        </div>

        <div class="toolbar-field">
          <dx-select-box
            formControlName="arlCurTypeId"
            [dataSource]="currencyTypes()"
            displayExpr="cutDes"
            valueExpr="cutId"
            [showClearButton]="true"
            [searchEnabled]="true"
            placeholder="Tipo divisa..."
            labelMode="hidden">
          </dx-select-box>
        </div>

        <div class="toolbar-field">
          <dx-text-box
            formControlName="arlAcctId"
            [showClearButton]="true"
            placeholder="Conto..."
            labelMode="hidden">
          </dx-text-box>
        </div>

        <div class="toolbar-field">
          <dx-text-box
            formControlName="arlAcctType"
            [showClearButton]="true"
            placeholder="Tipo conto..."
            labelMode="hidden">
          </dx-text-box>
        </div>

        <div toolbar-actions>
          <app-sempione-button
            icon="search"
            hint="Cerca"
            variant="secondary"
            [disabled]="isLoading()"
            (clicked)="search()">
          </app-sempione-button>
          <app-sempione-button
            icon="revert"
            hint="Mostra tutti"
            variant="secondary"
            (clicked)="resetFilters()">
          </app-sempione-button>
          <app-sempione-button
            icon="add"
            text="Aggiungi"
            variant="primary"
            (clicked)="openAddPopup()">
          </app-sempione-button>
        </div>

      </app-sempione-toolbar>
    </div>

    <app-sempione-data-grid
      [dataSource]="rules()"
      [keyExpr]="'arlId'"
      [columns]="columns"
      [isLoading]="isLoading()"
      [error]="error()"
      [pageSize]="30"
      [allowedPageSizes]="[20, 30, 50, 100]"
      [showViewAction]="true"
      [showEditAction]="true"
      [showTraceAction]="true"
      [showDeleteAction]="true"
      emptyStateText="Nessuna regola trovata. Impostare i filtri e premere Cerca."
      emptyStateIcon="shield"
      (rowView)="openTracePopup($event)"
      (rowEdit)="openEditPopup($event)"
      (rowTrace)="openHistoryPopup($event)"
      (rowDelete)="openDeletePopup($event)">
    </app-sempione-data-grid>

  </app-sempione-card>

</div>

<!-- ══ Popup Aggiungi / Modifica / Visualizza ══ -->
<app-sempione-popup
  [(visible)]="isFormPopupVisible"
  [title]="
    isViewMode() ? ('Dettaglio Regola — ID ' + selectedArlId()) :
    isEditMode() ? ('Modifica Regola — ID ' + selectedArlId()) :
    'Nuova Regola Antiriciclaggio'
  "
  [maxWidth]="720"
  (hidden)="closeFormPopup()">

  @if (isLoadingForm()) {
    <div class="popup-loading">
      <svg class="spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
      </svg>
      Caricamento...
    </div>
  }

  @if (!isLoadingForm()) {
    <div class="popup-layout" [formGroup]="editForm">

      <app-sempione-popup-card title="Dettaglio Regola">
        <div class="popup-fields-grid popup-fields-grid--2col">

          <app-sempione-field-group label="Tipo operazione" [required]="true">
            <dx-select-box
              formControlName="arlOpTypeId"
              [dataSource]="operationTypes()"
              displayExpr="optDes"
              valueExpr="optId"
              [showClearButton]="true"
              [searchEnabled]="true"
              [readOnly]="isViewMode()"
              placeholder="Selezionare..."
              labelMode="hidden">
            </dx-select-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="Tipo divisa" [required]="true">
            <dx-select-box
              formControlName="arlCurTypeId"
              [dataSource]="currencyTypes()"
              displayExpr="cutDes"
              valueExpr="cutId"
              [showClearButton]="true"
              [searchEnabled]="true"
              [readOnly]="isViewMode()"
              placeholder="Selezionare..."
              labelMode="hidden">
            </dx-select-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="Inizio validità" [required]="true">
            <dx-date-box
              formControlName="arlValStart"
              type="date"
              displayFormat="dd.MM.yyyy"
              [showClearButton]="true"
              [readOnly]="isViewMode()"
              labelMode="hidden">
            </dx-date-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="Fine validità" [required]="true">
            <dx-date-box
              formControlName="arlValEnd"
              type="date"
              displayFormat="dd.MM.yyyy"
              [showClearButton]="true"
              [readOnly]="isViewMode()"
              labelMode="hidden">
            </dx-date-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="Conto">
            <dx-text-box
              formControlName="arlAcctId"
              [showClearButton]="true"
              [readOnly]="isViewMode()"
              labelMode="hidden">
            </dx-text-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="Categoria conto">
            <dx-text-box
              formControlName="arlAcctType"
              [showClearButton]="true"
              [readOnly]="isViewMode()"
              labelMode="hidden">
            </dx-text-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="Limite vigilanza" [required]="true">
            <dx-number-box
              formControlName="arlLimit"
              [min]="0"
              [showClearButton]="true"
              [readOnly]="isViewMode()"
              labelMode="hidden">
            </dx-number-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="Opzioni">
            <div class="checkbox-stack">
              <dx-check-box
                formControlName="arlIsinternal"
                text="Regola interna"
                [readOnly]="isViewMode()">
              </dx-check-box>
              <dx-check-box
                formControlName="arlExclude"
                text="Escludi regola"
                [readOnly]="isViewMode()">
              </dx-check-box>
            </div>
          </app-sempione-field-group>

        </div>

        @if (saveError()) {
          <div class="save-error-msg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            {{ saveError() }}
          </div>
        }
      </app-sempione-popup-card>

      <app-sempione-popup-action-bar
        saveText="Salva"
        cancelText="Annulla"
        [showSave]="!isViewMode()"
        [isSaving]="isSaving()"
        (save)="save()"
        (cancel)="closeFormPopup()">
      </app-sempione-popup-action-bar>

    </div>
  }

</app-sempione-popup>

<!-- ══ Popup Storico ══ -->
<app-sempione-popup
  [(visible)]="isHistoryPopupVisible"
  [title]="'Storico Regola — ID ' + historyArlId()"
  [maxWidth]="960"
  [maxHeight]="'85vh'"
  (hidden)="closeHistoryPopup()">

  <div class="popup-layout">
    <app-sempione-popup-card title="Storico modifiche">
      <app-sempione-data-grid
        [dataSource]="historyItems()"
        [columns]="historyColumns"
        [isLoading]="isLoadingHistory()"
        [pageSize]="15"
        [allowedPageSizes]="[15, 30, 50]"
        [showEditAction]="false"
        noDataText="Nessuna voce di storico disponibile.">
      </app-sempione-data-grid>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      cancelText="Chiudi"
      [showSave]="false"
      (cancel)="closeHistoryPopup()">
    </app-sempione-popup-action-bar>
  </div>

</app-sempione-popup>
