<app-sempione-page-header title="Gestione Regole Vigilanza"></app-sempione-page-header>

<app-sempione-card>
  <app-sempione-card-header title="Regole Vigilanza Antiriciclaggio">
    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
    </svg>
  </app-sempione-card-header>

  <div [formGroup]="filterForm">
    <app-sempione-toolbar>
      <div class="toolbar-field">
        <dx-select-box
          formControlName="arlOpTypeId"
          [dataSource]="operationTypes()"
          displayExpr="optDes"
          valueExpr="optId"
          [showClearButton]="true"
          placeholder="Tipo operazione..."
          labelMode="hidden">
        </dx-select-box>
      </div>

      <div class="toolbar-field">
        <dx-select-box
          formControlName="arlCurTypeId"
          [dataSource]="currencyTypes()"
          displayExpr="cutDes"
          valueExpr="cutId"
          [showClearButton]="true"
          placeholder="Tipo divisa..."
          labelMode="hidden">
        </dx-select-box>
      </div>

      <app-sempione-crud-toolbar-actions
        [showAll]="true"
        [isLoading]="isLoading()"
        (search)="search()"
        (reset)="resetFilters()"
        (listAll)="showAll()"
        (add)="openAddPopup()">
      </app-sempione-crud-toolbar-actions>
    </app-sempione-toolbar>
  </div>

  <app-sempione-data-grid
    [dataSource]="rules()"
    [keyExpr]="'arlId'"
    [columns]="columns"
    [isLoading]="isLoading()"
    [error]="error()"
    [pageSize]="30"
    [allowedPageSizes]="[20, 30, 50, 100]"
    [showEditAction]="true"
    [showTraceAction]="true"
    emptyStateText="Nessuna regola trovata. Impostare i filtri e premere Cerca, oppure Mostra tutti per visualizzare tutte le regole."
    emptyStateIcon="shield"
    (rowEdit)="openEditPopup($event)"
    (rowTrace)="openHistoryPopup($event)">
  </app-sempione-data-grid>
</app-sempione-card>

<!-- ══ Popup Aggiungi / Modifica ══ -->
<app-sempione-popup
  [(visible)]="isFormPopupVisible"
  [title]="isEditMode() ? ('Modifica Regola — ID ' + selectedRuleId()) : 'Nuova Regola'"
  [maxWidth]="720"
  (hidden)="closeFormPopup()">

  <div class="popup-layout" [formGroup]="editForm">

    <app-sempione-popup-card title="Classificazione">
      <div class="popup-fields-grid popup-fields-grid--2col">

        <app-sempione-field-group label="Tipo operazione" [required]="true">
          <dx-select-box
            formControlName="arlOpTypeId"
            [dataSource]="operationTypes()"
            displayExpr="optDes"
            valueExpr="optId"
            [showClearButton]="false"
            placeholder="Selezionare..."
            labelMode="hidden">
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Tipo divisa" [required]="true">
          <dx-select-box
            formControlName="arlCurTypeId"
            [dataSource]="currencyTypes()"
            displayExpr="cutDes"
            valueExpr="cutId"
            [showClearButton]="false"
            placeholder="Selezionare..."
            labelMode="hidden">
          </dx-select-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Inizio validità" [required]="true">
          <dx-date-box
            formControlName="arlValStart"
            type="date"
            displayFormat="dd.MM.yyyy"
            [showClearButton]="false"
            labelMode="hidden">
          </dx-date-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Fine validità" [required]="true">
          <dx-date-box
            formControlName="arlValEnd"
            type="date"
            displayFormat="dd.MM.yyyy"
            [showClearButton]="false"
            labelMode="hidden">
          </dx-date-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Conto">
          <dx-text-box formControlName="arlAcctId" [maxLength]="10" [showClearButton]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Categoria conto">
          <dx-text-box formControlName="arlAcctType" [showClearButton]="true" labelMode="hidden"></dx-text-box>
        </app-sempione-field-group>

      </div>
    </app-sempione-popup-card>

    <app-sempione-popup-card title="Limite e opzioni">
      <div class="popup-fields-grid popup-fields-grid--2col">

        <app-sempione-field-group label="Limite vigilanza (CHF)" [required]="true">
          <dx-number-box
            formControlName="arlLimit"
            [min]="0"
            [max]="999999999999"
            format="#,##0.##"
            [showClearButton]="false"
            labelMode="hidden">
          </dx-number-box>
        </app-sempione-field-group>

        <app-sempione-field-group label="Opzioni">
          <div class="checkbox-stack">
            <dx-check-box formControlName="arlIsinternal" text="Regola interna"></dx-check-box>
            <dx-check-box formControlName="arlExclude"   text="Escludi regola"></dx-check-box>
          </div>
        </app-sempione-field-group>

      </div>

      @if (saveError()) {
        <div class="save-error-msg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          {{ saveError() }}
        </div>
      }
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      saveText="Salva"
      cancelText="Annulla"
      [isSaving]="isSaving()"
      (save)="save()"
      (cancel)="closeFormPopup()">
    </app-sempione-popup-action-bar>

  </div>
</app-sempione-popup>

<!-- ══ Popup Storico ══ -->
<app-sempione-popup
  [(visible)]="isHistoryPopupVisible"
  [title]="'Storico Regola — ID ' + historyRuleId()"
  [maxWidth]="960"
  [maxHeight]="'85vh'"
  (hidden)="closeHistoryPopup()">

  <div class="popup-layout">
    <app-sempione-popup-card title="Storico modifiche">
      <app-sempione-data-grid
        [dataSource]="historyRules()"
        [columns]="historyColumns"
        [isLoading]="isLoadingHistory()"
        [pageSize]="15"
        [allowedPageSizes]="[15, 30, 50]"
        [showEditAction]="false"
        noDataText="Nessuna voce di storico disponibile.">
      </app-sempione-data-grid>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      cancelText="Chiudi"
      [showSave]="false"
      (cancel)="closeHistoryPopup()">
    </app-sempione-popup-action-bar>
  </div>
</app-sempione-popup>
