<app-sempione-page-header title="Gestione Comparenti ADE"></app-sempione-page-header>

<app-sempione-card>
  <app-sempione-card-header title="Gestione Comparenti ADE">
    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
      <circle cx="9" cy="7" r="4"></circle>
      <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
    </svg>
  </app-sempione-card-header>

  <div [formGroup]="filterForm">
    <app-sempione-toolbar>
      <dx-text-box
        formControlName="araName"
        [showClearButton]="true"
        placeholder="Nome e cognome..."
        labelMode="hidden">
      </dx-text-box>

      <div class="toolbar-field">
        <dx-date-box
          formControlName="araBirthdate"
          type="date"
          displayFormat="dd.MM.yyyy"
          [showClearButton]="true"
          placeholder="Data nascita..."
          labelMode="hidden">
        </dx-date-box>
      </div>

      <div toolbar-actions>
        <dx-button
          icon="search"
          hint="Cerca"
          stylingMode="outlined"
          class="btn-fin-secondary"
          [disabled]="isLoading()"
          (onClick)="search()">
        </dx-button>
        <dx-button
          icon="revert"
          hint="Ripristina filtri"
          stylingMode="outlined"
          class="btn-fin-secondary"
          (onClick)="resetFilters()">
        </dx-button>
        <span class="toolbar-sep" toolbar-actions></span>
        <dx-button
          icon="add"
          text="Aggiungi"
          stylingMode="contained"
          class="btn-fin-primary"
          (onClick)="openAddPopup()">
        </dx-button>
      </div>
    </app-sempione-toolbar>
  </div>

  <app-sempione-data-grid
    [dataSource]="appearers()"
    [keyExpr]="'araId'"
    [columns]="columns"
    [isLoading]="isLoading()"
    [error]="error()"
    [pageSize]="30"
    [allowedPageSizes]="[20, 30, 50, 100]"
    [showEditAction]="true"
    [showTraceAction]="true"
    emptyStateText="Nessun comparente trovato. Inserire i criteri di ricerca e premere Cerca."
    emptyStateIcon="user"
    (rowEdit)="openEditPopup($event)"
    (rowTrace)="openHistoryPopup($event)">
  </app-sempione-data-grid>
</app-sempione-card>

<!-- ══ Popup Aggiungi / Modifica ══ -->
<app-sempione-popup
  [(visible)]="isFormPopupVisible"
  [title]="isEditMode() ? ('Modifica Comparente — ID ' + selectedAraId()) : 'Nuovo Comparente'"
  [maxWidth]="760"
  (hidden)="closeFormPopup()">

  @if (isLoadingForm()) {
    <div class="popup-loading">
      <dx-load-indicator [visible]="true"></dx-load-indicator>
      <span>Caricamento...</span>
    </div>
  }

  @if (!isLoadingForm()) {
    <div class="popup-layout" [formGroup]="editForm">

      <app-sempione-popup-card title="Anagrafica">
        <div class="popup-fields-grid popup-fields-grid--2col">

          <div class="popup-col-span-2">
            <app-sempione-field-group label="Nome e cognome" [required]="true">
              <dx-text-box formControlName="araName" [showClearButton]="true" labelMode="hidden"></dx-text-box>
            </app-sempione-field-group>
          </div>

          <app-sempione-field-group label="Rappresentanza">
            <dx-text-box formControlName="araRepresents" [showClearButton]="true" labelMode="hidden"></dx-text-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="Domicilio">
            <dx-text-box formControlName="araAddress" [showClearButton]="true" labelMode="hidden"></dx-text-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="Data nascita">
            <dx-date-box formControlName="araBirthdate" type="date" displayFormat="dd.MM.yyyy" [showClearButton]="true" labelMode="hidden"></dx-date-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="Luogo nascita">
            <dx-text-box formControlName="araBirthplace" [showClearButton]="true" labelMode="hidden"></dx-text-box>
          </app-sempione-field-group>

          <div class="popup-col-span-2">
            <app-sempione-field-group label="Nazionalità">
              <dx-select-box
                formControlName="araNationality"
                [dataSource]="countries()"
                displayExpr="ctyShonamIta"
                valueExpr="ctyIntcod"
                [showClearButton]="true"
                [searchEnabled]="true"
                placeholder="Selezionare..."
                labelMode="hidden">
              </dx-select-box>
            </app-sempione-field-group>
          </div>

        </div>
      </app-sempione-popup-card>

      <app-sempione-popup-card title="Documento di identità">
        <div class="popup-fields-grid popup-fields-grid--2col">

          <app-sempione-field-group label="Nr. documento">
            <dx-text-box formControlName="araIddocnum" [showClearButton]="true" labelMode="hidden"></dx-text-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="Scadenza documento">
            <dx-date-box formControlName="araDocexpdate" type="date" displayFormat="dd.MM.yyyy" [showClearButton]="true" labelMode="hidden"></dx-date-box>
          </app-sempione-field-group>

          <app-sempione-field-group label="Opzioni">
            <div class="checkbox-stack">
              <dx-check-box formControlName="araRecComplete" text="Scheda completa"></dx-check-box>
              @if (isEditMode()) {
                <dx-check-box formControlName="araIsupdated" text="Aggiornato"></dx-check-box>
              }
            </div>
          </app-sempione-field-group>

        </div>

        @if (saveError()) {
          <div class="save-error-msg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            {{ saveError() }}
          </div>
        }
      </app-sempione-popup-card>

      <app-sempione-popup-action-bar
        saveText="Salva"
        cancelText="Annulla"
        [isSaving]="isSaving()"
        (save)="save()"
        (cancel)="closeFormPopup()">
      </app-sempione-popup-action-bar>

    </div>
  }
</app-sempione-popup>

<!-- ══ Popup Storico ══ -->
<app-sempione-popup
  [(visible)]="isHistoryPopupVisible"
  [title]="'Storico Comparente — ID ' + historyAraId()"
  [maxWidth]="960"
  [maxHeight]="'85vh'"
  (hidden)="closeHistoryPopup()">

  <div class="popup-layout">
    <app-sempione-popup-card title="Storico modifiche">
      <app-sempione-data-grid
        [dataSource]="historyItems()"
        [columns]="historyColumns"
        [isLoading]="isLoadingHistory()"
        [pageSize]="15"
        [allowedPageSizes]="[15, 30, 50]"
        [showEditAction]="false"
        noDataText="Nessuna voce di storico disponibile.">
      </app-sempione-data-grid>
    </app-sempione-popup-card>

    <app-sempione-popup-action-bar
      cancelText="Chiudi"
      [showSave]="false"
      (cancel)="closeHistoryPopup()">
    </app-sempione-popup-action-bar>
  </div>
</app-sempione-popup>
