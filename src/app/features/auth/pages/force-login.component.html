<app-sempione-popup
  [visible]="visible"
  title="Sessione attiva"
  [maxWidth]="420"
  [dragEnabled]="false"
  [showCloseButton]="false"
  (hidden)="cancelled.emit()">

  <p class="confirm-message">
    Esiste già una sessione attiva per questo account.
    Vuoi continuare e terminare la sessione esistente?
  </p>

  <app-sempione-popup-action-bar
    saveText="Continua"
    cancelText="Annulla"
    saveIcon=""
    (save)="confirmed.emit()"
    (cancel)="cancelled.emit()">
  </app-sempione-popup-action-bar>

</app-sempione-popup>
