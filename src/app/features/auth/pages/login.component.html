<div class="login-container">
  <div class="login-card">
    <h1 class="login-title">eTeller</h1>

    <div class="form-group">
      <label class="form-label">User ID</label>
      <dx-text-box
        [value]="formData().userId"
        (onValueChanged)="updateUserId($event.value)"
        [stylingMode]="'outlined'"
        placeholder="Inserire User ID"
        [disabled]="isLoading()"
      ></dx-text-box>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <dx-text-box
        [value]="formData().password"
        (onValueChanged)="updatePassword($event.value)"
        [stylingMode]="'outlined'"
        mode="password"
        placeholder="Inserire Password"
        [disabled]="isLoading()"
      ></dx-text-box>
    </div>

    <dx-button
      text="Accedi"
      type="default"
      stylingMode="contained"
      [width]="'100%'"
      [disabled]="isLoading()"
      (onClick)="onLogin()"
    ></dx-button>

    @if (isLoading()) {
      <div class="loading-overlay">
        <dx-load-indicator [height]="36" [width]="36"></dx-load-indicator>
      </div>
    }
  </div>
</div>

<app-force-login
  [visible]="showForceLoginPopup()"
  (confirmed)="onConfirmForceLogin()"
  (cancelled)="onCancelForceLogin()"
></app-force-login>
