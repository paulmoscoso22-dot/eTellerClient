<div class="login-container">
  <div class="login-card">

    <h2 class="auth-title">{{ title() }}</h2>

    @if (subtitle()) {
      <p class="auth-subtitle">{{ subtitle() }}</p>
    }

    <div class="form-group">
      <app-sempione-field-group label="Password corrente">
        <dx-text-box
          mode="password"
          [stylingMode]="'outlined'"
          [value]="formData().currentPassword"
          (onValueChanged)="updateCurrentPassword($event.value)"
          [disabled]="isLoading()">
        </dx-text-box>
      </app-sempione-field-group>
    </div>

    <div class="form-group">
      <app-sempione-field-group label="Nuova password">
        <dx-text-box
          mode="password"
          [stylingMode]="'outlined'"
          [value]="formData().newPassword"
          (onValueChanged)="updateNewPassword($event.value)"
          [disabled]="isLoading()">
        </dx-text-box>
      </app-sempione-field-group>
    </div>

    <div class="form-group">
      <app-sempione-field-group label="Conferma password">
        <dx-text-box
          mode="password"
          [stylingMode]="'outlined'"
          [value]="formData().confirmPassword"
          (onValueChanged)="updateConfirmPassword($event.value)"
          [disabled]="isLoading()">
        </dx-text-box>
      </app-sempione-field-group>
    </div>

    <app-sempione-alert [message]="inlineError()"></app-sempione-alert>

    <dx-button
      text="Salva"
      type="default"
      stylingMode="contained"
      [width]="'100%'"
      [disabled]="isLoading()"
      (onClick)="onSubmit()">
    </dx-button>

    @if (isLoading()) {
      <div class="loading-overlay">
        <dx-load-indicator [height]="36" [width]="36"></dx-load-indicator>
      </div>
    }

  </div>
</div>
