<div class="change-password-container">
  <h2>{{ title() }}</h2>
  @if (subtitle()) {
    <p class="subtitle">{{ subtitle() }}</p>
  }

  <dx-text-box
    label="Password corrente"
    mode="password"
    [value]="formData().currentPassword"
    (onValueChanged)="updateCurrentPassword($event.value)"
  ></dx-text-box>

  <dx-text-box
    label="Nuova password"
    mode="password"
    [value]="formData().newPassword"
    (onValueChanged)="updateNewPassword($event.value)"
  ></dx-text-box>

  <dx-text-box
    label="Conferma password"
    mode="password"
    [value]="formData().confirmPassword"
    (onValueChanged)="updateConfirmPassword($event.value)"
  ></dx-text-box>

  @if (inlineError()) {
    <p class="error-message">{{ inlineError() }}</p>
  }

  <dx-button
    text="Salva"
    type="default"
    [disabled]="isLoading()"
    (onClick)="onSubmit()"
  ></dx-button>

  @if (isLoading()) {
    <dx-load-indicator></dx-load-indicator>
  }
</div>
