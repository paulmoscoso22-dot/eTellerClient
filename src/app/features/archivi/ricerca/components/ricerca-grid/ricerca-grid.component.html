<app-sempione-card>

  <app-sempione-card-header title="Risultati Ricerca" [count]="transactions().length > 0 ? transactions().length : undefined">
    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </app-sempione-card-header>

  <app-sempione-data-grid
    [dataSource]="transactions()"
    [columns]="columns"
    keyExpr="trxId"
    [isLoading]="isLoading()"
    [error]="error()"
    [showEditAction]="false"
    emptyStateText="Imposta i filtri e avvia la ricerca per visualizzare i dati.">
  </app-sempione-data-grid>

</app-sempione-card>
