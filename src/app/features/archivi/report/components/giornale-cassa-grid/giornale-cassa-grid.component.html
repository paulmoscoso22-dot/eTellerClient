<section class="card-section">

  <app-header-card title="Giornale di Cassa" [count]="transactions().length > 0 ? transactions().length : undefined">
    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
      <line x1="16" y1="13" x2="8" y2="13"></line>
      <line x1="16" y1="17" x2="8" y2="17"></line>
      <polyline points="10 9 9 9 8 9"></polyline>
    </svg>
  </app-header-card>

  <div class="card-body card-body--grid">

    @if (isLoading()) {
      <div class="state-message state-message--loading">
        <svg class="spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
        </svg>
        Caricamento in corso...
      </div>
    }

    @if (error()) {
      <div class="state-message state-message--error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        {{ error() }}
      </div>
    }

    @if (!isLoading() && !error() && transactions().length === 0) {
      <div class="state-message state-message--empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
        <span class="state-title">Nessun risultato</span>
        <span class="state-subtitle">Imposta i filtri e avvia la ricerca per visualizzare i dati.</span>
      </div>
    }

    @if (!isLoading() && !error() && transactions().length > 0) {
      <dx-data-grid
        id="gridContainer"
        [dataSource]="transactions()"
        keyExpr="trxId"
        [showBorders]="false"
        [columnAutoWidth]="true"
        [allowColumnReordering]="true"
        [allowColumnResizing]="true"
        [rowAlternationEnabled]="true"
        [hoverStateEnabled]="true"
        [height]="'100%'">

        <dxo-filter-row [visible]="showFilterRow" [applyFilter]="currentFilter"></dxo-filter-row>
        <dxo-header-filter [visible]="showHeaderFilter"></dxo-header-filter>
        <dxo-search-panel [visible]="true" [width]="240" placeholder="Cerca..."></dxo-search-panel>
        <dxo-paging [pageSize]="20"></dxo-paging>
        <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[20, 50, 100]" [showInfo]="true"></dxo-pager>

        <dxi-column dataField="trxId"          caption="ID"             [width]="80"  alignment="left"></dxi-column>
        <dxi-column dataField="genere"          caption="Genere"         [width]="90"  alignment="left"></dxi-column>
        <dxi-column dataField="tipo"            caption="Tipo"           [width]="90"  alignment="left"></dxi-column>
        <dxi-column dataField="report"          caption="Report"         [width]="100" alignment="left"></dxi-column>
        <dxi-column dataField="nop"             caption="Nop"            [width]="70"  alignment="center"></dxi-column>
        <dxi-column dataField="trxDivope"       caption="Div. Ope."      [width]="70"  alignment="center"></dxi-column>
        <dxi-column dataField="trxDivctp"       caption="Div. Ctp."      [width]="70"  alignment="center"></dxi-column>
        <dxi-column dataField="trxImpope"       caption="Imp. Ope."      [width]="110" alignment="right" dataType="number" format="#,##0.00"></dxi-column>
        <dxi-column dataField="bigliettiBanca"  caption="Biglietti Banca" [width]="120" alignment="right" dataType="number" format="#,##0.00"></dxi-column>
        <dxi-column dataField="nonContanti"     caption="Non Contanti"   [width]="120" alignment="right" dataType="number" format="#,##0.00"></dxi-column>
        <dxi-column dataField="contanti"        caption="Contanti"       [width]="110" alignment="right" dataType="number" format="#,##0.00"></dxi-column>
        <dxi-column dataField="impCHF"          caption="Imp. CHF"       [width]="110" alignment="right" dataType="number" format="#,##0.00"></dxi-column>
        <dxi-column dataField="stato"           caption="Stato"          [width]="90"  alignment="center"></dxi-column>

        <dxo-load-panel [enabled]="false"></dxo-load-panel>

      </dx-data-grid>
    }

  </div>

</section>
