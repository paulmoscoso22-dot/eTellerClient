<app-sempione-card>

  <app-sempione-card-header title="Giornale di Cassa" [count]="transactions().length > 0 ? transactions().length : undefined">
    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
      <line x1="16" y1="13" x2="8" y2="13"></line>
      <line x1="16" y1="17" x2="8" y2="17"></line>
      <polyline points="10 9 9 9 8 9"></polyline>
    </svg>
  </app-sempione-card-header>

  <app-sempione-data-grid
    [dataSource]="transactions()"
    keyExpr="trxId"
    [columns]="columns"
    [isLoading]="isLoading()"
    [error]="error()"
    [pageSize]="20"
    [allowedPageSizes]="[20, 50, 100]"
    [showEditAction]="false"
    noDataText="Nessun risultato. Imposta i filtri e avvia la ricerca per visualizzare i dati.">
  </app-sempione-data-grid>

</app-sempione-card>
