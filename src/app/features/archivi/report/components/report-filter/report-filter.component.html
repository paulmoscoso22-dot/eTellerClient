<div [formGroup]="searchForm">
  <app-sempione-card>

    <app-sempione-card-header title="Filtri di Selezione">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </app-sempione-card-header>

    <div class="filter-body">
      <div class="fields-grid fields-grid--3">

        @if (showCassa) {
          <div class="field-group">
            <label class="field-label">Cassa</label>
            <dx-text-box formControlName="trxCassa" placeholder="Codice Cassa" [showClearButton]="true"></dx-text-box>
          </div>
        }

        @if (showBranch) {
          <div class="field-group">
            <label class="field-label">Filiale</label>
            <dx-text-box formControlName="trxBraId" placeholder="Codice Filiale" [showClearButton]="true"></dx-text-box>
          </div>
        }

        @if (showStatus) {
          <div class="field-group">
            <label class="field-label">Status</label>
            @if (statusReadOnly) {
              <div class="status-badge" [ngClass]="'status-badge--' + statusDefaultValue">
                {{ statusLabel }}
              </div>
            } @else {
              <dx-number-box formControlName="trxStatus" [showClearButton]="true"></dx-number-box>
            }
          </div>
        }

        <div class="field-group">
          <label class="field-label">Data Dal</label>
          <dx-date-box formControlName="trxDataDal" type="date" displayFormat="dd/MM/yyyy"
            [showClearButton]="true"
            (onValueChanged)="onDateDalChanged($event)">
          </dx-date-box>
        </div>

        <div class="field-group">
          <label class="field-label">Data Al</label>
          <dx-date-box formControlName="trxDataAl" type="date" displayFormat="dd/MM/yyyy"
            [showClearButton]="true"
            (onValueChanged)="onDateAlChanged($event)">
          </dx-date-box>
        </div>

      </div>
    </div>

    <div class="action-bar">
      <app-sempione-button text="Annulla" icon="revert" (clicked)="reset()"></app-sempione-button>
      <app-sempione-button text="Ricerca" icon="search" variant="primary" [shadow]="true"
        [disabled]="isLoading()" (clicked)="search()">
      </app-sempione-button>
    </div>

  </app-sempione-card>
</div>
