<app-sempione-card>

  <app-sempione-card-header title="Operazioni Annullate" [count]="transactions().length > 0 ? transactions().length : undefined">
    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="15" y1="9" x2="9" y2="15"></line>
      <line x1="9" y1="9" x2="15" y2="15"></line>
    </svg>
  </app-sempione-card-header>

  <app-sempione-data-grid
    [dataSource]="transactions()"
    keyExpr="trxId"
    [columns]="columns"
    [isLoading]="isLoading()"
    [error]="error()"
    [pageSize]="20"
    [allowedPageSizes]="[20, 50, 100]"
    [showEditAction]="false"
    noDataText="Nessun risultato. Imposta i filtri e avvia la ricerca per visualizzare i dati.">
  </app-sempione-data-grid>

</app-sempione-card>
