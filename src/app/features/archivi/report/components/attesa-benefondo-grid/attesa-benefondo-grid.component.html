<app-sempione-card>

  <app-sempione-card-header title="Attesa Benefondo" [count]="transactions().length > 0 ? transactions().length : undefined">
    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <polyline points="12 6 12 12 16 14"></polyline>
    </svg>
  </app-sempione-card-header>

  <div class="card-body--grid">

    @if (isLoading()) {
      <div class="state-message state-message--loading">
        <svg class="spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
        </svg>
        Caricamento in corso...
      </div>
    }

    @if (error()) {
      <div class="state-message state-message--error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        {{ error() }}
      </div>
    }

    @if (!isLoading() && !error() && transactions().length === 0) {
      <div class="state-message state-message--empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span class="state-title">Nessun risultato</span>
        <span class="state-subtitle">Imposta i filtri e avvia la ricerca per visualizzare i dati.</span>
      </div>
    }

    @if (!isLoading() && !error() && transactions().length > 0) {
      <dx-data-grid
        id="gridContainer"
        [dataSource]="transactions()"
        keyExpr="trxId"
        [showBorders]="false"
        [columnAutoWidth]="true"
        [allowColumnReordering]="true"
        [allowColumnResizing]="true"
        [rowAlternationEnabled]="true"
        [hoverStateEnabled]="true"
        [height]="'100%'">

        <dxo-paging [pageSize]="20"></dxo-paging>
        <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[20, 50, 100]" [showInfo]="true"></dxo-pager>

        <dxi-column dataField="trxId"     caption="ID"      [width]="80"  alignment="left"></dxi-column>
        <dxi-column dataField="genere"    caption="Genere"  [width]="90"  alignment="left"></dxi-column>
        <dxi-column dataField="tipo"      caption="Tipo"    [width]="90"  alignment="left"></dxi-column>
        <dxi-column dataField="report"    caption="Report"  [width]="100" alignment="left"></dxi-column>
        <dxi-column dataField="trxCassa"  caption="Cassa"   [width]="90"  alignment="center"></dxi-column>
        <dxi-column dataField="trxUsrId"  caption="Utente"  [width]="100" alignment="left"></dxi-column>
        <dxi-column dataField="trxText1"  caption="Testo"               alignment="left"></dxi-column>

        <dxo-load-panel [enabled]="false"></dxo-load-panel>

      </dx-data-grid>
    }

  </div>

</app-sempione-card>
