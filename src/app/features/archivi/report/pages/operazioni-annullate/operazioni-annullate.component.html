<app-sempione-page-shell title="Operazioni Annullate">
  <app-report-filter
    [isLoading]="isLoading"
    [statusDefaultValue]="statusDefaultValue"
    [statusReadOnly]="true"
    (searchClick)="onSearch($event)"
  ></app-report-filter>

  <app-operazioni-annullate-grid
    [transactions]="transactions"

  ></app-operazioni-annullate-grid>
</app-sempione-page-shell>
