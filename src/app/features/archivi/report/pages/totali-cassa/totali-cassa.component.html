<app-sempione-page-header title="Totali Cassa"></app-sempione-page-header>

<div class="content-layout">

  <app-totale-cassa-filter
    [isLoading]="isLoading"
    (searchClick)="onSearch($event)">
  </app-totale-cassa-filter>

  <app-sempione-card>

    <app-sempione-card-header title="Totali Cassa" [count]="totaliCassa().length > 0 ? totaliCassa().length : undefined">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="7" width="20" height="14" rx="2"></rect>
        <path d="M16 3H8a2 2 0 0 0-2 2v2h12V5a2 2 0 0 0-2-2z"></path>
        <line x1="12" y1="12" x2="12" y2="16"></line>
        <line x1="10" y1="14" x2="14" y2="14"></line>
      </svg>
    </app-sempione-card-header>

    <app-sempione-data-grid
      [dataSource]="totaliCassa()"
      keyExpr="tocCurId"
      [columns]="columns"
      [isLoading]="isLoading()"
      [error]="error()"
      [pageSize]="20"
      [allowedPageSizes]="[20, 50, 100]"
      [showEditAction]="false"
      noDataText="Nessun risultato. Refina i filtri e avvia una nuova ricerca.">
    </app-sempione-data-grid>

  </app-sempione-card>

</div>
