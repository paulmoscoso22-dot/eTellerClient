<app-sempione-page-header title="Attesa Benefondo"></app-sempione-page-header>

<div class="page-shell">
  <!-- Search Form -->
  <app-report-filter
    [isLoading]="isLoading"
    [statusDefaultValue]="statusDefaultValue"
    [statusReadOnly]="true"
    [dataDalRequired]="true"
    [dataAlRequired]="true"
    (searchClick)="onSearch($event)"
  ></app-report-filter>

  <!-- Grid Component -->
  <app-attesa-benefondo-grid
    [transactions]="transactions"
    [isLoading]="isLoading"
    [error]="error"
  ></app-attesa-benefondo-grid>
</div>
