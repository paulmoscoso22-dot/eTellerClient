<app-sempione-page-shell title="Giornale di Cassa">
  <app-report-filter
    [isLoading]="isLoading"
    [statusDefaultValue]="statusDefaultValue"
    [statusReadOnly]="true"
    [dataDalRequired]="true"
    [dataAlRequired]="true"
    (searchClick)="onSearch($event)"
  ></app-report-filter>

  <app-giornale-cassa-grid
    [transactions]="transactions"
    [isLoading]="isLoading"
    [error]="error"
  ></app-giornale-cassa-grid>
</app-sempione-page-shell>
