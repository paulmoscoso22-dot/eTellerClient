<div class="ra-cell">

  @if (showView()) {
    <button class="ra-btn ra-btn--view" title="Visualizza" (click)="view.emit(); $event.stopPropagation()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </button>
  }

  @if (showEdit()) {
    <button class="ra-btn ra-btn--edit" title="Modifica" (click)="edit.emit(); $event.stopPropagation()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
    </button>
  }

  @if (!useOverflow()) {
    @if (showTrace()) {
      <button class="ra-btn ra-btn--trace" title="Storico" (click)="trace.emit(); $event.stopPropagation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </button>
    }
    @if (showDelete()) {
      <button class="ra-btn ra-btn--delete" title="Elimina" (click)="delete.emit(); $event.stopPropagation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          <path d="M10 11v6"></path><path d="M14 11v6"></path>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
        </svg>
      </button>
    }
    @if (showForce()) {
      <button class="ra-btn ra-btn--force" title="Forza Uscita" (click)="force.emit(); $event.stopPropagation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    }
  }

  @if (useOverflow()) {
    <button class="ra-more-trigger" [class.open]="menuOpen()" title="Altre azioni" (click)="openMenu($event)">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" width="13" height="13">
        <circle cx="12" cy="5" r="1.8"></circle>
        <circle cx="12" cy="12" r="1.8"></circle>
        <circle cx="12" cy="19" r="1.8"></circle>
      </svg>
    </button>
    @if (menuOpen()) {
      <div class="ra-more-menu" [style.top.px]="menuTop()" [style.left.px]="menuLeft()">
        @if (showTrace()) {
          <button class="ra-more-item ra-more-item--trace" (click)="trace.emit(); closeMenu(); $event.stopPropagation()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            Storico
          </button>
        }
        @if (showDelete()) {
          <button class="ra-more-item ra-more-item--danger" (click)="delete.emit(); closeMenu(); $event.stopPropagation()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14H6L5 6"></path>
              <path d="M10 11v6M14 11v6"></path>
              <path d="M9 6V4h6v2"></path>
            </svg>
            Elimina
          </button>
        }
        @if (showForce()) {
          <button class="ra-more-item ra-more-item--force" (click)="force.emit(); closeMenu(); $event.stopPropagation()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Forza Uscita
          </button>
        }
      </div>
    }
  }

</div>
